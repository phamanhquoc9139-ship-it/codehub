<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo V3.4 | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-6xl mx-auto p-4 md:p-6">
<div class="flex justify-between gap-3 flex-wrap mb-5"><div><h1 class="text-3xl font-black">🔔 Thông báo CodeHub <span class="text-violet-600 text-lg">V3.4</span></h1><p id="sub" class="text-slate-500">Tạo thông báo cho học sinh</p></div><a href="teacher.html" class="border bg-white rounded-xl px-4 py-2 font-bold">← Dashboard</a></div>
<div id="msg" class="hidden p-3 rounded-xl mb-4"></div>
<div class="grid lg:grid-cols-[420px_1fr] gap-5">
<section class="bg-white rounded-2xl shadow p-5"><h2 class="text-xl font-black mb-4">✍️ Tạo thông báo</h2><form id="f" class="space-y-3">
<input id="title" class="w-full border rounded-xl p-3" placeholder="Tiêu đề" required><textarea id="body" rows="6" class="w-full border rounded-xl p-3" placeholder="Nội dung thông báo" required></textarea>
<label class="font-bold block">Mức độ<select id="priority" class="w-full border rounded-xl p-3 mt-1"><option value="normal">Thông thường</option><option value="important">Quan trọng</option><option value="urgent">Khẩn</option></select></label>
<label class="font-bold block">Phạm vi<select id="targetType" class="w-full border rounded-xl p-3 mt-1"><option value="class">Theo lớp</option></select></label>
<div id="classesBox"><div class="font-bold mb-2">Chọn lớp</div><div id="classes" class="grid grid-cols-2 gap-2 max-h-52 overflow-auto border rounded-xl p-3"></div></div>
<label class="font-bold block">Hết hạn (không bắt buộc)<input id="expires" type="datetime-local" class="w-full border rounded-xl p-3 mt-1"></label>
<button class="w-full bg-blue-600 text-white rounded-xl p-3 font-black">📣 Gửi thông báo</button></form></section>
<section class="bg-white rounded-2xl shadow p-5"><div class="flex justify-between gap-2 mb-4"><h2 class="text-xl font-black">📋 Thông báo đã tạo</h2><button id="reload" class="border rounded-xl px-3 py-2">Làm mới</button></div><div id="list" class="space-y-3"></div></section>
</div></main>
<script>
const s=window.supabaseClient,$=x=>document.getElementById(x);let me,role;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const fmt=v=>v?new Date(v).toLocaleString("vi-VN"):"—";
function show(t,ok=true){$("msg").className=`p-3 rounded-xl mb-4 ${ok?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-700"}`;$("msg").textContent=t}
async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";const p=await s.from("profiles").select("role,full_name").eq("id",me.id).single();if(p.error)throw p.error;role=String(p.data?.role||"").toLowerCase();if(!["admin","teacher"].includes(role))return location.href="student-dashboard.html";$("sub").textContent=(role==="admin"?"Quản trị viên":"Giáo viên")+" • "+(p.data?.full_name||"");if(role==="admin")$("targetType").insertAdjacentHTML("afterbegin",'<option value="global">Toàn hệ thống</option>');const cr=await s.rpc("codehub_v34_target_classes");if(cr.error)return show(cr.error.message,false);$("classes").innerHTML=(cr.data||[]).map(c=>`<label class="border rounded-lg p-2"><input type="checkbox" value="${c.class_id}" class="mr-2 cls">${esc(c.class_name)}</label>`).join("")||"Không có lớp được phân công.";await load();}
$("targetType").onchange=()=>{$("classesBox").style.display=$("targetType").value==="global"?"none":"block"};
$("f").onsubmit=async e=>{e.preventDefault();const ids=[...document.querySelectorAll(".cls:checked")].map(x=>x.value);const exp=$("expires").value?new Date($("expires").value).toISOString():null;const r=await s.rpc("codehub_v34_create_announcement",{p_title:$("title").value,p_body:$("body").value,p_priority:$("priority").value,p_target_type:$("targetType").value,p_class_ids:ids,p_expires_at:exp});if(r.error)return show(r.error.message,false);show("Đã gửi thông báo.");$("f").reset();$("targetType").dispatchEvent(new Event("change"));await load();};
async function load(){const r=await s.rpc("codehub_v34_manage_announcements");if(r.error)return show(r.error.message,false);$("list").innerHTML=(r.data||[]).map(x=>`<div class="border rounded-xl p-4"><div class="flex justify-between gap-3"><div><div class="font-black">${x.priority==="urgent"?"🚨":x.priority==="important"?"⚠️":"📢"} ${esc(x.title)}</div><div class="text-sm text-slate-500">${esc(x.target_classes)} • ${fmt(x.created_at)}</div></div><button onclick="toggleActive('${x.id}',${!x.is_active})" class="text-sm font-bold ${x.is_active?"text-red-600":"text-emerald-600"}">${x.is_active?"Tắt":"Bật"}</button></div><div class="mt-2 whitespace-pre-wrap">${esc(x.body)}</div><div class="text-xs text-slate-500 mt-2">Hết hạn: ${fmt(x.expires_at)} • ${x.is_active?"Đang hoạt động":"Đã tắt"}</div></div>`).join("")||'<div class="text-slate-500">Chưa có thông báo.</div>';}
window.toggleActive=async(id,val)=>{const r=await s.rpc("codehub_v34_set_announcement_active",{p_id:id,p_active:val});if(r.error)return show(r.error.message,false);await load();};$("reload").onclick=load;init().catch(e=>show(e.message,false));
</script></body></html>
