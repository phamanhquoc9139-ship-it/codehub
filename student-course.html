<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khóa học | CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800;color:#3182f6}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#3182f6;color:#fff}main{max-width:1100px;margin:36px auto;padding:0 20px}h1{font-size:34px;margin:0 0 8px}.sub{color:#64748b;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}.card,.content{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 18px #0000000d}.title{font-size:21px;font-weight:800;margin:10px 0}.meta{color:#64748b;line-height:1.65}.chip,.resource{display:inline-block;background:#e8f1ff;color:#2563eb;padding:5px 10px;border-radius:15px;font-size:12px;font-weight:700;margin:9px 4px 5px 0}.empty{background:#fff;padding:40px;text-align:center;border-radius:15px;color:#64748b}.back{color:#2563eb;font-weight:700;cursor:pointer;margin-bottom:18px}.lesson{background:#fff;border-radius:15px;padding:20px;margin-bottom:13px;display:grid;grid-template-columns:55px 1fr auto;gap:15px;align-items:center}.order{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e8f1ff;color:#2563eb;font-weight:800}.content{line-height:1.75;white-space:pre-wrap}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.links a{text-decoration:none;background:#3182f6;color:#fff;padding:11px 15px;border-radius:9px;font-weight:700}@media(max-width:700px){header{flex-direction:column;gap:10px}.lesson{grid-template-columns:48px 1fr}.lesson .btn{grid-column:1/-1}}</style></head><body><header><div class="logo">&lt;/&gt; CodeHub</div><button class="btn" onclick="location.href='student-dashboard.html'">Khóa học của em</button></header><main><div class="back" onclick="location.href='student-dashboard.html'">← Quay lại</div><h1 id="name">📘 Khóa học</h1><div class="sub" id="info">Đang tải...</div><div id="list"></div></main><script>
const courseId=new URLSearchParams(location.search).get("course");
document.addEventListener("DOMContentLoaded",async()=>{const s=window.supabaseClient;if(!courseId){location.href="student-dashboard.html";return}const u=await s.auth.getUser();if(!u.data.user){location.href="login.html";return}const p=await s.from("profiles").select("role").eq("id",u.data.user.id).single();if(!p.data||p.data.role!=="student"){location.href="index.html";return}const c=await s.from("courses").select("*").eq("id",courseId).eq("is_published",true).single();if(c.error){alert("Không mở được khóa học.");location.href="student-dashboard.html";return}name.textContent="📘 "+c.data.title;info.textContent=(c.data.subject||"")+" • Khối "+c.data.grade+" • "+(c.data.description||"");const r=await s.from("lessons").select("*").eq("course_id",courseId).eq("is_published",true).order("lesson_order");if(r.error){alert(r.error.message);return}render(r.data||[])});
function render(a){list.innerHTML="";if(!a.length){list.innerHTML='<div class="empty">Chưa có bài học được xuất bản.</div>';return}a.forEach(x=>{const e=document.createElement("div");e.className="lesson";e.innerHTML='<div class="order"></div><div><div class="title"></div><div class="meta"></div><div class="tags"></div></div><button class="btn">Học bài →</button>';e.querySelector(".order").textContent=String(x.lesson_order).padStart(2,"0");e.querySelector(".title").textContent=x.title;e.querySelector(".meta").textContent=x.description||"";const t=e.querySelector(".tags");if(x.video_url)t.innerHTML+='<span class="resource">🎬 Video</span>';if(x.document_url)t.innerHTML+='<span class="resource">📄 Tài liệu</span>';e.querySelector("button").onclick=()=>location.href="student-lesson.html?lesson="+encodeURIComponent(x.id);list.appendChild(e)})}</script></body></html>
