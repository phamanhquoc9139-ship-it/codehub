<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Làm Quiz V3.7.19 | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-4xl mx-auto p-5"><div class="sticky top-0 z-10 bg-white shadow rounded-2xl p-4 mb-5 flex justify-between gap-4"><div><h1 id="h" class="font-bold text-xl">Bài kiểm tra</h1><p id="info" class="text-sm text-slate-500"></p></div><div class="flex items-center gap-3 flex-wrap justify-end">
  <div id="unansweredBox" class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-2 text-center min-w-[118px]">
    <div class="text-xs font-bold text-amber-700 uppercase">Chưa làm</div>
    <div id="unanswered" class="text-2xl font-extrabold text-amber-600">0</div>
  </div>
  <div id="timer" class="text-2xl font-bold text-red-600">--:--</div>
  <a href="student-quizzes-v4.html" class="border px-3 py-2 rounded-xl">Thoát</a>
</div></div><div id="error" class="hidden bg-red-50 text-red-700 p-4 rounded-xl mb-4"></div><form id="form"><div id="list" class="space-y-4"></div><button id="submit" class="w-full mt-5 bg-emerald-600 text-white p-4 rounded-xl font-bold">Nộp bài</button></form></main><script>
const s=window.supabaseClient,$=x=>document.getElementById(x),aid=new URLSearchParams(location.search).get("assignment");let asg=null,qs=[],started=null,tick=null,submitting=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function fail(t){$("error").classList.remove("hidden");$("error").textContent=t;$("form").classList.add("hidden")}
async function init(){try{let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";if(!aid){fail("Thiếu mã bài kiểm tra.");return}let r=await s.rpc("codehub_v3718_student_quiz_open",{p_assignment:aid});if(r.error)throw r.error;asg=r.data;qs=asg.questions||[];$("h").textContent=asg.title||"Bài kiểm tra";$("info").textContent=`${qs.length} câu • ${asg.time_limit} phút • lượt ${Number(asg.attempts_used||0)+1}/${asg.max_attempts}`;$("list").innerHTML=qs.map((x,i)=>`<div class="bg-white shadow rounded-2xl p-5"><div class="font-bold mb-3">Câu ${i+1}. ${esc(x.question_text)}</div>${["A","B","C","D"].map(k=>`<label class="block border rounded-xl p-3 mb-2 cursor-pointer hover:bg-blue-50"><input type="radio" name="q_${x.id}" value="${k}"> <b>${k}.</b> ${esc(x["option_"+k.toLowerCase()])}</label>`).join("")}</div>`).join("");
  $("list").addEventListener("change",e=>{if(e.target.matches('input[type="radio"]'))updateUnanswered()});
  updateUnanswered();
  started=new Date().toISOString();runTimer()}catch(e){console.error(e);fail("Không mở được bài kiểm tra: "+(e?.message||String(e)))}}

function getUnansweredCount(){
  return qs.reduce((n,q)=>n+(document.querySelector(`input[name="q_${q.id}"]:checked`)?0:1),0);
}
function updateUnanswered(){
  const n=getUnansweredCount();
  const box=$("unansweredBox");
  $("unanswered").textContent=`${n}/${qs.length}`;
  if(n===0){
    box.className="rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-2 text-center min-w-[118px]";
    box.querySelector("div:first-child").className="text-xs font-bold text-emerald-700 uppercase";
    $("unanswered").className="text-2xl font-extrabold text-emerald-600";
  }else{
    box.className="rounded-xl bg-amber-50 border border-amber-200 px-4 py-2 text-center min-w-[118px]";
    box.querySelector("div:first-child").className="text-xs font-bold text-amber-700 uppercase";
    $("unanswered").className="text-2xl font-extrabold text-amber-600";
  }
}

function runTimer(){let end=Date.now()+Number(asg.time_limit||15)*60000;tick=setInterval(()=>{let d=Math.max(0,end-Date.now()),m=Math.floor(d/60000),ss=Math.floor((d%60000)/1000);$("timer").textContent=`${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;if(!d){clearInterval(tick);submitQuiz(true)}},1000)}
$("form").onsubmit=e=>{e.preventDefault();submitQuiz(false)};
async function submitQuiz(auto){
 if(submitting)return;
 if(!auto){
   const n=getUnansweredCount();
   const text=n>0
     ?`Em còn ${n}/${qs.length} câu chưa làm. Vẫn nộp bài?`
     :"Em đã trả lời đủ câu. Nộp bài ngay?";
   if(!confirm(text))return;
 }
 submitting=true;$("submit").disabled=true;clearInterval(tick);let ans={};qs.forEach(q=>{let x=document.querySelector(`input[name="q_${q.id}"]:checked`);if(x)ans[q.id]=x.value});try{let r=await s.rpc("codehub_v3718_student_quiz_submit",{p_assignment:aid,p_answers:ans,p_started_at:started});if(r.error)throw r.error;let x=r.data||{};alert(x.show_result?`Đã nộp. Điểm: ${x.score}/10 • Đúng ${x.correct_count}/${x.total_questions}`:"Đã nộp bài.");location.href=x.show_result?`student-quiz-result-v4-2.html?assignment=${encodeURIComponent(aid)}`:"student-quizzes-v4.html"}catch(e){submitting=false;$("submit").disabled=false;alert("Không nộp được bài: "+(e?.message||String(e)));runTimer()}}
init();
</script></body></html>
