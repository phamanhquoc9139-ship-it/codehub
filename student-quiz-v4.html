<script src="scripts/supabase-config.js"></script><style>.stem-svg svg{max-width:100%;height:auto;display:block;margin:auto}.math-wrap mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}</style></head>
<body class="bg-slate-50"><main class="max-w-5xl mx-auto p-5"><div class="sticky top-0 z-10 bg-white shadow rounded-2xl p-4 mb-5 flex justify-between gap-4"><div><h1 id="h" class="font-bold text-xl">Bài kiểm tra</h1><p id="info" class="text-sm text-slate-500"></p></div><div class="flex items-center gap-3 flex-wrap justify-end"><div id="unansweredBox" class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-2 text-center min-w-[118px]"><div class="text-xs font-bold text-amber-700 uppercase">Chưa làm</div><div id="unanswered" class="text-2xl font-extrabold text-amber-600">0</div></div><div id="timer" class="text-2xl font-bold text-red-600">--:--</div><a href="student-quizzes-v4.html" class="border px-3 py-2 rounded-xl">Thoát</a></div></div><div id="error" class="hidden bg-red-50 text-red-700 p-4 rounded-xl mb-4"></div><form id="form"><div id="list" class="space-y-4"></div><button id="submit" class="w-full mt-5 bg-emerald-600 text-white p-4 rounded-xl font-bold">Nộp bài</button></form></main>
<script>
const s=window.supabaseClient,$=x=>document.getElementById(x),aid=new URLSearchParams(location.search).get("assignment");let asg=null,qs=[],started=null,tick=null,submitting=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function typesetMath(root=document){if(window.MathJax?.typesetPromise)setTimeout(()=>MathJax.typesetPromise([root]).catch(()=>{}),0)}
function sanitizeSvg(raw){const txt=String(raw||"").trim();if(!txt||!/<svg[\s>]/i.test(txt))return"";try{const d=new DOMParser().parseFromString(txt,"image/svg+xml"),svg=d.documentElement;if(!svg||String(svg.nodeName).toLowerCase()!=="svg")return"";const allowed=new Set(["svg","g","line","polyline","polygon","rect","circle","ellipse","path","text","tspan","defs","marker"]),attrs=new Set(["xmlns","viewBox","width","height","x","y","x1","y1","x2","y2","cx","cy","r","rx","ry","d","points","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","font-size","font-family","font-weight","text-anchor","dominant-baseline","transform","marker-start","marker-end","orient","refX","refY","markerWidth","markerHeight"]);[...svg.querySelectorAll("*")].forEach(el=>{if(!allowed.has(el.tagName.toLowerCase())){el.remove();return}[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on")||!attrs.has(a.name)||/url\s*\(|javascript:|https?:|data:/i.test(a.value))el.removeAttribute(a.name)})});[...svg.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on")||!attrs.has(a.name)||/javascript:|https?:|data:/i.test(a.value))svg.removeAttribute(a.name)});svg.setAttribute("xmlns","http://www.w3.org/2000/svg");if(!svg.getAttribute("viewBox")){const w=parseFloat(svg.getAttribute("width")||"800")||800,h=parseFloat(svg.getAttribute("height")||"400")||400;svg.setAttribute("viewBox",`0 0 ${w} ${h}`)}svg.removeAttribute("width");svg.removeAttribute("height");return new XMLSerializer().serializeToString(svg)}catch{return""}}
function visualHtml(raw){const x=sanitizeSvg(raw);return x?`<div class="stem-svg bg-white border rounded-xl p-3 mb-4">${x}</div>`:""}
function fail(t){$("error").classList.remove("hidden");$("error").textContent=t;$("form").classList.add("hidden")}
function inputHtml(q){
 if(q.question_type==="short_answer")return `<input name="q_${q.id}" type="text" autocomplete="off" class="short w-full border rounded-xl p-3" placeholder="Nhập câu trả lời...">`;
 if(q.question_type==="numeric")return `<div><input name="q_${q.id}" type="text" inputmode="decimal" autocomplete="off" class="numeric w-full border rounded-xl p-3" placeholder="Nhập đáp án số${q.unit_required&&q.answer_unit?` và đơn vị (${esc(q.answer_unit)})`:""}..."><div class="text-xs text-slate-500 mt-1">Có thể dùng dấu phẩy hoặc dấu chấm thập phân.${q.unit_required&&q.answer_unit?` Đơn vị yêu cầu: ${esc(q.answer_unit)}.`:""}</div></div>`;
 if(q.question_type==="true_false")return `<div class="grid sm:grid-cols-2 gap-2"><label class="block border rounded-xl p-3 cursor-pointer hover:bg-blue-50"><input type="radio" name="q_${q.id}" value="T"> <b>Đúng</b></label><label class="block border rounded-xl p-3 cursor-pointer hover:bg-blue-50"><input type="radio" name="q_${q.id}" value="F"> <b>Sai</b></label></div>`;
 return ["A","B","C","D"].map(k=>`<label class="block border rounded-xl p-3 mb-2 cursor-pointer hover:bg-blue-50"><input type="radio" name="q_${q.id}" value="${k}"> <b>${k}.</b> ${esc(q["option_"+k.toLowerCase()])}</label>`).join("");
}
function renderQuestions(){let h="",lastSec="__",lastStim="__";qs.forEach((q,i)=>{const sec=q.section_key||q.section_title||"FREE";if(sec!==lastSec){h+=`<section class="bg-slate-900 text-white rounded-2xl p-4 mt-6"><div class="font-bold text-lg">${esc(q.section_title||"PHẦN CÂU HỎI")}</div>${q.section_instruction?`<div class="text-sm mt-1">${esc(q.section_instruction)}</div>`:""}</section>`;lastSec=sec;lastStim="__"}if(q.stimulus&&q.stimulus!==lastStim){h+=`<section class="bg-blue-50 border border-blue-200 rounded-2xl p-5 whitespace-pre-wrap leading-relaxed math-wrap">${esc(q.stimulus)}</section>`;lastStim=q.stimulus}h+=`<div class="bg-white shadow rounded-2xl p-5 math-wrap">${visualHtml(q.visual_svg)}<div class="font-bold mb-3">Câu ${i+1}. ${esc(q.question_text)}</div>${inputHtml(q)}</div>`});$("list").innerHTML=h;$("list").addEventListener("change",updateUnanswered);$("list").addEventListener("input",updateUnanswered);typesetMath($("list"))}
async function init(){try{const u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";if(!aid){fail("Thiếu mã bài kiểm tra.");return}const r=await s.rpc("codehub_v3724_student_quiz_open",{p_assignment:aid});if(r.error)throw r.error;asg=r.data;qs=asg.questions||[];$("h").textContent=asg.title||"Bài kiểm tra";$("info").textContent=`${qs.length} câu • ${asg.time_limit} phút • lượt ${Number(asg.attempts_used||0)+1}/${asg.max_attempts}`;renderQuestions();updateUnanswered();started=new Date().toISOString();runTimer()}catch(e){console.error(e);fail("Không mở được bài kiểm tra: "+(e?.message||String(e)))}}
function answerValue(q){if(q.question_type==="short_answer"||q.question_type==="numeric")return document.querySelector(`input[name="q_${q.id}"]`)?.value?.trim()||"";return document.querySelector(`input[name="q_${q.id}"]:checked`)?.value||""}
function getUnansweredCount(){return qs.reduce((n,q)=>n+(answerValue(q)?0:1),0)}
function updateUnanswered(){const n=getUnansweredCount(),box=$("unansweredBox");$("unanswered").textContent=`${n}/${qs.length}`;if(n===0){box.className="rounded-xl bg-emerald-50 border border-emerald-200 px-4 py-2 text-center min-w-[118px]";box.querySelector("div:first-child").className="text-xs font-bold text-emerald-700 uppercase";$("unanswered").className="text-2xl font-extrabold text-emerald-600"}else{box.className="rounded-xl bg-amber-50 border border-amber-200 px-4 py-2 text-center min-w-[118px]";box.querySelector("div:first-child").className="text-xs font-bold text-amber-700 uppercase";$("unanswered").className="text-2xl font-extrabold text-amber-600"}}
function runTimer(){const end=Date.now()+Number(asg.time_limit||15)*60000;tick=setInterval(()=>{const d=Math.max(0,end-Date.now()),m=Math.floor(d/60000),ss=Math.floor((d%60000)/1000);$("timer").textContent=`${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;if(!d){clearInterval(tick);submitQuiz(true)}},1000)}
$("form").onsubmit=e=>{e.preventDefault();submitQuiz(false)};
async function submitQuiz(auto){if(submitting)return;if(!auto){const n=getUnansweredCount(),text=n>0?`Em còn ${n}/${qs.length} câu chưa làm. Vẫn nộp bài?`:"Em đã trả lời đủ câu. Nộp bài ngay?";if(!confirm(text))return}submitting=true;$("submit").disabled=true;clearInterval(tick);const ans={};qs.forEach(q=>{const v=answerValue(q);if(v)ans[q.id]=v});try{const r=await s.rpc("codehub_v3724_student_quiz_submit",{p_assignment:aid,p_answers:ans,p_started_at:started});if(r.error)throw r.error;const x=r.data||{};alert(x.show_result?`Đã nộp. Điểm: ${x.score}/10 • Đúng ${x.correct_count}/${x.total_questions}`:"Đã nộp bài.");location.href=x.show_result?`student-quiz-result-v4-2.html?assignment=${encodeURIComponent(aid)}`:"student-quizzes-v4.html"}catch(e){submitting=false;$("submit").disabled=false;alert("Không nộp được bài: "+(e?.message||String(e)));runTimer()}}
init();
</script></body></html>
