<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài học | CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800;color:#3182f6}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#3182f6;color:#fff}main{max-width:1100px;margin:36px auto;padding:0 20px}h1{font-size:34px;margin:0 0 8px}.sub{color:#64748b;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}.card,.content{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 18px #0000000d}.title{font-size:21px;font-weight:800;margin:10px 0}.meta{color:#64748b;line-height:1.65}.chip,.resource{display:inline-block;background:#e8f1ff;color:#2563eb;padding:5px 10px;border-radius:15px;font-size:12px;font-weight:700;margin:9px 4px 5px 0}.empty{background:#fff;padding:40px;text-align:center;border-radius:15px;color:#64748b}.back{color:#2563eb;font-weight:700;cursor:pointer;margin-bottom:18px}.lesson{background:#fff;border-radius:15px;padding:20px;margin-bottom:13px;display:grid;grid-template-columns:55px 1fr auto;gap:15px;align-items:center}.order{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e8f1ff;color:#2563eb;font-weight:800}.content{line-height:1.75;white-space:pre-wrap}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.links a{text-decoration:none;background:#3182f6;color:#fff;padding:11px 15px;border-radius:9px;font-weight:700}@media(max-width:700px){header{flex-direction:column;gap:10px}.lesson{grid-template-columns:48px 1fr}.lesson .btn{grid-column:1/-1}}</style></head><body><header><div class="logo">&lt;/&gt; CodeHub</div><button class="btn" onclick="location.href='student-dashboard.html'">Trang học sinh</button></header><main><div class="back" id="back">← Quay lại khóa học</div><h1 id="title">📖 Bài học</h1><div class="sub" id="desc"></div><div class="content" id="content">Đang tải...</div><div class="links" id="links"></div></main><script>
const lessonId=new URLSearchParams(location.search).get("lesson");
document.addEventListener("DOMContentLoaded",async()=>{const s=window.supabaseClient;if(!lessonId){location.href="student-dashboard.html";return}const u=await s.auth.getUser();if(!u.data.user){location.href="login.html";return}const p=await s.from("profiles").select("role").eq("id",u.data.user.id).single();if(!p.data||p.data.role!=="student"){location.href="index.html";return}const r=await s.from("lessons").select("*").eq("id",lessonId).eq("is_published",true).single();if(r.error){alert("Không mở được bài học.");location.href="student-dashboard.html";return}const x=r.data;title.textContent="📖 "+x.title;desc.textContent=x.description||"";content.textContent=x.content||"Bài học này chưa có nội dung.";back.onclick=()=>location.href="student-course.html?course="+encodeURIComponent(x.course_id);if(x.video_url)addLink(x.video_url,"🎬 Xem video");if(x.document_url)addLink(x.document_url,"📄 Mở tài liệu")});function addLink(url,label){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent=label;links.appendChild(a)}</script></body></html>
