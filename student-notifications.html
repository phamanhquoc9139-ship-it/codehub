<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo của em V3.4 | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-4xl mx-auto p-4 md:p-6"><div class="flex justify-between gap-3 flex-wrap mb-5"><div><h1 class="text-3xl font-black">🔔 Thông báo của em <span class="text-violet-600 text-lg">V3.4</span></h1><p id="sub" class="text-slate-500"></p></div><a href="student-dashboard.html" class="border bg-white rounded-xl px-4 py-2 font-bold">← Dashboard</a></div><div class="grid grid-cols-2 gap-3 mb-5"><div class="bg-white shadow rounded-2xl p-4"><div class="text-slate-500">Tất cả</div><div id="total" class="text-3xl font-black">0</div></div><div class="bg-white shadow rounded-2xl p-4"><div class="text-slate-500">Chưa đọc</div><div id="unread" class="text-3xl font-black text-red-600">0</div></div></div><div id="list" class="space-y-3"></div></main>
<script>
const s=window.supabaseClient,$=x=>document.getElementById(x);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const fmt=v=>v?new Date(v).toLocaleString("vi-VN"):"—";
async function init(){const u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";const p=await s.from("profiles").select("role,full_name,class_name").eq("id",u.id).single();if(p.data?.role!=="student")return location.href="teacher.html";$("sub").textContent=(p.data?.full_name||"Học sinh")+" • Lớp "+(p.data?.class_name||"—");await load();}
async function load(){const r=await s.rpc("codehub_v34_my_announcements");if(r.error){alert(r.error.message);return}const rows=r.data||[];$("total").textContent=rows.length;$("unread").textContent=rows.filter(x=>!x.is_read).length;$("list").innerHTML=rows.map(x=>`<article class="bg-white shadow rounded-2xl p-5 border-l-4 ${x.priority==="urgent"?"border-red-500":x.priority==="important"?"border-orange-500":"border-blue-500"} ${x.is_read?"opacity-70":""}"><div class="flex justify-between gap-3"><div><h2 class="font-black text-xl">${x.priority==="urgent"?"🚨":x.priority==="important"?"⚠️":"📢"} ${esc(x.title)}</h2><div class="text-sm text-slate-500">${fmt(x.created_at)} • ${esc(x.creator_name||"CodeHub")}</div></div>${x.is_read?'<span class="text-emerald-600 font-bold">Đã đọc</span>':`<button onclick="markRead('${x.id}')" class="bg-blue-600 text-white px-3 py-2 rounded-xl font-bold">Đánh dấu đã đọc</button>`}</div><div class="mt-3 whitespace-pre-wrap">${esc(x.body)}</div></article>`).join("")||'<div class="bg-white shadow rounded-2xl p-6 text-center text-slate-500">Hiện chưa có thông báo.</div>';}
window.markRead=async id=>{const r=await s.rpc("codehub_v34_mark_announcement_read",{p_id:id});if(r.error)return alert(r.error.message);await load();};init();
</script></body></html>
