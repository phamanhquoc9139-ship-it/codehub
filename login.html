<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - CodeHub</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">

    <!-- 1. Thư viện Supabase JS qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. File cấu hình Supabase Client của dự án -->
    <script src="scripts/supabase-config.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar đơn giản -->
    <header class="w-full bg-white dark:bg-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <svg class="h-8 w-8 text-primary group-hover:scale-105 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">CodeHub</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Quay lại Trang Chủ
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            
            <!-- Header Card -->
            <div class="bg-gradient-to-r from-primary to-blue-600 p-6 text-center text-white">
                <div class="inline-flex p-3 bg-white/10 rounded-full mb-3 backdrop-blur-sm">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 id="authTitle" class="text-2xl font-bold tracking-tight">Chào Mừng Đến Với CodeHub</h1>
                <p id="authSubtitle" class="text-blue-100 text-xs sm:text-sm mt-1">Đăng nhập để lưu tiến độ và kết quả học tập</p>
            </div>

            <!-- Tab Switchers -->
            <div class="flex border-b border-gray-200 dark:border-gray-700">
                <button id="tabLogin" type="button" class="flex-1 py-3 text-sm font-semibold text-primary border-b-2 border-primary focus:outline-none transition-colors">
                    Đăng Nhập
                </button>
                <button id="tabRegister" type="button" class="flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition-colors">
                    Đăng Ký Tài Khoản
                </button>
            </div>

            <div class="p-6 sm:p-8">
                <!-- Alert Box Thông Báo -->
                <div id="alertBox" class="hidden mb-5 p-3.5 rounded-lg text-sm flex items-start gap-2.5">
                    <span id="alertIcon" class="text-lg leading-none"></span>
                    <div id="alertMessage" class="flex-1"></div>
                </div>

                <!-- Form Auth -->
                <form id="authForm" class="space-y-4">
                    <!-- Tên hiển thị (chỉ hiện khi Đăng Ký) -->
                    <div id="fullNameGroup" class="hidden">
                        <label for="fullName" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">
                            Họ và Tên
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="fullName" placeholder="Nguyễn Văn A"
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent text-sm outline-none transition">
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div>
                        <label for="email" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">
                            Email <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                                </svg>
                            </span>
                            <input type="email" id="email" required placeholder="hocsinh@truong.edu.vn"
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent text-sm outline-none transition">
                        </div>
                    </div>

                    <!-- Mật khẩu Input -->
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label for="password" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider">
                                Mật khẩu <span class="text-red-500">*</span>
                            </label>
                            <button type="button" id="btnForgotPassword" class="text-xs text-primary hover:underline focus:outline-none">
                                Quên mật khẩu?
                            </button>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </span>
                            <input type="password" id="password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                                class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent text-sm outline-none transition">
                            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                                👁️
                            </button>
                        </div>
                    </div>

                    <!-- Nút Submit -->
                    <button type="submit" id="btnSubmit"
                        class="w-full mt-2 py-3 px-4 bg-primary hover:bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all flex items-center justify-center gap-2">
                        <span id="btnText">Đăng Nhập</span>
                        <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                    </button>
                </form>

                <!-- Box thông tin tài khoản khi đã đăng nhập -->
                <div id="loggedInState" class="hidden text-center py-4 space-y-4">
                    <div class="w-16 h-16 bg-green-100 text-green-600 dark:bg-green-900/40 dark:text-green-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                        ✓
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-gray-900 dark:text-white">Bạn Đã Đăng Nhập</h3>
                        <p id="currentUserEmail" class="text-sm text-gray-500 dark:text-gray-400 mt-1"></p>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <a id="btnEnterApp" href="#" class="flex-1 py-2.5 px-4 bg-primary hover:bg-blue-600 text-white font-medium rounded-lg text-center transition">
                            Vào CodeHub
                        </a>
                        <button id="btnLogout" type="button" class="py-2.5 px-4 border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium rounded-lg transition">
                            Đăng Xuất
                        </button>
                    </div>
                </div>

            </div>

            <!-- Footer Card -->
            <div class="bg-gray-50 dark:bg-gray-700/50 p-4 text-center border-t border-gray-100 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400">
                Bảo mật và đồng bộ dữ liệu đám mây qua nền tảng <strong>Supabase</strong>.
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-gray-400">
        &copy; 2024 CodeHub - Nền Tảng Học Lập Trình & Hướng Nghiệp
    </footer>

    <!-- Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let isLoginMode = true;

            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const fullNameGroup = document.getElementById('fullNameGroup');
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const authForm = document.getElementById('authForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const btnForgotPassword = document.getElementById('btnForgotPassword');
            const loggedInState = document.getElementById('loggedInState');
            const currentUserEmail = document.getElementById('currentUserEmail');
            const btnLogout = document.getElementById('btnLogout');
            const btnEnterApp = document.getElementById('btnEnterApp');

            // Kiểm tra Supabase client
            function checkSupabaseClient() {
                if (!window.supabaseClient) {
                    showAlert('Chưa khởi tạo được Supabase client. Vui lòng kiểm tra file scripts/supabase-config.js!', 'error');
                    return false;
                }
                return true;
            }

            // Hàm hiển thị thông báo
            function showAlert(msg, type = 'error') {
                alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');
                if (type === 'error') {
                    alertBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200', 'dark:bg-red-900/30', 'dark:text-red-300', 'dark:border-red-800');
                    alertIcon.textContent = '⚠️';
                } else if (type === 'success') {
                    alertBox.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200', 'dark:bg-green-900/30', 'dark:text-green-300', 'dark:border-green-800');
                    alertIcon.textContent = '🎉';
                } else {
                    alertBox.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200', 'dark:bg-blue-900/30', 'dark:text-blue-300', 'dark:border-blue-800');
                    alertIcon.textContent = 'ℹ️';
                }
                alertMessage.textContent = msg;
            }

            function hideAlert() {
                alertBox.classList.add('hidden');
            }

            // Bật/tắt chế độ Loading
            function setLoading(loading) {
                if (loading) {
                    btnSubmit.disabled = true;
                    btnText.textContent = isLoginMode ? 'Đang đăng nhập...' : 'Đang tạo tài khoản...';
                    loadingSpinner.classList.remove('hidden');
                } else {
                    btnSubmit.disabled = false;
                    btnText.textContent = isLoginMode ? 'Đăng Nhập' : 'Tạo Tài Khoản';
                    loadingSpinner.classList.add('hidden');
                }
            }

            // Chuyển sang Tab Đăng Nhập
            function switchModeToLogin() {
                isLoginMode = true;
                tabLogin.className = 'flex-1 py-3 text-sm font-semibold text-primary border-b-2 border-primary focus:outline-none transition-colors';
                tabRegister.className = 'flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition-colors';
                authTitle.textContent = 'Đăng Nhập CodeHub';
                authSubtitle.textContent = 'Đăng nhập để đồng bộ kết quả học tập và bài thi';
                fullNameGroup.classList.add('hidden');
                fullNameInput.required = false;
                btnText.textContent = 'Đăng Nhập';
                btnForgotPassword.classList.remove('hidden');
                hideAlert();
            }

            // Chuyển sang Tab Đăng Ký
            function switchModeToRegister() {
                isLoginMode = false;
                tabRegister.className = 'flex-1 py-3 text-sm font-semibold text-primary border-b-2 border-primary focus:outline-none transition-colors';
                tabLogin.className = 'flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition-colors';
                authTitle.textContent = 'Tạo Tài Khoản Mới';
                authSubtitle.textContent = 'Đăng ký miễn phí để gia nhập học viện CodeHub';
                fullNameGroup.classList.remove('hidden');
                fullNameInput.required = true;
                btnText.textContent = 'Tạo Tài Khoản';
                btnForgotPassword.classList.add('hidden');
                hideAlert();
            }

            tabLogin.addEventListener('click', switchModeToLogin);
            tabRegister.addEventListener('click', switchModeToRegister);

            // Ẩn/hiện mật khẩu
            togglePasswordBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePasswordBtn.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    togglePasswordBtn.textContent = '👁️';
                }
            });

            // Điều hướng theo vai trò trong bảng profiles
            async function redirectByRole(userId) {
                const { data: profile, error } = await window.supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .single();

                if (error || !profile) {
                    throw new Error('Không tìm thấy hồ sơ người dùng trong bảng profiles.');
                }

                if (profile.role === 'teacher') {
                    window.location.href = 'teacher.html';
                    return;
                }

                if (profile.role === 'student') {
                    window.location.href = 'student-dashboard.html';
                    return;
                }

                window.location.href = 'index.html';
            }

            // Kiểm tra xem người dùng đã đăng nhập từ trước chưa
            if (window.supabaseClient) {
                try {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session && session.user) {
                        authForm.classList.add('hidden');
                        loggedInState.classList.remove('hidden');
                        currentUserEmail.textContent = session.user.email;
                        authTitle.textContent = 'Đã Đăng Nhập';
                        authSubtitle.textContent = 'Chào mừng bạn trở lại với CodeHub!';
                        if (btnEnterApp) {
                            btnEnterApp.onclick = async (ev) => {
                                ev.preventDefault();
                                try {
                                    await redirectByRole(session.user.id);
                                } catch (err) {
                                    showAlert(err.message || 'Không xác định được quyền tài khoản.', 'error');
                                }
                            };
                        }
                    }
                } catch (e) {
                    console.log('Chưa có phiên đăng nhập trước đó');
                }
            }

            // Xử lý Submit Form
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                if (!checkSupabaseClient()) return;

                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const fullName = fullNameInput.value.trim();

                if (!email || !password) {
                    showAlert('Vui lòng nhập đầy đủ Email và Mật khẩu!');
                    return;
                }

                setLoading(true);

                try {
                    if (isLoginMode) {
                        // Đăng Nhập
                        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: password
                        });

                        if (error) {
                            if (error.message.includes('Invalid login credentials')) {
                                throw new Error('Email hoặc mật khẩu không chính xác!');
                            }
                            throw error;
                        }

                        showAlert('Đăng nhập thành công! Đang mở CodeHub...', 'success');
                        await redirectByRole(data.user.id);

                    } else {
                        // Đăng Ký
                        const { data, error } = await window.supabaseClient.auth.signUp({
                            email: email,
                            password: password,
                            options: {
                                data: {
                                    full_name: fullName
                                }
                            }
                        });

                        if (error) throw error;

                        if (data.user && data.user.identities && data.user.identities.length === 0) {
                            showAlert('Email này đã được đăng ký trước đó. Vui lòng đăng nhập!', 'error');
                            switchModeToLogin();
                            emailInput.value = email;
                        } else {
                            showAlert('Đăng ký tài khoản thành công! Vui lòng kiểm tra hộp thư email để xác thực tài khoản nếu có.', 'success');
                            setTimeout(async () => {
                                if (data.session) {
                                    try {
                                        await redirectByRole(data.user.id);
                                    } catch (err) {
                                        showAlert(err.message || 'Tài khoản đã tạo nhưng chưa có hồ sơ phân quyền.', 'error');
                                    }
                                } else {
                                    switchModeToLogin();
                                    emailInput.value = email;
                                }
                            }, 2000);
                        }
                    }
                } catch (err) {
                    console.error(err);
                    showAlert(err.message || 'Đã có lỗi xảy ra. Vui lòng thử lại!', 'error');
                } finally {
                    setLoading(false);
                }
            });

            // Xử lý Quên mật khẩu
            btnForgotPassword.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                if (!email) {
                    showAlert('Vui lòng nhập địa chỉ Email vào ô trên trước khi yêu cầu đặt lại mật khẩu!', 'error');
                    emailInput.focus();
                    return;
                }

                if (!checkSupabaseClient()) return;

                try {
                    const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/login.html'
                    });
                    if (error) throw error;
                    showAlert('Liên kết đặt lại mật khẩu đã được gửi tới email của bạn. Vui lòng kiểm tra hòm thư!', 'success');
                } catch (err) {
                    showAlert(err.message || 'Không thể gửi email đặt lại mật khẩu.', 'error');
                }
            });

            // Xử lý Đăng xuất
            btnLogout.addEventListener('click', async () => {
                if (!checkSupabaseClient()) return;
                try {
                    await window.supabaseClient.auth.signOut();
                    showAlert('Đã đăng xuất thành công!', 'success');
                    setTimeout(() => {
                        window.location.reload();
                    }, 800);
                } catch (err) {
                    showAlert('Lỗi khi đăng xuất: ' + err.message, 'error');
                }
            });
        });
    </script>
</body>

</html>
