<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#3b82f6',secondary:'#10b981'}}}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
<header class="bg-white dark:bg-gray-800 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="index.html" class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-emerald-500">&lt;/&gt; CodeHub</a>
    <a href="index.html" class="text-sm text-gray-600 dark:text-gray-300">← Quay lại Trang Chủ</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
  <div class="bg-gradient-to-r from-blue-500 to-blue-600 p-7 text-center text-white">
    <div class="mx-auto mb-3 w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-3xl">🔒</div>
    <h1 class="text-2xl font-bold">Chào Mừng Đến Với CodeHub</h1>
    <p class="text-blue-100 mt-1">Đăng nhập để học tập và quản lý lớp học</p>
  </div>

  <div class="px-7 py-4 border-b text-center font-bold text-blue-500">Đăng Nhập</div>

  <div class="p-7">
    <div id="alertBox" class="hidden mb-5 p-3 rounded-lg text-sm"></div>

    <form id="loginForm" novalidate>
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase mb-2">Email <span class="text-red-500">*</span></label>
        <input id="email" type="email" autocomplete="username" required
          placeholder="hocsinh@truong.edu.vn"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-5">
        <div class="flex justify-between mb-2">
          <label class="text-xs font-bold uppercase">Mật khẩu <span class="text-red-500">*</span></label>
          <button id="forgotBtn" type="button" class="text-sm text-blue-500 hover:underline">Quên mật khẩu?</button>
        </div>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" required minlength="6"
            placeholder="Tối thiểu 6 ký tự"
            class="w-full px-4 py-3 pr-12 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 outline-none focus:ring-2 focus:ring-blue-500">
          <button id="eyeBtn" type="button" class="absolute right-3 top-3 text-lg">👁️</button>
        </div>
      </div>

      <button id="loginBtn" type="submit"
        class="w-full py-3 bg-blue-500 hover:bg-blue-600 disabled:opacity-60 text-white font-bold rounded-lg shadow">
        <span id="loginText">Đăng Nhập</span>
      </button>
    </form>

    <div id="loggedBox" class="hidden text-center">
      <div class="text-5xl mb-3">✅</div>
      <h2 class="font-bold text-xl">Đã đăng nhập</h2>
      <p id="loggedEmail" class="text-gray-500 mt-1 mb-5"></p>
      <button id="continueBtn" class="w-full py-3 bg-blue-500 text-white font-bold rounded-lg">Vào CodeHub</button>
      <button id="logoutBtn" class="w-full py-3 mt-2 border rounded-lg font-bold">Đăng xuất</button>
    </div>
  </div>
</div>
</main>

<script>
(function(){
  const form=document.getElementById('loginForm');
  const email=document.getElementById('email');
  const password=document.getElementById('password');
  const alertBox=document.getElementById('alertBox');
  const loginBtn=document.getElementById('loginBtn');
  const loginText=document.getElementById('loginText');
  const loggedBox=document.getElementById('loggedBox');
  const loggedEmail=document.getElementById('loggedEmail');

  function show(msg,type='error'){
    alertBox.className='mb-5 p-3 rounded-lg text-sm border';
    if(type==='success') alertBox.classList.add('bg-green-50','text-green-700','border-green-200');
    else if(type==='info') alertBox.classList.add('bg-blue-50','text-blue-700','border-blue-200');
    else alertBox.classList.add('bg-red-50','text-red-700','border-red-200');
    alertBox.textContent=msg;
  }
  function hide(){alertBox.className='hidden mb-5 p-3 rounded-lg text-sm'}
  function loading(v){
    loginBtn.disabled=v;
    loginText.textContent=v?'Đang đăng nhập...':'Đăng Nhập';
  }
  function client(){
    if(!window.supabaseClient){
      show('Không kết nối được Supabase. Kiểm tra scripts/supabase-config.js');
      return null;
    }
    return window.supabaseClient;
  }

  async function getRole(userId){
    const s=client(); if(!s) return null;
    const {data,error}=await s.from('profiles').select('role').eq('id',userId).single();
    if(error){
      console.error('PROFILE ERROR:',error);
      throw new Error('Đăng nhập thành công nhưng không đọc được hồ sơ phân quyền: '+error.message);
    }
    if(!data || !data.role) throw new Error('Tài khoản chưa có role trong bảng profiles.');
    return String(data.role).trim().toLowerCase();
  }

  async function goByRole(user){
    const role=await getRole(user.id);
    if(role==='teacher'){location.replace('teacher.html');return}
    if(role==='student'){location.replace('student-dashboard.html');return}
    throw new Error('Role "'+role+'" chưa được hỗ trợ.');
  }

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    e.stopPropagation();
    hide();

    const s=client(); if(!s) return;
    const em=email.value.trim();
    const pw=password.value;

    if(!em || !pw){show('Vui lòng nhập Email và Mật khẩu.');return}
    if(pw.length<6){show('Mật khẩu phải có ít nhất 6 ký tự.');return}

    loading(true);
    try{
      const {data,error}=await s.auth.signInWithPassword({email:em,password:pw});
      if(error) throw error;
      if(!data || !data.user) throw new Error('Supabase không trả về thông tin người dùng.');
      show('Đăng nhập thành công. Đang chuyển trang...','success');
      await goByRole(data.user);
    }catch(err){
      console.error('LOGIN ERROR:',err);
      let msg=err && err.message ? err.message : 'Không thể đăng nhập.';
      if(/invalid login credentials/i.test(msg)) msg='Email hoặc mật khẩu không chính xác.';
      if(/email not confirmed/i.test(msg)) msg='Email chưa được xác nhận.';
      show(msg);
    }finally{loading(false)}
    return false;
  });

  document.getElementById('eyeBtn').addEventListener('click',function(){
    password.type=password.type==='password'?'text':'password';
    this.textContent=password.type==='password'?'👁️':'🙈';
  });

  document.getElementById('forgotBtn').addEventListener('click',async function(){
    const s=client(); if(!s) return;
    const em=email.value.trim();
    if(!em){show('Nhập email trước khi yêu cầu đặt lại mật khẩu.');email.focus();return}
    try{
      const {error}=await s.auth.resetPasswordForEmail(em,{redirectTo:new URL('login.html',location.href).href});
      if(error) throw error;
      show('Đã gửi yêu cầu đặt lại mật khẩu. Hãy kiểm tra email.','success');
    }catch(err){show(err.message||'Không gửi được yêu cầu đặt lại mật khẩu.')}
  });

  document.getElementById('continueBtn').addEventListener('click',async function(){
    const s=client(); if(!s) return;
    const {data:{user}}=await s.auth.getUser();
    if(user){try{await goByRole(user)}catch(err){show(err.message)}}
  });

  document.getElementById('logoutBtn').addEventListener('click',async function(){
    const s=client(); if(!s) return;
    await s.auth.signOut(); location.reload();
  });

  async function checkExisting(){
    const s=client(); if(!s) return;
    try{
      const {data:{session}}=await s.auth.getSession();
      if(session && session.user){
        form.classList.add('hidden');
        loggedBox.classList.remove('hidden');
        loggedEmail.textContent=session.user.email||'';
      }
    }catch(err){console.error(err)}
  }
  checkExisting();
})();
</script>
</body>
</html>
