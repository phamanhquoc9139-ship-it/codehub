<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả Quiz</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-6xl mx-auto p-6"><div class="flex justify-between mb-6"><div><h1 id="h" class="text-3xl font-bold">📊 Kết quả Quiz</h1><p class="text-slate-500">Điểm học sinh</p></div><a href="quizzes.html" class="border px-4 py-2 rounded-xl h-fit">← Quiz</a></div><div class="bg-white rounded-2xl shadow overflow-auto"><table class="w-full text-left"><thead class="bg-slate-100"><tr><th class="p-3">Học sinh</th><th class="p-3">Mã HS</th><th class="p-3">Lớp</th><th class="p-3">Điểm</th><th class="p-3">Đúng</th><th class="p-3">Nộp lúc</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>const s=window.supabaseClient,qid=new URLSearchParams(location.search).get('quiz');async function init(){let u=(await s.auth.getUser()).data.user;if(!u)return location.href='login.html';let q=await s.from('quizzes').select('title,teacher_id').eq('id',qid).single();if(q.error||q.data.teacher_id!==u.id)return location.href='quizzes.html';h.textContent='📊 '+q.data.title;let r=await s.from('quiz_attempts').select('*').eq('quiz_id',qid).order('submitted_at',{ascending:false});let data=r.data||[];let ids=[...new Set(data.map(x=>x.student_id))];let mp={};if(ids.length){let p=await s.from('profiles').select('id,full_name,student_code,class_name').in('id',ids);(p.data||[]).forEach(x=>mp[x.id]=x);}rows.innerHTML=data.map(x=>{let p=mp[x.student_id]||{};return`<tr class="border-t"><td class="p-3">${p.full_name||'—'}</td><td class="p-3">${p.student_code||'—'}</td><td class="p-3">${p.class_name||'—'}</td><td class="p-3 font-bold">${x.score}</td><td class="p-3">${x.correct_count}/${x.total_questions}</td><td class="p-3">${new Date(x.submitted_at).toLocaleString('vi-VN')}</td></tr>`}).join('')||'<tr><td colspan="6" class="p-6 text-center">Chưa có học sinh nộp bài.</td></tr>';}init();</script></body></html>
