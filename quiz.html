<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài Kiểm Tra Trắc Nghiệm - CodeHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <!-- Dữ liệu bài Quiz -->
    <script src="scripts/quizzes.js"></script>
</head>

<body
    class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex-shrink-0 flex items-center">
                        <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                        </svg>
                        <span
                            class="ml-2 text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">CodeHub</span>
                    </a>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="index.html"
                            class="border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Trang
                            Chủ</a>
                        <a href="index.html#courses"
                            class="border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Khóa
                            Học</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="backBtn"
                        class="text-sm border border-gray-300 dark:border-gray-600 rounded px-3 py-1 hover:bg-gray-100 dark:hover:bg-gray-700">
                        &larr; Quay lại khóa học
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">

        <div
            class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-primary to-indigo-600 px-6 py-8 sm:px-8">
                <h1 id="quizTitle" class="text-3xl font-bold text-white tracking-tight">Đang tải bài kiểm tra...</h1>
                <p class="mt-2 text-indigo-100">Trả lời các câu hỏi bên dưới và nhấn nộp bài để xem điểm số.</p>
            </div>

            <!-- Quiz Container -->
            <div class="p-6 sm:p-8">
                <!-- Vùng chứa các câu hỏi được sinh ra bằng JS -->
                <form id="quizForm" class="space-y-8">
                    <div id="questionsContainer">
                        <!-- Lấy dữ liệu từ JS -->
                        <div class="text-center text-gray-500 dark:text-gray-400 py-10">
                            Không tìm thấy dữ liệu khóa học. Vui lòng truy cập từ một khóa học cụ thể.
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-200 dark:border-gray-700 flex justify-end hidden"
                        id="submitArea">
                        <button type="button" id="submitBtn"
                            class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                            Nộp bài kiểm tra
                        </button>
                    </div>
                </form>

                <!-- Vùng hiển thị kết quả -->
                <div id="resultArea" class="mt-8 pt-8 border-t border-gray-200 dark:border-gray-700 hidden">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Kết quả của bạn</h2>
                        <div class="mt-4 flex justify-center items-baseline">
                            <span id="scoreText" class="text-5xl font-extrabold text-primary">0</span>
                            <span id="totalText" class="text-xl text-gray-500 dark:text-gray-400 ml-2">/ 0</span>
                        </div>
                        <p id="feedbackText" class="mt-2 text-lg text-gray-600 dark:text-gray-300"></p>
                    </div>

                    <div class="flex justify-center space-x-4">
                        <button id="retryBtn"
                            class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">Làm
                            lại bài</button>
                        <a id="finishBtn" href="index.html"
                            class="px-4 py-2 bg-secondary text-white rounded font-medium hover:bg-emerald-600 transition-colors">Trở
                            về Trang chủ</a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-100 dark:bg-gray-800 py-6 border-t border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500 dark:text-gray-400">
            &copy; 2024 CodeHub Platform. Quiz Module.
        </div>
    </footer>

    <!-- Logic xử lý bài thi -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy ID khóa học từ URL parameters (ví dụ: ?course=grade_5)
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course');
            const questionsContainer = document.getElementById('questionsContainer');
            const submitArea = document.getElementById('submitArea');
            const quizTitle = document.getElementById('quizTitle');
            const backBtn = document.getElementById('backBtn');
            const submitBtn = document.getElementById('submitBtn');
            const resultArea = document.getElementById('resultArea');
            const retryBtn = document.getElementById('retryBtn');

            let currentQuiz = null;

            // Xử lý nút quay lại
            backBtn.addEventListener('click', () => {
                if (courseId) {
                    window.location.href = `courses/${courseId}.html`;
                } else {
                    window.location.href = 'index.html';
                }
            });

            // Kiểm tra và render
            if (courseId && quizzesData[courseId]) {
                currentQuiz = quizzesData[courseId];
                quizTitle.textContent = currentQuiz.title;
                renderQuestions(currentQuiz.questions);
                submitArea.classList.remove('hidden');
            }

            function renderQuestions(questions) {
                questionsContainer.innerHTML = '';
                questions.forEach((q, index) => {
                    const questionHtml = `
                        <div class="question-block bg-gray-50 dark:bg-gray-700/30 p-5 rounded-lg border border-gray-100 dark:border-gray-700" data-index="${index}">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-4">
                                <span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-sm font-semibold mr-2 px-2.5 py-0.5 rounded">Câu ${index + 1}</span>
                                ${q.question}
                            </h3>
                            <div class="space-y-3 options-container">
                                ${q.options.map((opt, optIndex) => `
                                    <label class="flex items-center p-3 border border-gray-200 dark:border-gray-600 rounded cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-600 transition-colors">
                                        <input type="radio" name="question_${index}" value="${optIndex}" class="h-4 w-4 text-primary focus:ring-primary border-gray-300">
                                        <span class="ml-3 text-gray-700 dark:text-gray-200">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                            <div class="explanation mt-4 p-4 bg-green-50 dark:bg-green-900/40 text-green-800 dark:text-green-200 rounded border border-green-200 dark:border-green-800 hidden">
                                <strong>Giải thích:</strong> ${q.explanation}
                            </div>
                        </div>
                    `;
                    questionsContainer.insertAdjacentHTML('beforeend', questionHtml);
                });
            }

            // Xử lý nộp bài
            submitBtn.addEventListener('click', () => {
                let score = 0;
                const questions = currentQuiz.questions;
                const blocks = questionsContainer.querySelectorAll('.question-block');

                blocks.forEach((block, index) => {
                    const q = questions[index];
                    const selected = block.querySelector(`input[name="question_${index}"]:checked`);
                    const optionsLabels = block.querySelectorAll('label');
                    const explanationBox = block.querySelector('.explanation');

                    // Disable tất cả input
                    block.querySelectorAll('input').forEach(i => i.disabled = true);

                    if (selected) {
                        const selectedVal = parseInt(selected.value);
                        if (selectedVal === q.correctAnswer) {
                            score++;
                            optionsLabels[selectedVal].classList.add('bg-green-100', 'border-green-400', 'dark:bg-green-900/50', 'dark:border-green-500');
                        } else {
                            optionsLabels[selectedVal].classList.add('bg-red-100', 'border-red-400', 'dark:bg-red-900/50', 'dark:border-red-500');
                            optionsLabels[q.correctAnswer].classList.add('bg-green-100', 'border-green-400', 'dark:bg-green-900/50', 'dark:border-green-500');
                        }
                    } else {
                        // Nếu không chọn gì cả, hiển thị đáp án đúng
                        optionsLabels[q.correctAnswer].classList.add('bg-green-100', 'border-green-400', 'dark:bg-green-900/50', 'dark:border-green-500');
                    }

                    // Hiện lời giải
                    if (q.explanation) {
                        explanationBox.classList.remove('hidden');
                    }
                });

                // Ẩn nút nộp, hiện kết quả
                submitArea.classList.add('hidden');
                resultArea.classList.remove('hidden');

                document.getElementById('scoreText').textContent = score;
                document.getElementById('totalText').textContent = `/ ${questions.length}`;

                const percent = score / questions.length;
                let feedback = "";
                if (percent === 1) feedback = "Tuyệt vời! Bạn đã làm đúng tuyệt đối.";
                else if (percent >= 0.5) feedback = "Khá tốt! Hãy cố gắng hơn nhé.";
                else feedback = "Đừng buồn, hãy ôn bài và thử lại nhé!";

                document.getElementById('feedbackText').textContent = feedback;

                // Cuộn xuống kết quả
                resultArea.scrollIntoView({ behavior: 'smooth' });
            });

            // Làm lại bài
            retryBtn.addEventListener('click', () => {
                renderQuestions(currentQuiz.questions); // Render lại tươi mới
                resultArea.classList.add('hidden');
                submitArea.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>

</html>
