<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giao Quiz V2.6</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><link rel="stylesheet" href="styles/codehub-v26.css"><script src="scripts/codehub-v26-ui.js"></script></head>
<body class="ch-shell bg-slate-50"><script>document.addEventListener('DOMContentLoaded',()=>CodeHubUI.mountHeader({active:'quizzes',breadcrumbs:[{label:'Quiz',href:'quizzes.html'},{label:'Giao lớp'}]}))</script>
<main class="max-w-5xl mx-auto p-6"><div class="flex justify-between mb-5 gap-3 flex-wrap"><div><div class="ch-page-title"><h1 id="h" class="text-3xl font-bold">📤 Giao Quiz</h1><span class="ch-version">V2.6</span></div><p class="text-slate-500">Giáo viên chỉ giao đúng lớp được phân công theo môn</p></div></div><div id="msg"></div><div class="grid md:grid-cols-2 gap-5"><form id="f" class="bg-white p-5 rounded-2xl shadow space-y-3"><select id="cls" required class="w-full border p-3 rounded-xl"></select><label class="block">Mở từ<input id="op" type="datetime-local" class="w-full border p-3 rounded-xl"></label><label class="block">Đóng lúc<input id="cl" type="datetime-local" class="w-full border p-3 rounded-xl"></label><label class="block">Thời lượng (phút)<input id="tm" type="number" min="1" value="15" class="w-full border p-3 rounded-xl"></label><label class="block">Số lần làm<input id="mx" type="number" min="1" value="1" class="w-full border p-3 rounded-xl"></label><label><input id="sr" type="checkbox" checked> Cho xem điểm sau khi nộp</label><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Giao cho lớp</button></form><section class="bg-white p-5 rounded-2xl shadow"><h2 class="font-bold text-xl mb-3">Đã giao</h2><div id="list"></div></section></div></main>
<script>
const s=window.supabaseClient,$=x=>document.getElementById(x),qid=new URLSearchParams(location.search).get("quiz");let me,role,quiz;
function say(t,ok=false){CodeHubUI.toast(t,ok?'success':'error')}
async function init(){CodeHubUI.loading(true,'Đang kiểm tra quyền và lớp được phân công...');try{me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";let p=await s.from("profiles").select("role,full_name").eq("id",me.id).single();role=String(p.data?.role||"").trim().toLowerCase();CodeHubUI.setIdentity(p.data?.full_name||"",role,me.email||"");if(!["admin","teacher"].includes(role))return CodeHubUI.forbidden('Tài khoản này không có quyền giao Quiz.');let qr=await s.from("quizzes").select("id,title,teacher_id,time_limit,course_id,courses(subject)").eq("id",qid).single();if(qr.error||!qr.data)return CodeHubUI.forbidden('Không tìm thấy Quiz hoặc Quiz không thuộc phạm vi quản lý của bạn.');quiz=qr.data;if(role==="teacher"&&quiz.teacher_id!==me.id)return CodeHubUI.forbidden('Bạn không được giao Quiz của giáo viên khác.');h.textContent="📤 "+quiz.title;tm.value=quiz.time_limit||15;let classes=[];if(role==="admin"){let c=await s.from("classes").select("id,class_name").order("class_name");if(c.error)throw c.error;classes=c.data||[]}else{let sub=await s.from("subjects").select("id").ilike("subject_name",quiz.courses?.subject||"").maybeSingle();if(sub.data){let ar=await s.from("teacher_class_subjects").select("class_id").eq("teacher_id",me.id).eq("subject_id",sub.data.id);if(ar.error)throw ar.error;let ids=[...new Set((ar.data||[]).map(x=>x.class_id))];if(ids.length){let c=await s.from("classes").select("id,class_name").in("id",ids).order("class_name");if(c.error)throw c.error;classes=c.data||[]}}}cls.innerHTML='<option value="">-- Chọn lớp --</option>'+classes.map(x=>`<option value="${x.id}">${x.class_name}</option>`).join("");await load()}catch(e){CodeHubUI.toast(e.message||String(e),'error')}finally{CodeHubUI.loading(false)}}
async function load(){let q=s.from("quiz_assignments").select("*,classes(class_name)").eq("quiz_id",qid);if(role==="teacher")q=q.eq("teacher_id",me.id);let r=await q;if(r.error)return CodeHubUI.toast(r.error.message,'error');list.innerHTML=(r.data||[]).map(x=>`<div class="border p-3 rounded-xl mb-2"><b>${x.classes?.class_name||""}</b><div class="text-sm">${x.time_limit} phút • ${x.max_attempts} lần<br>Mở: ${x.open_at?new Date(x.open_at).toLocaleString("vi-VN"):"Ngay"}<br>Đóng: ${x.close_at?new Date(x.close_at).toLocaleString("vi-VN"):"Không giới hạn"}</div><button onclick="delx('${x.id}')" class="text-red-600 mt-2">Hủy giao</button></div>`).join("")||"Chưa giao."}
f.onsubmit=async e=>{e.preventDefault();let row={quiz_id:qid,class_id:cls.value,teacher_id:quiz.teacher_id,open_at:op.value?new Date(op.value).toISOString():null,close_at:cl.value?new Date(cl.value).toISOString():null,time_limit:+tm.value||15,max_attempts:+mx.value||1,show_result:sr.checked};if(row.open_at&&row.close_at&&new Date(row.close_at)<=new Date(row.open_at))return say("Giờ đóng phải sau giờ mở.");CodeHubUI.loading(true,'Đang giao Quiz...');try{let r=await s.from("quiz_assignments").upsert(row,{onConflict:"quiz_id,class_id"});if(r.error)return say(r.error.message);say("Đã giao Quiz.",true);await load()}finally{CodeHubUI.loading(false)}}
async function delx(id){if(confirm("Hủy giao?")){let q=s.from("quiz_assignments").delete().eq("id",id);if(role==="teacher")q=q.eq("teacher_id",me.id);let r=await q;r.error?say(r.error.message):(say('Đã hủy giao.',true),load())}}init();</script></body></html>
