<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài kiểm tra</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-5xl mx-auto p-6"><div class="flex justify-between mb-6"><div><h1 class="text-3xl font-bold">📝 Bài kiểm tra</h1><p class="text-slate-500">Các Quiz được giao cho khóa học của em</p></div><a href="student-dashboard.html" class="border px-4 py-2 rounded-xl h-fit">← Trang học</a></div><div id="list" class="grid md:grid-cols-2 gap-4"></div></main>
<script>const s=window.supabaseClient;async function init(){let u=(await s.auth.getUser()).data.user;if(!u)return location.href='login.html';let p=await s.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='student')return location.href='teacher.html';let r=await s.from('quizzes').select('id,title,description,time_limit,courses(title)').eq('is_published',true).order('created_at',{ascending:false});list.innerHTML=(r.data||[]).map(q=>`<div class="bg-white p-5 rounded-2xl shadow"><div class="text-sm text-blue-600">${q.courses?.title||''}</div><h2 class="font-bold text-xl">${q.title}</h2><p class="text-slate-500 my-2">${q.description||''}</p><div class="text-sm mb-4">⏱ ${q.time_limit} phút</div><a href="take-quiz.html?quiz=${q.id}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">Làm bài</a></div>`).join('')||'<div class="bg-white p-6 rounded-2xl">Chưa có bài kiểm tra được giao.</div>';}init();</script></body></html>
