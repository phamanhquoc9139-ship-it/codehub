<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học sinh V3.1.1 | CodeHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-size:28px;font-weight:900;color:#3182f6}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;background:#3182f6;color:white;text-decoration:none;display:inline-block}.btn.soft{background:#eef5ff;color:#2563eb}.btn.dark{background:#172033}
main{max-width:1180px;margin:28px auto;padding:0 20px}h1{font-size:36px;margin:0}.sub{color:#64748b;margin:8px 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel,.course{background:white;border:1px solid #edf2f7;border-radius:18px;box-shadow:0 5px 18px #0000000d}.stat{padding:18px}.stat .l{color:#64748b}.stat .n{font-size:30px;font-weight:900;margin-top:7px}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px}.panel{padding:21px}.panel h2{margin:0 0 14px}.list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid #e5e7eb;border-radius:13px;padding:13px}.item b{display:block}.meta{font-size:13px;color:#64748b;margin-top:5px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:800}.warn{background:#fff7ed;color:#9a3412}.danger{background:#fef2f2;color:#b91c1c}.purple{background:#f5f3ff;color:#6d28d9}
.courseGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.course{padding:18px}.course h3{margin:8px 0}.course p{color:#64748b;font-size:14px;min-height:38px}.chip{display:inline-block;background:#eef5ff;color:#2563eb;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin:6px 0 12px}
.empty{color:#64748b;text-align:center;padding:25px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){header{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<header>
  <div><div class="logo">&lt;/&gt; CodeHub <span style="font-size:13px;color:#2563eb">V3.1.1</span></div><div id="who" style="font-size:13px;color:#64748b;margin-top:4px"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a href="student-quizzes-v4.html" class="btn soft">Bài kiểm tra</a>
    <button class="btn dark" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main>
  <h1 id="hello">🎓 Dashboard học sinh</h1>
  <div class="sub" id="info">Đang tải dữ liệu...</div>

  <section class="stats">
    <div class="stat"><div class="l">📚 Khóa học</div><div id="stCourses" class="n">—</div></div>
    <div class="stat"><div class="l">🟢 Bài đang mở</div><div id="stOpen" class="n">—</div></div>
    <div class="stat"><div class="l">✅ Đã nộp</div><div id="stDone" class="n">—</div></div>
    <div class="stat"><div class="l">⭐ Điểm gần nhất</div><div id="stScore" class="n">—</div></div>
  </section>

  <section class="layout">
    <div class="panel">
      <h2>🔔 Bài kiểm tra cần chú ý</h2>
      <div id="assignments" class="list"></div>
    </div>
    <div class="panel">
      <h2>✅ Quiz đã làm</h2>
      <div id="completed" class="list"></div>
    </div>
  </section>

  <section class="panel" style="margin-top:18px">
    <h2>📈 Kết quả gần đây</h2>
    <div id="results" class="list"></div>
  </section>

  <section class="panel" style="margin-top:18px">
    <h2>📚 Khóa học của em</h2>
    <div id="courses" class="courseGrid"></div>
  </section>
</main>

<script>
const s=window.supabaseClient,$=id=>document.getElementById(id);
let user,profile,classIds=[],courseIds=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=v=>v?new Date(v).toLocaleString("vi-VN"):"—";

async function init(){
  try{
    user=(await s.auth.getUser()).data.user;
    if(!user)return location.href="login.html";

    const pr=await s.from("profiles").select("full_name,student_code,class_name,role").eq("id",user.id).single();
    if(pr.error||pr.data?.role!=="student")return location.href="teacher.html";
    profile=pr.data;

    $("hello").textContent="🎓 Xin chào, "+(profile.full_name||"Học sinh");
    $("who").textContent=(profile.student_code||"")+" • "+(profile.class_name||"");
    $("info").textContent="Lớp "+(profile.class_name||"—")+" • Theo dõi khóa học, bài kiểm tra và kết quả";

    await loadClassAndCourses();
    await loadAssignmentsAndResults();
  }catch(e){
    console.error(e);
    $("info").textContent="❌ "+(e?.message||e);
  }
}

async function loadClassAndCourses(){
  const cr=await s.from("classes").select("id").eq("class_name",profile.class_name);
  classIds=(cr.data||[]).map(x=>x.id);

  const cc=[];
  for(const id of classIds){
    const r=await s.from("course_classes").select("course_id").eq("class_id",id);
    if(!r.error)(r.data||[]).forEach(x=>cc.push(x.course_id));
  }
  courseIds=[...new Set(cc)];

  if(!courseIds.length){
    $("stCourses").textContent="0";
    $("courses").innerHTML='<div class="empty">Lớp của em chưa được giao khóa học.</div>';
    return;
  }

  const co=await s.from("courses").select("id,title,subject,grade,description,is_published").in("id",courseIds).eq("is_published",true);
  const rows=co.data||[];
  $("stCourses").textContent=rows.length;
  $("courses").innerHTML=rows.map(c=>`
    <div class="course">
      <div style="font-size:32px">📘</div>
      <h3>${esc(c.title)}</h3>
      <span class="chip">${esc(c.subject||"Môn học")} • Khối ${esc(c.grade||"—")}</span>
      <p>${esc(c.description||"")}</p>
      <button class="btn" onclick="location.href='student-course.html?course=${encodeURIComponent(c.id)}'">Vào học →</button>
    </div>`).join("") || '<div class="empty">Chưa có khóa học được xuất bản.</div>';
}

async function loadAssignmentsAndResults(){
  if(!classIds.length){
    $("assignments").innerHTML='<div class="item">Chưa xác định được lớp.</div>';
    $("completed").innerHTML='<div class="item">Chưa có Quiz đã làm.</div>';
    $("results").innerHTML='<div class="item">Chưa có kết quả.</div>';
    return;
  }

  const ar=await s.from("quiz_assignments")
    .select("id,quiz_id,class_id,open_at,close_at,time_limit,max_attempts,show_result,quizzes(title,course_id)")
    .in("class_id",classIds)
    .order("close_at",{ascending:true});

  const assignments=ar.data||[];

  const at=await s.from("quiz_attempts")
    .select("id,assignment_id,quiz_id,score,correct_count,total_questions,submitted_at")
    .eq("student_id",user.id)
    .order("submitted_at",{ascending:false});

  const attempts=at.data||[];

  const byAssignment=new Map();
  attempts.forEach(x=>{
    if(!x.assignment_id)return;
    if(!byAssignment.has(x.assignment_id))byAssignment.set(x.assignment_id,[]);
    byAssignment.get(x.assignment_id).push(x);
  });

  const latestByAssignment=new Map();
  byAssignment.forEach((arr,key)=>{
    const sorted=[...arr].sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));
    latestByAssignment.set(key,sorted[0]);
  });

  const now=Date.now();
  const open=assignments.filter(x=>{
    const a=x.open_at?new Date(x.open_at).getTime():-Infinity;
    const b=x.close_at?new Date(x.close_at).getTime():Infinity;
    return a<=now&&now<=b;
  });

  $("stOpen").textContent=open.length;
  $("stDone").textContent=new Set(attempts.map(x=>x.assignment_id).filter(Boolean)).size;
  $("stScore").textContent=attempts.length&&attempts[0].score!=null?attempts[0].score+"/10":"—";

  // Chỉ đưa các bài CHƯA hoàn tất vào "Bài kiểm tra cần chú ý".
  // Nếu đã nộp nhưng vẫn còn lượt làm lại thì vẫn hiện nút Làm lại.
  const attentionRows=assignments.filter(x=>{
    const a=x.open_at?new Date(x.open_at).getTime():-Infinity;
    const b=x.close_at?new Date(x.close_at).getTime():Infinity;
    const isOpen=a<=now&&now<=b;
    const used=(byAssignment.get(x.id)||[]).length;
    const max=Number(x.max_attempts||1);

    if(!isOpen)return false;
    return used < max;
  });

  $("assignments").innerHTML=attentionRows.map(x=>{
    const b=x.close_at?new Date(x.close_at).getTime():Infinity;
    const used=(byAssignment.get(x.id)||[]).length;
    const max=Number(x.max_attempts||1);
    const done=latestByAssignment.get(x.id);
    const soon=x.close_at&&(b-now)<=48*3600000;

    const status=done
      ? `<span class="pill">Đã nộp ${esc(done.score??"—")}/10 • còn ${Math.max(0,max-used)} lượt</span>`
      : (soon?'<span class="pill warn">Sắp hết hạn</span>':'<span class="pill purple">Đang mở</span>');

    const action=`<div style="margin-top:9px"><a class="btn" href="student-quiz-v4.html?assignment=${encodeURIComponent(x.id)}">${done?"Làm lại":"Làm bài"} →</a></div>`;

    return `<div class="item">
      ${status}
      <b>${esc(x.quizzes?.title||"Quiz")}</b>
      <div class="meta">
        Mở: ${fmt(x.open_at)}<br>
        Đóng: ${fmt(x.close_at)} • ${esc(x.time_limit||"—")} phút • Lượt ${used}/${max}
      </div>
      ${action}
    </div>`;
  }).join("") || '<div class="item">Không có bài kiểm tra nào cần làm lúc này.</div>';

  // Các assignment đã nộp ít nhất 1 lần -> gom riêng vào "Quiz đã làm".
  const completedAssignments=assignments
    .filter(x=>latestByAssignment.has(x.id))
    .sort((a,b)=>{
      const aa=latestByAssignment.get(a.id)?.submitted_at||"";
      const bb=latestByAssignment.get(b.id)?.submitted_at||"";
      return new Date(bb)-new Date(aa);
    });

  $("completed").innerHTML=completedAssignments.map(x=>{
    const last=latestByAssignment.get(x.id);
    const used=(byAssignment.get(x.id)||[]).length;
    const max=Number(x.max_attempts||1);

    return `<div class="item">
      <span class="pill">Đã làm</span>
      <b>${esc(x.quizzes?.title||"Quiz")}</b>
      <div class="meta">
        Điểm gần nhất: <b>${esc(last?.score??"—")}/10</b><br>
        Đúng ${esc(last?.correct_count??"—")}/${esc(last?.total_questions??"—")} •
        Đã làm ${used}/${max} lượt<br>
        ${fmt(last?.submitted_at)}
      </div>
      ${x.show_result?`<div style="margin-top:8px"><a class="btn soft" href="student-quiz-result-v4-2.html?assignment=${encodeURIComponent(x.id)}">Xem kết quả</a></div>`:""}
    </div>`;
  }).join("") || '<div class="item">Em chưa hoàn thành Quiz nào.</div>';

  // Lịch sử kết quả chi tiết từng lượt nộp
  $("results").innerHTML=attempts.slice(0,10).map(x=>{
    const ass=assignments.find(a=>a.id===x.assignment_id);
    const title=ass?.quizzes?.title||"Quiz";
    const link=ass?.show_result
      ? `<div style="margin-top:8px"><a class="btn soft" href="student-quiz-result-v4-2.html?assignment=${encodeURIComponent(x.assignment_id)}">Xem chi tiết</a></div>`
      : "";

    return `<div class="item">
      <b>${esc(title)}</b>
      <div class="meta">
        Điểm <b>${esc(x.score??"—")}/10</b> •
        Đúng ${esc(x.correct_count??"—")}/${esc(x.total_questions??"—")}<br>
        ${fmt(x.submitted_at)}
      </div>
      ${link}
    </div>`;
  }).join("") || '<div class="item">Em chưa nộp bài kiểm tra nào.</div>';
}

async function logout(){await s.auth.signOut();location.href="login.html"}
init();
</script>
<script src="scripts/codehub-notifications-widget.js"></script>
</body></html>
