<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Học sinh | CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800;color:#3182f6}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#3182f6;color:#fff}main{max-width:1100px;margin:36px auto;padding:0 20px}h1{font-size:34px;margin:0 0 8px}.sub{color:#64748b;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}.card,.content{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 18px #0000000d}.title{font-size:21px;font-weight:800;margin:10px 0}.meta{color:#64748b;line-height:1.65}.chip,.resource{display:inline-block;background:#e8f1ff;color:#2563eb;padding:5px 10px;border-radius:15px;font-size:12px;font-weight:700;margin:9px 4px 5px 0}.empty{background:#fff;padding:40px;text-align:center;border-radius:15px;color:#64748b}.back{color:#2563eb;font-weight:700;cursor:pointer;margin-bottom:18px}.lesson{background:#fff;border-radius:15px;padding:20px;margin-bottom:13px;display:grid;grid-template-columns:55px 1fr auto;gap:15px;align-items:center}.order{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e8f1ff;color:#2563eb;font-weight:800}.content{line-height:1.75;white-space:pre-wrap}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.links a{text-decoration:none;background:#3182f6;color:#fff;padding:11px 15px;border-radius:9px;font-weight:700}.quizbar{display:flex;justify-content:space-between;align-items:center;gap:14px;background:linear-gradient(135deg,#eef5ff,#f5f0ff);border:1px solid #dbeafe;border-radius:16px;padding:18px 20px;margin-bottom:24px}.quizbar-title{font-size:19px;font-weight:800}.quizbar-sub{color:#64748b;margin-top:5px}.quizbtn{display:inline-block;text-decoration:none;background:#7c3aed;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;white-space:nowrap}.quiz-summary{font-size:13px;font-weight:700;color:#7c3aed;margin-top:6px}@media(max-width:700px){.quizbar{align-items:flex-start;flex-direction:column}.quizbtn{width:100%;text-align:center}}
@media(max-width:700px){header{flex-direction:column;gap:10px}.lesson{grid-template-columns:48px 1fr}.lesson .btn{grid-column:1/-1}}</style></head><body><header><div class="logo">&lt;/&gt; CodeHub</div><button class="btn" onclick="logout()">Đăng xuất</button></header><main><h1 id="hello">🎓 Khóa học của em</h1><div class="sub" id="info">Đang tải...</div>
<div class="quizbar"><div><div class="quizbar-title">📝 Bài kiểm tra</div><div class="quizbar-sub">Xem các bài được giáo viên giao, thời gian làm bài và kết quả.</div><div id="quizSummary" class="quiz-summary">Đang kiểm tra bài được giao...</div></div><a class="quizbtn" href="student-quizzes-v4.html">Vào bài kiểm tra →</a></div>
<div class="grid" id="grid"></div></main><script>
let user,profile;
document.addEventListener("DOMContentLoaded",async()=>{const s=window.supabaseClient;if(!s){alert("Không kết nối Supabase.");return}const u=await s.auth.getUser();user=u.data.user;if(!user){location.href="login.html";return}const p=await s.from("profiles").select("*").eq("id",user.id).single();profile=p.data;if(!profile||profile.role!=="student"){location.href="teacher.html";return}hello.textContent="🎓 Xin chào, "+(profile.full_name||"Học sinh");info.textContent="Lớp "+(profile.class_name||"—")+" • Khóa học đã xuất bản";await Promise.all([load(),loadQuizSummary()])});
async function load(){const s=window.supabaseClient;const cr=await s.from("classes").select("id").eq("class_name",profile.class_name);if(cr.error||!cr.data.length){empty("Chưa tìm thấy lớp của em.");return}const ids=[];for(const c of cr.data){const r=await s.from("course_classes").select("course_id").eq("class_id",c.id);if(!r.error)r.data.forEach(x=>ids.push(x.course_id))}const unique=[...new Set(ids)];if(!unique.length){empty("Lớp của em chưa được giao khóa học.");return}const co=await s.from("courses").select("*").in("id",unique).eq("is_published",true);if(co.error){empty(co.error.message);return}render(co.data||[])}
async function loadQuizSummary(){const s=window.supabaseClient;try{const cr=await s.from("classes").select("id").eq("class_name",profile.class_name);if(cr.error||!cr.data?.length){quizSummary.textContent="Chưa có bài kiểm tra được giao.";return}const classIds=cr.data.map(x=>x.id);const ar=await s.from("quiz_assignments").select("id,open_at,close_at,max_attempts").in("class_id",classIds);if(ar.error){quizSummary.textContent="Bấm vào để xem bài kiểm tra.";return}const assignments=ar.data||[];if(!assignments.length){quizSummary.textContent="Chưa có bài kiểm tra được giao.";return}const ids=assignments.map(x=>x.id);const at=await s.from("quiz_attempts").select("assignment_id,score,submitted_at").eq("student_id",user.id).in("assignment_id",ids);const attempts=at.data||[];const now=Date.now();let available=0,done=0;for(const a of assignments){const used=attempts.filter(x=>x.assignment_id===a.id).length;const open=!a.open_at||new Date(a.open_at).getTime()<=now;const closed=a.close_at&&new Date(a.close_at).getTime()<now;if(used>0)done++;if(open&&!closed&&used<(a.max_attempts||1))available++}quizSummary.textContent=available?available+" bài đang có thể làm"+(done?" • "+done+" bài đã nộp":""):done?done+" bài đã nộp":"Không có bài đang mở."}catch(e){quizSummary.textContent="Bấm vào để xem bài kiểm tra."}}
function empty(t){grid.innerHTML='<div class="empty">'+t+'</div>'}function render(a){grid.innerHTML="";if(!a.length){empty("Chưa có khóa học được xuất bản.");return}a.forEach(c=>{const e=document.createElement("div");e.className="card";e.innerHTML='<div style="font-size:38px">📘</div><div class="title"></div><div class="meta"></div><span class="chip"></span><div style="margin-top:14px"><button class="btn">Vào học →</button></div>';e.querySelector(".title").textContent=c.title;e.querySelector(".meta").textContent=c.description||"";e.querySelector(".chip").textContent=(c.subject||"Môn học")+" • Khối "+c.grade;e.querySelector("button").onclick=()=>location.href="student-course.html?course="+encodeURIComponent(c.id);grid.appendChild(e)})}async function logout(){await window.supabaseClient.auth.signOut();location.href="login.html"}</script></body></html>
