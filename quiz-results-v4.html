<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Kết quả V4</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body class="bg-slate-50"><main class="max-w-7xl mx-auto p-6"><div class="flex justify-between mb-6"><div><h1 id="h" class="text-3xl font-bold">📊 Kết quả</h1><p id="stat" class="text-slate-500"></p></div><div><button id="excel" class="bg-emerald-600 text-white p-2 rounded-xl">⬇ Xuất Excel</button> <a href="quizzes.html" class="border p-2 rounded-xl">← Quiz</a></div></div><div class="bg-white rounded-2xl shadow overflow-auto"><table class="w-full"><thead><tr class="bg-slate-100"><th class="p-3">Học sinh</th><th>Mã HS</th><th>Lớp</th><th>Điểm</th><th>Đúng</th><th>Nộp lúc</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const s=window.supabaseClient,qid=new URLSearchParams(location.search).get("quiz");let dataExport=[],titleQuiz="Quiz";async function init(){let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";let q=await s.from("quizzes").select("title,teacher_id").eq("id",qid).single();if(q.error||q.data.teacher_id!==u.id)return location.href="quizzes.html";titleQuiz=q.data.title;h.textContent="📊 "+titleQuiz;let r=await s.from("quiz_attempts").select("*").eq("quiz_id",qid).order("submitted_at",{ascending:false});let a=r.data||[],ids=[...new Set(a.map(x=>x.student_id))],mp={};if(ids.length){let p=await s.from("profiles").select("id,full_name,student_code,class_name").in("id",ids);(p.data||[]).forEach(x=>mp[x.id]=x)}dataExport=a.map(x=>{let p=mp[x.student_id]||{};return{"Học sinh":p.full_name||"—","Mã HS":p.student_code||"—","Lớp":p.class_name||"—","Điểm":x.score,"Đúng":`${x.correct_count}/${x.total_questions}`,"Nộp lúc":new Date(x.submitted_at).toLocaleString("vi-VN")}});rows.innerHTML=dataExport.map(x=>`<tr class="border-t text-center"><td class="p-3 text-left">${x["Học sinh"]}</td><td>${x["Mã HS"]}</td><td>${x["Lớp"]}</td><td class="font-bold">${x["Điểm"]}</td><td>${x["Đúng"]}</td><td>${x["Nộp lúc"]}</td></tr>`).join("")||'<tr><td colspan="6" class="p-6 text-center">Chưa có học sinh nộp bài.</td></tr>';let avg=a.length?a.reduce((z,x)=>z+(+x.score||0),0)/a.length:0;stat.textContent=`${a.length} lượt nộp • Điểm TB ${avg.toFixed(2)}`}excel.onclick=()=>{if(!dataExport.length)return alert("Chưa có dữ liệu.");let ws=XLSX.utils.json_to_sheet(dataExport),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Ket qua");XLSX.writeFile(wb,"Ket_qua_Quiz.xlsx")};init();</script></body></html>
