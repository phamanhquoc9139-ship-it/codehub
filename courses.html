<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quản lý khóa học | CodeHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}.logo{font-size:28px;font-weight:800;color:#3182f6}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#3182f6;color:#fff}.green{background:#16a34a}.gray{background:#64748b}.orange{background:#f59e0b}.red{background:#dc2626}
main{max-width:1200px;margin:38px auto;padding:0 20px}h1{font-size:35px;margin-bottom:7px}.sub{color:#64748b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 18px #0000000d}.num{font-size:31px;font-weight:800;color:#2563eb;margin-top:6px}.toolbar{display:flex;gap:10px;background:#fff;padding:16px;border-radius:14px;margin-bottom:20px}.toolbar input,.toolbar select{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.toolbar input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:17px}.card{background:#fff;border-radius:15px;padding:22px;box-shadow:0 5px 18px #0000000d}.ct{font-size:21px;font-weight:800;margin:8px 0}.meta{color:#64748b;line-height:1.7}.chip{display:inline-block;background:#e8f1ff;color:#2563eb;padding:5px 9px;border-radius:15px;margin:9px 4px 5px 0;font-size:12px;font-weight:700}.status{display:inline-block;padding:5px 9px;border-radius:15px;margin:7px 0 13px;font-size:12px;font-weight:700}.pub{background:#dcfce7;color:#15803d}.draft{background:#f1f5f9;color:#475569}.actions{display:flex;gap:6px}.actions button{flex:1;border:0;border-radius:8px;padding:9px;color:#fff;font-weight:700;cursor:pointer}.empty{grid-column:1/-1;text-align:center;background:#fff;padding:40px;border-radius:15px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:18px}.box{background:#fff;width:min(700px,96%);max-height:92vh;overflow:auto;border-radius:17px;padding:25px}.mh{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#e2e8f0;border-radius:8px;width:37px;height:37px;font-size:20px;cursor:pointer}.fg{margin:15px 0}.fg label{display:block;font-weight:700;margin-bottom:6px}.fg input,.fg textarea,.fg select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.fg textarea{min-height:95px}.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cc{padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}.cc input{width:auto;margin-right:7px}.ma{display:flex;justify-content:flex-end;gap:8px}.msg{min-height:20px;font-weight:700}
@media(max-width:700px){header{flex-direction:column;gap:10px}.stats{grid-template-columns:1fr}.toolbar{flex-direction:column}.classes{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="logo">&lt;/&gt; CodeHub</div><div><button class="btn" onclick="location.href='teacher.html'">← Quản trị</button> <button class="btn" onclick="location.href='subjects.html'">📚 Môn học</button> <button class="btn" onclick="logout()">Đăng xuất</button></div></header>
<main>
<h1>📚 Quản lý khóa học</h1><div class="sub">Tạo khóa học theo nhiều môn học và giao cho các lớp</div>
<div class="stats"><div class="stat">Tổng khóa học<div class="num" id="total">0</div></div><div class="stat">Đã xuất bản<div class="num" id="pub">0</div></div><div class="stat">Bản nháp<div class="num" id="draft">0</div></div></div>
<div class="toolbar"><input id="search" placeholder="🔎 Tìm khóa học..."><select id="subjectFilter"><option value="">Tất cả môn</option></select><select id="gradeFilter"><option value="">Tất cả khối</option><option>10</option><option>11</option><option>12</option></select><button class="btn green" onclick="openCreate()">➕ Tạo khóa học</button></div>
<div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal"><div class="box">
<div class="mh"><h2 id="mt">➕ Tạo khóa học</h2><button class="close" onclick="closeModal()">×</button></div><input type="hidden" id="courseId">
<div class="fg"><label>Tên khóa học</label><input id="title"></div>
<div class="fg"><label>Môn học</label><select id="subject"><option value="">-- Chọn môn học --</option></select></div>
<div class="fg"><label>Khối</label><select id="grade"><option value="">-- Chọn khối --</option><option>10</option><option>11</option><option>12</option></select></div>
<div class="fg"><label>Mô tả</label><textarea id="description"></textarea></div>
<div class="fg"><label>Giao cho lớp</label><div class="classes" id="classList"></div></div>
<div class="fg"><label>Trạng thái</label><select id="published"><option value="false">Bản nháp</option><option value="true">Xuất bản</option></select></div>
<div class="msg" id="msg"></div><div class="ma"><button class="btn gray" onclick="closeModal()">Hủy</button><button class="btn green" onclick="saveCourse()">Lưu khóa học</button></div>
</div></div>
<script>
let user=null,courses=[],classes=[],links=[],subjects=[];
document.addEventListener("DOMContentLoaded",async()=>{
 const s=window.supabaseClient;if(!s){alert("Không kết nối được Supabase.");return}
 const {data:{user:u}}=await s.auth.getUser();if(!u){location.href="login.html";return}user=u;
 const {data:p}=await s.from("profiles").select("role").eq("id",u.id).single();const currentRole=String(p?.role||"").trim().toLowerCase();if(!p||!["teacher","admin"].includes(currentRole)){location.href="index.html";return}
 document.getElementById("search").addEventListener("input",render);document.getElementById("subjectFilter").addEventListener("change",render);document.getElementById("gradeFilter").addEventListener("change",render);await load();
});
async function load(){
 const s=window.supabaseClient;
 const roleResult=await s.from("profiles").select("role").eq("id",user.id).single();
 const isAdmin=String(roleResult.data?.role||"").trim().toLowerCase()==="admin";
 let courseQuery=s.from("courses").select("*").order("created_at",{ascending:false});
 let classQuery=s.from("classes").select("*").order("class_name");
 if(!isAdmin){
   courseQuery=courseQuery.eq("teacher_id",user.id);
   classQuery=classQuery.eq("teacher_id",user.id);
 }
 const [a,b,c,d]=await Promise.all([courseQuery,classQuery,s.from("course_classes").select("*"),s.from("subjects").select("*").order("subject_name")]);
 for(const r of [a,b,c,d])if(r.error){alert("Lỗi tải dữ liệu: "+r.error.message);return}
 courses=a.data||[];classes=b.data||[];links=c.data||[];subjects=[...new Map((d.data||[]).filter(x=>x.subject_name&&x.subject_name.trim()).map(x=>[x.subject_name.trim().toLocaleLowerCase("vi-VN"),{...x,subject_name:x.subject_name.trim()}])).values()];fillSubjects();render();
}
function fillSubjects(){
 const f=document.getElementById("subjectFilter"),s=document.getElementById("subject"),fv=f.value,sv=s.value;f.innerHTML='<option value="">Tất cả môn</option>';s.innerHTML='<option value="">-- Chọn môn học --</option>';
 subjects.forEach(x=>{const o=document.createElement("option");o.value=x.subject_name;o.textContent=x.subject_name;f.appendChild(o);const p=o.cloneNode(true);s.appendChild(p)});f.value=fv;s.value=sv;
}
function assigned(id){const ids=links.filter(x=>x.course_id===id).map(x=>x.class_id);return classes.filter(x=>ids.includes(x.id))}
function render(){
 document.getElementById("total").textContent=courses.length;document.getElementById("pub").textContent=courses.filter(x=>x.is_published).length;document.getElementById("draft").textContent=courses.filter(x=>!x.is_published).length;
 const q=document.getElementById("search").value.trim().toLocaleLowerCase("vi-VN"),sf=document.getElementById("subjectFilter").value,gf=document.getElementById("gradeFilter").value,g=document.getElementById("grid");g.innerHTML="";
 const arr=courses.filter(x=>(!q||(x.title+" "+x.subject+" "+(x.description||"")).toLocaleLowerCase("vi-VN").includes(q))&&(!sf||x.subject===sf)&&(!gf||String(x.grade)===gf));
 if(!arr.length){g.innerHTML='<div class="empty">Chưa có khóa học phù hợp.</div>';return}
 arr.forEach(x=>{const c=document.createElement("div");c.className="card";c.innerHTML='<div style="font-size:34px">📘</div><div class="ct"></div><div class="meta"></div><div class="classchips"></div><div class="status"></div><div class="actions"></div>';c.querySelector(".ct").textContent=x.title;c.querySelector(".meta").textContent="📚 "+x.subject+" • 🎓 Khối "+x.grade;const ch=c.querySelector(".classchips");assigned(x.id).forEach(z=>{const e=document.createElement("span");e.className="chip";e.textContent="🏫 "+z.class_name;ch.appendChild(e)});const st=c.querySelector(".status");st.className="status "+(x.is_published?"pub":"draft");st.textContent=x.is_published?"🟢 Đã xuất bản":"⚪ Bản nháp";
 const a=c.querySelector(".actions");[["📖 Bài học","",()=>location.href=`lessons.html?course=${encodeURIComponent(x.id)}`],["✏️ Sửa","orange",()=>openEdit(x)],["🗑️ Xóa","red",()=>removeCourse(x)]].forEach(v=>{const b=document.createElement("button");b.className=v[1]||"btn";b.textContent=v[0];b.onclick=v[2];a.appendChild(b)});g.appendChild(c)});
}
function classChecks(selected=[]){const b=document.getElementById("classList");b.innerHTML="";classes.forEach(x=>{const l=document.createElement("label");l.className="cc";const i=document.createElement("input");i.type="checkbox";i.value=x.id;i.checked=selected.includes(x.id);l.append(i,document.createTextNode(x.class_name+" ("+(x.school_year||"")+")"));b.appendChild(l)})}
function openCreate(){if(!subjects.length){alert("Chưa có môn học. Hãy vào Quản lý môn học và thêm môn trước.");location.href="subjects.html";return}document.getElementById("mt").textContent="➕ Tạo khóa học";document.getElementById("courseId").value="";document.getElementById("title").value="";document.getElementById("subject").value="";document.getElementById("grade").value="";document.getElementById("description").value="";document.getElementById("published").value="false";document.getElementById("msg").textContent="";classChecks([]);document.getElementById("modal").style.display="flex"}
function openEdit(x){document.getElementById("mt").textContent="✏️ Sửa khóa học";document.getElementById("courseId").value=x.id;document.getElementById("title").value=x.title||"";document.getElementById("subject").value=x.subject||"";document.getElementById("grade").value=String(x.grade||"");document.getElementById("description").value=x.description||"";document.getElementById("published").value=String(!!x.is_published);document.getElementById("msg").textContent="";classChecks(assigned(x.id).map(z=>z.id));document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
async function saveCourse(){const id=document.getElementById("courseId").value,title=document.getElementById("title").value.trim(),subject=document.getElementById("subject").value,grade=document.getElementById("grade").value,description=document.getElementById("description").value.trim(),is_published=document.getElementById("published").value==="true",ids=[...document.querySelectorAll("#classList input:checked")].map(x=>x.value),msg=document.getElementById("msg");if(!title||!subject||!grade){msg.style.color="#dc2626";msg.textContent="⚠️ Chọn đầy đủ tên khóa học, môn học và khối.";return}
 const s=window.supabaseClient;let cid=id;if(id){const {error}=await s.from("courses").update({title,subject,grade,description,is_published,updated_at:new Date().toISOString()}).eq("id",id);if(error){msg.textContent="❌ "+error.message;return}}else{const {data,error}=await s.from("courses").insert({title,subject,grade,description,is_published,teacher_id:user.id}).select("id").single();if(error){msg.textContent="❌ "+error.message;return}cid=data.id}
 let r=await s.from("course_classes").delete().eq("course_id",cid);if(r.error){msg.textContent="❌ "+r.error.message;return}if(ids.length){r=await s.from("course_classes").insert(ids.map(class_id=>({course_id:cid,class_id})));if(r.error){msg.textContent="❌ "+r.error.message;return}}closeModal();await load()}
async function removeCourse(x){if(!confirm(`Xóa khóa học "${x.title}"?`))return;const {error}=await window.supabaseClient.from("courses").delete().eq("id",x.id);if(error){alert("❌ "+error.message);return}await load()}
async function logout(){await window.supabaseClient.auth.signOut();location.href="login.html"}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
</script></body></html>
