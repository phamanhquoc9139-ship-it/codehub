<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 5px;
    }

    .btn:hover {
      background: #2563eb;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .count {
      color: #64748b;
      font-size: 16px;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      color: #172033;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #2563eb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    #error {
      color: #dc2626;
      padding: 20px;
      display: none;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      width: min(520px, 92%);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .modal-box h2 {
      margin-bottom: 22px;
    }

    .modal-box label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .modal-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-save,
    .btn-cancel {
      border: 0;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      background: #3182f6;
      color: white;
    }

    .btn-save:hover {
      background: #2563eb;
    }

    .btn-save:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #334155;
    }

    #studentMessage {
      margin-top: 15px;
      line-height: 1.5;
    }

    .filters { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .filters input, .filters select { padding:11px 13px; border:1px solid #cbd5e1; border-radius:9px; font-size:15px; }
    .filters input { flex:1; min-width:240px; }
    .action-btn { border:0; border-radius:8px; padding:7px 10px; cursor:pointer; font-weight:600; margin-right:5px; }
    .edit-btn { background:#e8f1ff; color:#2563eb; }
    .password-btn { background:#fef3c7; color:#92400e; }
    .delete-btn { background:#fee2e2; color:#dc2626; }
    @media (max-width: 700px) {
      header {
        padding: 15px;
      }

      .logo {
        font-size: 22px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">&lt;/&gt; CodeHub</div>

  <div>
    <button class="btn" onclick="goTeacher()">← Quản trị</button>
    <button class="btn" onclick="goHome()">Trang chủ</button>
    <button class="btn" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>

  <p class="subtitle">
    Danh sách học sinh trên hệ thống CodeHub
  </p>

  <div class="box">

    <div class="toolbar">

      <div id="studentCount" class="count"></div>

      <button class="btn" onclick="openStudentModal()">
        + Thêm học sinh
      </button>

    </div>

    <div class="filters">
      <input id="studentSearch" type="search" placeholder="🔎 Tìm theo họ tên hoặc mã học sinh...">
      <select id="classFilter"><option value="">Tất cả lớp</option></select>
    </div>

    <div id="loading">
      Đang tải danh sách học sinh...
    </div>

    <div id="error"></div>

    <table id="studentTable" style="display:none;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Mã học sinh</th>
          <th>Lớp</th>
          <th>Vai trò</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>

  </div>

</main>


<!-- MODAL THÊM HỌC SINH -->

<div id="studentModal" class="modal">

  <div class="modal-box">

    <h2>👨‍🎓 Thêm học sinh</h2>

    <label for="newFullName">Họ và tên</label>
    <input
      id="newFullName"
      type="text"
      placeholder="Ví dụ: Nguyễn Văn Bình"
    >

    <label for="newStudentCode">Mã học sinh</label>
    <input
      id="newStudentCode"
      type="text"
      placeholder="Ví dụ: HS002"
    >

    <label for="newClassName">Lớp</label>
    <input
      id="newClassName"
      type="text"
      placeholder="Ví dụ: 10A2"
    >

    <label for="newEmail">Email đăng nhập</label>
    <input
      id="newEmail"
      type="email"
      placeholder="Ví dụ: hocsinh02@codehub.vn"
      autocomplete="off"
    >

    <label for="newPassword">Mật khẩu</label>
    <input
      id="newPassword"
      type="password"
      placeholder="Tối thiểu 6 ký tự"
      autocomplete="new-password"
    >

    <div class="modal-actions">

      <button
        type="button"
        onclick="closeStudentModal()"
        class="btn-cancel"
      >
        Hủy
      </button>

      <button
        type="button"
        onclick="saveStudent()"
        class="btn-save"
      >
        Tạo tài khoản
      </button>

    </div>

    <p id="studentMessage"></p>

  </div>

</div>


<script>

let currentTeacher = null;
let allStudents = [];


/* ==========================
   KHỞI ĐỘNG TRANG
========================== */

document.addEventListener("DOMContentLoaded", async () => {

  const client = window.supabaseClient;

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  /* Kiểm tra đăng nhập */

  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();

  if (userError || !user) {
    window.location.href = "login.html";
    return;
  }

  /* Kiểm tra quyền giáo viên */

  const {
    data: teacherProfile,
    error: teacherError
  } = await client
    .from("profiles")
    .select("id, full_name, role")
    .eq("id", user.id)
    .single();

  if (
    teacherError ||
    !teacherProfile ||
    teacherProfile.role !== "teacher"
  ) {
    showError(
      "Bạn không có quyền truy cập trang quản lý học sinh."
    );
    return;
  }

  currentTeacher = teacherProfile;

  await loadStudents();

});


/* ==========================
   TẢI DANH SÁCH HỌC SINH
========================== */

async function loadStudents() {

  const client = window.supabaseClient;

  document.getElementById("loading").style.display = "block";
  document.getElementById("error").style.display = "none";

  const {
    data: students,
    error
  } = await client
    .from("profiles")
    .select(
      "id, full_name, student_code, class_name, role"
    )
    .eq("role", "student")
    .order("class_name", { ascending: true })
    .order("full_name", { ascending: true });

  document.getElementById("loading").style.display = "none";

  if (error) {

    console.error("LOAD STUDENTS:", error);

    showError(
      "Không tải được danh sách học sinh: " +
      error.message
    );

    return;
  }

  allStudents = students || [];
  populateClassFilter(allStudents);
  applyStudentFilters();
}


/* ==========================
   HIỂN THỊ DANH SÁCH
========================== */

function renderStudents(students) {

  const tbody =
    document.getElementById("studentList");

  const table =
    document.getElementById("studentTable");

  const count =
    document.getElementById("studentCount");

  tbody.innerHTML = "";

  if (students.length === 0) {

    count.textContent =
      "Hiện chưa có học sinh trong hệ thống.";

    table.style.display = "none";

    return;
  }

  students.forEach((student, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${index + 1}</td>

      <td>
        ${escapeHTML(student.full_name || "")}
      </td>

      <td>
        ${escapeHTML(student.student_code || "")}
      </td>

      <td>
        ${escapeHTML(student.class_name || "")}
      </td>

      <td>
        <span class="badge">Học sinh</span>
      </td>
      <td>
        <button class="action-btn edit-btn" onclick="editStudent('${student.id}')">✏️ Sửa</button>
        <button class="action-btn password-btn" onclick="resetStudentPassword('${student.id}', '${escapeJS(student.full_name || '')}')">🔑 Mật khẩu</button>
        <button class="action-btn delete-btn" onclick="deleteStudent('${student.id}', '${escapeJS(student.full_name || '')}')">🗑️ Xóa</button>
      </td>
    `;

    tbody.appendChild(row);

  });

  count.textContent =
    `Tổng số học sinh: ${students.length}`;

  table.style.display = "table";
}


function populateClassFilter(students) {
  const select = document.getElementById("classFilter");
  const current = select.value;
  const classes = [...new Set(students.map(s => (s.class_name || "").trim()).filter(Boolean))].sort();
  select.innerHTML = '<option value="">Tất cả lớp</option>' + classes.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");
  if (classes.includes(current)) select.value = current;
}

function applyStudentFilters() {
  const q = (document.getElementById("studentSearch")?.value || "").trim().toLowerCase();
  const cls = document.getElementById("classFilter")?.value || "";
  const filtered = allStudents.filter(s => {
    const matchesText = !q || (s.full_name || "").toLowerCase().includes(q) || (s.student_code || "").toLowerCase().includes(q);
    const matchesClass = !cls || s.class_name === cls;
    return matchesText && matchesClass;
  });
  renderStudents(filtered);
  if (filtered.length !== allStudents.length) {
    document.getElementById("studentCount").textContent = `Hiển thị ${filtered.length}/${allStudents.length} học sinh`;
  }
}

async function invokeManageStudent(body) {
  const client = window.supabaseClient;
  const { data: { session }, error: sessionError } = await client.auth.getSession();

  if (sessionError || !session?.access_token) {
    throw new Error("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
  }

  const { data, error } = await client.functions.invoke("manage-student", {
    body,
    headers: { Authorization: `Bearer ${session.access_token}` }
  });

  if (error) {
    let detail = "";
    try {
      if (error.context && typeof error.context.json === "function") {
        const errorBody = await error.context.json();
        detail = errorBody?.error || errorBody?.message || "";
      }
    } catch (_) {}
    throw new Error(detail || error.message || "Không thực hiện được thao tác.");
  }

  if (data?.success === false) {
    throw new Error(data?.error || "Không thực hiện được thao tác.");
  }
  return data;
}

async function editStudent(id) {
  const student = allStudents.find(s => s.id === id);
  if (!student) return;

  const fullName = prompt("Họ và tên:", student.full_name || "");
  if (fullName === null) return;
  const studentCode = prompt("Mã học sinh:", student.student_code || "");
  if (studentCode === null) return;
  const className = prompt("Lớp:", student.class_name || "");
  if (className === null) return;

  const cleanName = fullName.trim();
  const cleanCode = studentCode.trim().toUpperCase();
  const cleanClass = className.trim().toUpperCase();

  if (!cleanName || !cleanCode || !cleanClass) {
    alert("Vui lòng nhập đầy đủ họ tên, mã học sinh và lớp.");
    return;
  }

  try {
    await invokeManageStudent({
      action: "update", id,
      full_name: cleanName,
      student_code: cleanCode,
      class_name: cleanClass
    });
    alert("✅ Đã cập nhật học sinh.");
    await loadStudents();
  } catch (error) {
    alert("❌ Không sửa được học sinh: " + (error?.message || "Lỗi không xác định."));
  }
}

async function resetStudentPassword(id, name) {
  const password = prompt(`Nhập mật khẩu mới cho ${name}:\n(Tối thiểu 6 ký tự)`);
  if (password === null) return;
  if (password.length < 6) {
    alert("Mật khẩu phải có ít nhất 6 ký tự.");
    return;
  }

  try {
    await invokeManageStudent({ action: "reset_password", id, password });
    alert("✅ Đã đổi mật khẩu cho học sinh.");
  } catch (error) {
    alert("❌ Không đổi được mật khẩu: " + (error?.message || "Lỗi không xác định."));
  }
}

async function deleteStudent(id, name) {
  if (!confirm(`Xóa học sinh ${name}?\n\nThao tác này sẽ yêu cầu máy chủ xóa cả tài khoản Authentication và hồ sơ học sinh.`)) return;

  try {
    await invokeManageStudent({ action: "delete", id });
    alert("✅ Đã xóa học sinh.");
    await loadStudents();
  } catch (error) {
    alert("❌ Không xóa được học sinh: " + (error?.message || "Lỗi không xác định."));
  }
}

function escapeJS(value = "") {
  return String(value).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll("\n", " ").replaceAll("\r", " ");
}

document.addEventListener("input", e => { if (e.target.id === "studentSearch") applyStudentFilters(); });
document.addEventListener("change", e => { if (e.target.id === "classFilter") applyStudentFilters(); });

/* ==========================
   MỞ FORM THÊM HỌC SINH
========================== */

function openStudentModal() {

  document.getElementById("newFullName").value = "";
  document.getElementById("newStudentCode").value = "";
  document.getElementById("newClassName").value = "";
  document.getElementById("newEmail").value = "";
  document.getElementById("newPassword").value = "";

  document.getElementById("studentMessage").textContent = "";

  document.getElementById("studentModal").style.display =
    "flex";

}


/* ==========================
   ĐÓNG FORM
========================== */

function closeStudentModal() {

  document.getElementById("studentModal").style.display =
    "none";

}


/* ==========================
   LƯU HỌC SINH
========================== */

async function saveStudent() {

  const client = window.supabaseClient;
  const message = document.getElementById("studentMessage");
  const saveButton = document.querySelector(".btn-save");

  const fullName = document.getElementById("newFullName").value.trim();
  const studentCode = document.getElementById("newStudentCode").value.trim().toUpperCase();
  const className = document.getElementById("newClassName").value.trim().toUpperCase();
  const email = document.getElementById("newEmail").value.trim().toLowerCase();
  const password = document.getElementById("newPassword").value;

  if (!fullName || !studentCode || !className || !email || !password) {
    message.textContent = "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }

  if (!/^\S+@\S+\.\S+$/.test(email)) {
    message.textContent = "⚠️ Email không đúng định dạng.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "⚠️ Mật khẩu phải có ít nhất 6 ký tự.";
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = "Đang tạo...";
  message.textContent = "Đang tạo tài khoản học sinh...";

  try {
    // Lấy access token của giáo viên đang đăng nhập để Edge Function tự xác thực quyền.
    const {
      data: { session },
      error: sessionError
    } = await client.auth.getSession();

    if (sessionError || !session?.access_token) {
      throw new Error("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
    }

    const { data, error } = await client.functions.invoke("create-student", {
      body: {
        full_name: fullName,
        student_code: studentCode,
        class_name: className,
        email: email,
        password: password
      },
      headers: {
        Authorization: `Bearer ${session.access_token}`
      }
    });

    if (error) {
      // Cố gắng đọc nội dung lỗi do Edge Function trả về.
      let detail = "";
      try {
        if (error.context && typeof error.context.json === "function") {
          const errorBody = await error.context.json();
          detail = errorBody?.error || errorBody?.message || "";
        }
      } catch (_) {}

      throw new Error(detail || error.message || "Không tạo được học sinh.");
    }

    if (!data?.success) {
      throw new Error(data?.error || "Không tạo được học sinh.");
    }

    message.textContent = "✅ Tạo tài khoản học sinh thành công.";

    await loadStudents();

    setTimeout(() => {
      closeStudentModal();
    }, 800);

  } catch (error) {
    console.error("CREATE STUDENT:", error);
    message.textContent = "❌ " + (error?.message || "Có lỗi xảy ra khi tạo học sinh.");
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "Tạo tài khoản";
  }
}


/* ==========================
   ESCAPE HTML
========================== */

function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================
   THÔNG BÁO LỖI
========================== */

function showError(message) {

  document.getElementById("loading").style.display =
    "none";

  const error =
    document.getElementById("error");

  error.textContent = message;

  error.style.display = "block";

}


/* ==========================
   ĐIỀU HƯỚNG
========================== */

function goTeacher() {

  window.location.href =
    "teacher.html";

}

function goHome() {

  window.location.href =
    "index.html";

}

async function logout() {

  await window.supabaseClient.auth.signOut();

  window.location.href =
    "login.html";

}


/* Đóng modal khi click ra ngoài */

document
  .getElementById("studentModal")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      closeStudentModal();
    }

  });

</script>

</body>
</html>
