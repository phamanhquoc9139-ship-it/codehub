<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      color: #172033;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #2563eb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    #error {
      color: #dc2626;
      padding: 20px;
      display: none;
    }

    .count {
      margin-bottom: 15px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">&lt;/&gt; CodeHub</div>

  <div>
    <button class="btn" onclick="goTeacher()">← Quản trị</button>
    <button class="btn" onclick="goHome()">Trang chủ</button>
    <button class="btn" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>

  <p class="subtitle">
    Danh sách học sinh trên hệ thống CodeHub
  </p>

  <div class="box">

    <div id="studentCount" class="count"></div>

    <div id="loading">
      Đang tải danh sách học sinh...
    </div>

    <div id="error"></div>

    <table id="studentTable" style="display:none;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Mã học sinh</th>
          <th>Lớp</th>
          <th>Vai trò</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>

  </div>

</main>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  const client = window.supabaseClient;

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  // Kiểm tra đăng nhập
  const {
    data: { user }
  } = await client.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  // Kiểm tra tài khoản có phải giáo viên không
  const { data: teacherProfile, error: teacherError } =
    await client
      .from("profiles")
      .select("id, full_name, role")
      .eq("id", user.id)
      .single();

  if (
    teacherError ||
    !teacherProfile ||
    teacherProfile.role !== "teacher"
  ) {
    showError("Bạn không có quyền truy cập trang quản lý học sinh.");
    return;
  }

  // Lấy danh sách học sinh
  const { data: students, error } =
    await client
      .from("profiles")
      .select("id, full_name, student_code, class_name, role")
      .eq("role", "student")
      .order("class_name", { ascending: true })
      .order("full_name", { ascending: true });

  document.getElementById("loading").style.display = "none";

  if (error) {
    console.error(error);
    showError("Không tải được danh sách học sinh: " + error.message);
    return;
  }

  const tbody = document.getElementById("studentList");

  tbody.innerHTML = "";

  if (!students || students.length === 0) {

    document.getElementById("studentCount").textContent =
      "Hiện chưa có học sinh trong hệ thống.";

    document.getElementById("studentTable").style.display = "none";

    return;
  }

  students.forEach((student, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeHTML(student.full_name || "")}</td>
      <td>${escapeHTML(student.student_code || "")}</td>
      <td>${escapeHTML(student.class_name || "")}</td>
      <td>
        <span class="badge">Học sinh</span>
      </td>
    `;

    tbody.appendChild(row);
  });

  document.getElementById("studentCount").textContent =
    `Tổng số học sinh: ${students.length}`;

  document.getElementById("studentTable").style.display = "table";

});

function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function showError(message) {

  document.getElementById("loading").style.display = "none";

  const error = document.getElementById("error");

  error.textContent = message;
  error.style.display = "block";

}

function goTeacher() {
  window.location.href = "teacher.html";
}

function goHome() {
  window.location.href = "index.html";
}

async function logout() {

  await window.supabaseClient.auth.signOut();

  window.location.href = "login.html";
}

</script>

</body>
</html>
