<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    function openStudentModal() {
  document.getElementById("studentModal").style.display = "flex";
}

function closeStudentModal() {
  document.getElementById("studentModal").style.display = "none";
}

async function saveStudent() {

  const client = window.supabaseClient;

  const id = document.getElementById("newStudentId").value.trim();
  const fullName = document.getElementById("newFullName").value.trim();
  const studentCode = document.getElementById("newStudentCode").value.trim();
  const className = document.getElementById("newClassName").value.trim();

  const message = document.getElementById("studentMessage");

  if (!id || !fullName || !studentCode || !className) {
    message.textContent = "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }

  message.textContent = "Đang thêm học sinh...";

  const { error } = await client
    .from("profiles")
    .upsert({
      id: id,
      full_name: fullName,
      student_code: studentCode,
      class_name: className,
      role: "student"
    }, {
      onConflict: "id"
    });

  if (error) {
    console.error(error);
    message.textContent = "❌ " + error.message;
    return;
  }

  message.textContent = "✅ Thêm học sinh thành công.";

  setTimeout(() => {
    closeStudentModal();
    location.reload();
  }, 800);
}
    .modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .55);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: min(520px, 92%);
  background: white;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.modal-box h2 {
  margin-bottom: 22px;
}

.modal-box label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: 600;
}

.modal-box input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
}

.btn-save,
.btn-cancel {
  border: 0;
  padding: 11px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}

.btn-save {
  background: #3182f6;
  color: white;
}

.btn-cancel {
  background: #e2e8f0;
  color: #334155;
}

#studentMessage {
  margin-top: 15px;
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    <button class="btn" onclick="openStudentModal()">
  + Thêm học sinh
</button>

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      color: #172033;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #2563eb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    #error {
      color: #dc2626;
      padding: 20px;
      display: none;
    }

    .count {
      margin-bottom: 15px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">&lt;/&gt; CodeHub</div>

  <div>
    <button class="btn" onclick="goTeacher()">← Quản trị</button>
    <button class="btn" onclick="goHome()">Trang chủ</button>
    <button class="btn" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>

  <p class="subtitle">
    Danh sách học sinh trên hệ thống CodeHub
  </p>

  <div class="box">

    <div id="studentCount" class="count"></div>

    <div id="loading">
      Đang tải danh sách học sinh...
    </div>

    <div id="error"></div>

    <table id="studentTable" style="display:none;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Mã học sinh</th>
          <th>Lớp</th>
          <th>Vai trò</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>

  </div>

</main>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  const client = window.supabaseClient;

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  // Kiểm tra đăng nhập
  const {
    data: { user }
  } = await client.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  // Kiểm tra tài khoản có phải giáo viên không
  const { data: teacherProfile, error: teacherError } =
    await client
      .from("profiles")
      .select("id, full_name, role")
      .eq("id", user.id)
      .single();

  if (
    teacherError ||
    !teacherProfile ||
    teacherProfile.role !== "teacher"
  ) {
    showError("Bạn không có quyền truy cập trang quản lý học sinh.");
    return;
  }

  // Lấy danh sách học sinh
  const { data: students, error } =
    await client
      .from("profiles")
      .select("id, full_name, student_code, class_name, role")
      .eq("role", "student")
      .order("class_name", { ascending: true })
      .order("full_name", { ascending: true });

  document.getElementById("loading").style.display = "none";

  if (error) {
    console.error(error);
    showError("Không tải được danh sách học sinh: " + error.message);
    return;
  }

  const tbody = document.getElementById("studentList");

  tbody.innerHTML = "";

  if (!students || students.length === 0) {

    document.getElementById("studentCount").textContent =
      "Hiện chưa có học sinh trong hệ thống.";

    document.getElementById("studentTable").style.display = "none";

    return;
  }

  students.forEach((student, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeHTML(student.full_name || "")}</td>
      <td>${escapeHTML(student.student_code || "")}</td>
      <td>${escapeHTML(student.class_name || "")}</td>
      <td>
        <span class="badge">Học sinh</span>
      </td>
    `;

    tbody.appendChild(row);
  });

  document.getElementById("studentCount").textContent =
    `Tổng số học sinh: ${students.length}`;

  document.getElementById("studentTable").style.display = "table";

});

function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function showError(message) {

  document.getElementById("loading").style.display = "none";

  const error = document.getElementById("error");

  error.textContent = message;
  error.style.display = "block";

}

function goTeacher() {
  window.location.href = "teacher.html";
}

function goHome() {
  window.location.href = "index.html";
}

async function logout() {

  await window.supabaseClient.auth.signOut();

  window.location.href = "login.html";
}

</script>
<div id="studentModal" class="modal">
  <div class="modal-box">

    <h2>👨‍🎓 Thêm học sinh</h2>

    <label>Họ và tên</label>
    <input id="newFullName" type="text"
           placeholder="Ví dụ: Nguyễn Văn Bình">

    <label>Mã học sinh</label>
    <input id="newStudentCode" type="text"
           placeholder="Ví dụ: HS002">

    <label>Lớp</label>
    <input id="newClassName" type="text"
           placeholder="Ví dụ: 10A2">

    <label>UID tài khoản Supabase</label>
    <input id="newStudentId" type="text"
           placeholder="Dán UID từ Authentication → Users">

    <div class="modal-actions">
      <button onclick="closeStudentModal()" class="btn-cancel">
        Hủy
      </button>

      <button onclick="saveStudent()" class="btn-save">
        Thêm học sinh
      </button>
    </div>

    <p id="studentMessage"></p>

  </div>
</div>
</body>
</html>
