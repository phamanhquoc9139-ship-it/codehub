<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý học sinh V3.7.0 | CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="scripts/supabase-config.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-7xl mx-auto p-5">
<div class="flex flex-wrap justify-between gap-3 mb-5">
  <div><h1 class="text-3xl font-black">👨‍🎓 Quản lý học sinh <span class="text-violet-600 text-lg">V3.7.0</span></h1>
  <p class="text-slate-500">Excel có Tên trường + Lớp → tự tạo trường/lớp (Admin) → gán HS đúng class_id.</p></div>
  <div class="flex gap-2"><a href="schools.html" id="schoolAdminLink" class="hidden border bg-white px-4 py-2 rounded-xl font-bold">🏫 Trường</a><a href="teacher.html" class="border bg-white px-4 py-2 rounded-xl font-bold">← Dashboard</a></div>
</div>

<div id="msg" class="hidden mb-4 p-3 rounded-xl"></div>

<section class="bg-white shadow rounded-2xl p-5">
  <div class="flex flex-wrap justify-between gap-2 mb-4">
    <div id="count" class="font-bold text-slate-600">0 học sinh</div>
    <div class="flex flex-wrap gap-2">
      <button id="templateBtn" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold">📄 File mẫu</button>
      <button id="importBtn" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold">📥 Nhập Excel</button>
      <button id="credBtn" disabled class="bg-violet-600 text-white px-4 py-2 rounded-xl font-bold disabled:opacity-40">⬇ Tài khoản vừa tạo</button>
      <button id="addBtn" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">+ Thêm thủ công</button>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-3 mb-4">
    <input id="search" class="border rounded-xl p-3" placeholder="Tìm họ tên / mã HS">
    <select id="schoolFilter" class="border rounded-xl p-3"></select>
    <select id="classFilter" class="border rounded-xl p-3"></select>
  </div>

  <div class="overflow-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-100"><tr><th class="p-3">STT</th><th class="p-3 text-left">Họ tên</th><th class="p-3">Mã HS</th><th class="p-3 text-left">Trường</th><th class="p-3">Lớp</th><th class="p-3">Năm học</th><th class="p-3">Thao tác</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 p-4 overflow-auto">
 <div class="max-w-2xl mx-auto mt-10 bg-white rounded-2xl shadow-xl p-5">
  <div class="flex justify-between"><h2 id="modalTitle" class="text-xl font-black"></h2><button onclick="closeModal()" class="border rounded-lg px-3">✕</button></div>
  <div id="modalBody" class="mt-4"></div>
 </div>
</div>

<script>
const s=window.supabaseClient,$=x=>document.getElementById(x);
const STUDENT_IMPORT_FUNCTION="https://drfcejvmyhzorwepndta.supabase.co/functions/v1/student-import";
const MANAGE_FUNCTION="https://drfcejvmyhzorwepndta.supabase.co/functions/v1/manage-student";
let me,role,students=[],classes=[],lastCredentials=[],pending=[];

const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=v=>String(v||"").trim().replace(/\s+/g," ");
const cls=v=>norm(v).toUpperCase();
const school=v=>norm(v).toUpperCase();
const header=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
function academicYear(){let d=new Date(),y=d.getFullYear();return d.getMonth()+1>=8?`${y}-${y+1}`:`${y-1}-${y}`}
function say(t,ok=false){msg.className="mb-4 p-3 rounded-xl "+(ok?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-700");msg.textContent=t}
async function token(){const r=await s.auth.getSession();if(!r.data.session)throw new Error("Phiên đăng nhập hết hạn.");return r.data.session.access_token}
async function callEdge(url,payload){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+await token()},body:JSON.stringify(payload)});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(data.error||"Edge Function lỗi.");return data}

async function init(){
 me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";
 const p=await s.from("profiles").select("role").eq("id",me.id).single();role=String(p.data?.role||"").toLowerCase();
 if(!["admin","teacher"].includes(role))return location.href="student-dashboard.html";
 if(role==="admin")schoolAdminLink.classList.remove("hidden");
 await reload();
 search.oninput=render;schoolFilter.onchange=()=>{buildClassFilter();render()};classFilter.onchange=render;
}
async function reload(){
 const [cr,sr]=await Promise.all([s.rpc("codehub_v370_classes_for_user"),s.rpc("codehub_v370_students")]);
 if(cr.error)return say(cr.error.message);if(sr.error)return say(sr.error.message);
 classes=cr.data||[];students=sr.data||[];
 buildSchoolFilter();buildClassFilter();render();
}
function buildSchoolFilter(){
 const old=schoolFilter.value;const names=[...new Set(classes.map(x=>x.school_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"vi"));
 schoolFilter.innerHTML='<option value="">Tất cả trường</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("");if(names.includes(old))schoolFilter.value=old;
}
function buildClassFilter(){
 const old=classFilter.value,sc=schoolFilter.value;
 const list=classes.filter(x=>!sc||x.school_name===sc);
 classFilter.innerHTML='<option value="">Tất cả lớp</option>'+list.map(x=>`<option value="${x.id}">${esc(x.class_name)}${x.school_year?` (${esc(x.school_year)})`:""}</option>`).join("");
 if([...classFilter.options].some(o=>o.value===old))classFilter.value=old;
}
function render(){
 const q=search.value.trim().toLowerCase(),sc=schoolFilter.value,cid=classFilter.value;
 const data=students.filter(x=>(!sc||x.school_name===sc)&&(!cid||x.class_id===cid)&&(!q||String(x.full_name).toLowerCase().includes(q)||String(x.student_code).toLowerCase().includes(q)));
 count.textContent=`Tổng số học sinh: ${students.length}`;
 rows.innerHTML=data.map((x,i)=>`<tr class="border-t"><td class="p-3 text-center">${i+1}</td><td class="p-3 font-semibold">${esc(x.full_name)}</td><td class="p-3 text-center">${esc(x.student_code)}</td><td class="p-3">${esc(x.school_name)}</td><td class="p-3 text-center">${esc(x.class_name)}</td><td class="p-3 text-center">${esc(x.school_year||"—")}</td><td class="p-3 text-center"><button class="text-blue-600 font-bold" onclick="editStudent('${x.id}')">Sửa</button> · <button class="text-amber-600 font-bold" onclick="resetPassword('${x.id}')">Mật khẩu</button> · <button class="text-red-600 font-bold" onclick="deleteStudent('${x.id}')">Xóa</button></td></tr>`).join("")||'<tr><td colspan="7" class="p-8 text-center text-slate-500">Không có học sinh.</td></tr>';
}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.remove("hidden")}
function closeModal(){modal.classList.add("hidden")}

function classOptions(selected=""){return classes.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.school_name)} • ${esc(x.class_name)}${x.school_year?` • ${esc(x.school_year)}`:""}</option>`).join("")}

addBtn.onclick=()=>openModal("Thêm học sinh",`<div class="space-y-3"><input id="mName" class="w-full border p-3 rounded-xl" placeholder="Họ và tên"><input id="mCode" class="w-full border p-3 rounded-xl" placeholder="Mã HS (có thể để trống)"><select id="mClass" class="w-full border p-3 rounded-xl"><option value="">-- Chọn trường / lớp --</option>${classOptions()}</select><button onclick="createStudent()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Tạo tài khoản</button><div id="mMsg"></div></div>`);
async function createStudent(){
 const fullName=norm(mName.value),studentCode=cls(mCode.value),c=classes.find(x=>x.id===mClass.value);if(!fullName||!c)return mMsg.textContent="Chọn đầy đủ họ tên và lớp.";
 try{mMsg.textContent="Đang tạo...";const r=await callEdge(STUDENT_IMPORT_FUNCTION,{action:"single",rows:[{fullName,studentCode,className:c.class_name}]});const made=r.created||[];if(!made.length)throw new Error((r.errors||[])[0]?.error||"Không tạo được.");
 const z=made[0];const b=await s.rpc("codehub_v370_bind_student_by_code",{p_student_code:z.student_code,p_school:c.school_id,p_class:c.id});if(b.error)throw b.error;
 z.school_name=c.school_name;lastCredentials.push(z);credBtn.disabled=false;mMsg.innerHTML=`<div class="text-emerald-700 font-bold">✓ Đã tạo ${esc(z.student_code)}</div>`;await reload();
 }catch(e){mMsg.textContent="❌ "+(e.message||e)}
}

templateBtn.onclick=()=>{const a=[{"Họ và tên":"Nguyễn Văn A","Mã học sinh":"","Tên trường":"TRƯỜNG THPT PHÚ HÒA","Lớp":"10A1","Năm học":academicYear()},{"Họ và tên":"Trần Thị B","Mã học sinh":"HS010","Tên trường":"TRƯỜNG THPT TRUNG PHÚ","Lớp":"10A1","Năm học":academicYear()}];const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(a);ws["!cols"]=[{wch:28},{wch:18},{wch:30},{wch:12},{wch:14}];XLSX.utils.book_append_sheet(wb,ws,"Danh sach hoc sinh");XLSX.writeFile(wb,"CodeHub_mau_import_hoc_sinh_V3_7_0.xlsx")};

importBtn.onclick=()=>openModal("Nhập học sinh từ Excel",`<input id="excelFile" type="file" accept=".xlsx,.xls,.csv" class="w-full border p-3 rounded-xl"><p class="text-sm text-slate-500 mt-2">Cần có: <b>Họ và tên</b>, <b>Tên trường</b>, <b>Lớp</b>. Mã HS có thể để trống. Nếu Admin import trường/lớp chưa có, CodeHub tự tạo.</p><div class="flex gap-2 mt-4"><button onclick="previewExcel()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">Xem trước</button><button id="doImportBtn" onclick="doImport()" disabled class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold disabled:opacity-40">Tạo tài khoản</button></div><div id="importStatus" class="mt-3"></div><div id="preview" class="mt-3 overflow-auto"></div>`);

function colIndex(row,aliases){for(let i=0;i<row.length;i++)if(aliases.includes(header(row[i])))return i;return -1}
async function previewExcel(){
 try{
  const f=excelFile.files?.[0];if(!f)throw new Error("Chọn file Excel.");
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],m=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false,blankrows:false});
  let hi=-1,ni=-1,ci=-1,si=-1,yi=-1,codei=-1;
  const N=["hovaten","hoten","fullname","studentname","tenhocsinh"],C=["lop","lophoc","classname","class","tenlop"],S=["tentruong","truong","school","schoolname"],Y=["namhoc","schoolyear"],K=["mahocsinh","mahs","studentcode","studentid","code"];
  for(let r=0;r<Math.min(30,m.length);r++){ni=colIndex(m[r],N);ci=colIndex(m[r],C);si=colIndex(m[r],S);yi=colIndex(m[r],Y);codei=colIndex(m[r],K);if(ni>=0&&ci>=0&&si>=0){hi=r;break}}
  if(hi<0)throw new Error("Không thấy đủ cột Họ và tên + Tên trường + Lớp.");
  pending=[];for(let r=hi+1;r<m.length;r++){const name=norm(m[r][ni]),cn=cls(m[r][ci]),sn=school(m[r][si]),code=codei>=0?cls(m[r][codei]):"",year=yi>=0?norm(m[r][yi]):academicYear();if(name)pending.push({row:r+1,fullName:name,studentCode:code,schoolName:sn,className:cn,schoolYear:year})}
  const bad=pending.filter(x=>!x.schoolName||!x.className);if(bad.length)throw new Error(`${bad.length} dòng thiếu Tên trường hoặc Lớp.`);
  preview.innerHTML=`<table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-2">Dòng</th><th>Họ tên</th><th>Mã HS</th><th>Trường</th><th>Lớp</th><th>Năm học</th></tr></thead><tbody>${pending.slice(0,30).map(x=>`<tr class="border-t"><td class="p-2">${x.row}</td><td>${esc(x.fullName)}</td><td>${esc(x.studentCode||"(tự tạo)")}</td><td>${esc(x.schoolName)}</td><td>${esc(x.className)}</td><td>${esc(x.schoolYear)}</td></tr>`).join("")}</tbody></table>`;
  importStatus.textContent=`Đọc được ${pending.length} học sinh.`;doImportBtn.disabled=!pending.length;
 }catch(e){pending=[];doImportBtn.disabled=true;importStatus.textContent="❌ "+e.message}
}
async function doImport(){
 if(!pending.length)return;doImportBtn.disabled=true;importStatus.textContent="Đang tạo trường/lớp và tài khoản...";
 try{
  const orgMap=new Map();
  for(const x of pending){
   const key=[x.schoolName,x.className,x.schoolYear].join("||");
   if(!orgMap.has(key)){
    const r=await s.rpc("codehub_v370_resolve_org",{p_school_name:x.schoolName,p_class_name:x.className,p_school_year:x.schoolYear});
    if(r.error)throw r.error;orgMap.set(key,(r.data||[])[0]);
   }
   x.org=orgMap.get(key);
  }
  const r=await callEdge(STUDENT_IMPORT_FUNCTION,{action:"bulk",rows:pending.map(x=>({fullName:x.fullName,studentCode:x.studentCode,className:x.className}))});
  const made=r.created||[],errors=r.errors||[],queues=new Map();
  for(const x of pending){const k=(x.fullName+"||"+x.className).toLowerCase();if(!queues.has(k))queues.set(k,[]);queues.get(k).push(x)}
  let bound=0;
  for(const z of made){
   const k=(norm(z.full_name)+"||"+cls(z.class_name)).toLowerCase(),q=queues.get(k)||[],src=q.shift();
   if(!src)continue;
   const b=await s.rpc("codehub_v370_bind_student_by_code",{p_student_code:z.student_code,p_school:src.org.school_id,p_class:src.org.class_id});
   if(!b.error){bound++;z.school_name=src.schoolName;z.class_name=src.className;lastCredentials.push(z)}
  }
  credBtn.disabled=!lastCredentials.length;
  importStatus.innerHTML=`<div class="text-emerald-700 font-bold">✓ Tạo ${made.length}, gán đúng trường/lớp ${bound}, lỗi ${errors.length}.</div>`;
  await reload();
 }catch(e){importStatus.textContent="❌ "+(e.message||e)}
 finally{doImportBtn.disabled=false}
}
credBtn.onclick=()=>{if(!lastCredentials.length)return;const data=lastCredentials.map((x,i)=>({"STT":i+1,"Họ và tên":x.full_name||"","Mã HS / Username":x.student_code||"","Trường":x.school_name||"","Lớp":x.class_name||"","Mật khẩu":x.password||"","Email":x.email||""}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"Tai khoan");XLSX.writeFile(wb,"CodeHub_tai_khoan_hoc_sinh_V3_7_0.xlsx")};

function editStudent(id){const x=students.find(z=>z.id===id);if(!x)return;openModal("Sửa học sinh",`<div class="space-y-3"><input id="eName" class="w-full border p-3 rounded-xl" value="${esc(x.full_name)}"><input id="eCode" class="w-full border p-3 rounded-xl" value="${esc(x.student_code)}"><select id="eClass" class="w-full border p-3 rounded-xl">${classOptions(x.class_id)}</select><button onclick="saveStudent('${id}')" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Lưu</button><div id="eMsg"></div></div>`)}
async function saveStudent(id){const c=classes.find(x=>x.id===eClass.value);if(!c)return eMsg.textContent="Chọn lớp.";try{const r=await callEdge(MANAGE_FUNCTION,{action:"update",studentId:id,fullName:norm(eName.value),studentCode:cls(eCode.value),className:c.class_name});const b=await s.rpc("codehub_v370_bind_student_id",{p_student:id,p_school:c.school_id,p_class:c.id});if(b.error)throw b.error;eMsg.textContent="✓ Đã cập nhật";await reload();setTimeout(closeModal,500)}catch(e){eMsg.textContent="❌ "+e.message}}
async function resetPassword(id){const pw=prompt("Mật khẩu mới (ít nhất 6 ký tự):");if(!pw)return;if(pw.length<6)return alert("Mật khẩu quá ngắn.");try{await callEdge(MANAGE_FUNCTION,{action:"reset-password",studentId:id,newPassword:pw});alert("Đã đổi mật khẩu.")}catch(e){alert(e.message)}}
async function deleteStudent(id){const x=students.find(z=>z.id===id);if(!x||!confirm(`Xóa ${x.full_name}?`))return;try{await callEdge(MANAGE_FUNCTION,{action:"delete",studentId:id});await reload()}catch(e){alert(e.message)}}
init();
</script>
</body></html>
