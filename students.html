<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
      cursor: pointer;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .teacher-name {
      font-weight: bold;
      margin-right: 10px;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #64748b;
    }

    .container {
      max-width: 1250px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .toolbar {
      background: white;
      padding: 20px;
      border-radius: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .search,
    select {
      padding: 12px 14px;
      border: 1px solid #dbe1ea;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    .search {
      flex: 1;
      min-width: 250px;
    }

    .table-box {
      background: white;
      border-radius: 16px;
      overflow-x: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #f8fafc;
      text-align: left;
      padding: 16px;
      color: #475569;
      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #eef2f7;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #e8f1ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 45px;
      color: #64748b;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
    }

    #errorBox {
      display: none;
      background: #fff;
      border-left: 5px solid #ef4444;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px;
      }

      .teacher-name {
        display: none;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo" onclick="window.location.href='index.html'">
    &lt;/&gt; CodeHub
  </div>

  <div class="header-right">

    <span id="teacherName" class="teacher-name">
      Giáo viên
    </span>

    <button class="btn btn-secondary"
            onclick="window.location.href='teacher.html'">
      ← Quản trị
    </button>

    <button class="btn" onclick="logout()">
      Đăng xuất
    </button>

  </div>

</header>


<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>

  <p class="subtitle">
    Danh sách học sinh trên hệ thống CodeHub
  </p>


  <div id="errorBox"></div>


  <div class="toolbar">

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="🔍 Tìm theo tên hoặc mã học sinh..."
    >

    <select id="classFilter">
      <option value="">Tất cả lớp</option>
    </select>

    <button class="btn" id="addStudentBtn">
      + Thêm học sinh
    </button>

  </div>


  <div class="table-box">

    <div id="loading">
      Đang tải danh sách học sinh...
    </div>

    <table id="studentTable" style="display:none;">

      <thead>
        <tr>
          <th>STT</th>
          <th>Mã học sinh</th>
          <th>Họ và tên</th>
          <th>Lớp</th>
          <th>Vai trò</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody id="studentBody"></tbody>

    </table>

    <div id="emptyState"
         class="empty"
         style="display:none;">
      Chưa có học sinh.
    </div>

  </div>

</main>


<script>

const client = window.supabaseClient;

let students = [];


/* ==============================
   KIỂM TRA GIÁO VIÊN
================================ */

document.addEventListener("DOMContentLoaded", async () => {

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();


  if (userError || !user) {
    window.location.href = "login.html";
    return;
  }


  const { data: profile, error } = await client
    .from("profiles")
    .select("full_name, role")
    .eq("id", user.id)
    .single();


  if (error || !profile || profile.role !== "teacher") {

    showError(
      "Tài khoản này không có quyền truy cập trang quản lý học sinh."
    );

    document.getElementById("loading").style.display = "none";

    return;
  }


  document.getElementById("teacherName").textContent =
    profile.full_name || "Giáo viên";


  await loadStudents();

});


/* ==============================
   TẢI HỌC SINH
================================ */

async function loadStudents() {

  document.getElementById("loading").style.display = "block";

  const { data, error } = await client
    .from("profiles")
    .select("id, full_name, student_code, class_name, role")
    .eq("role", "student")
    .order("class_name", { ascending: true })
    .order("full_name", { ascending: true });


  document.getElementById("loading").style.display = "none";


  if (error) {

    console.error("Lỗi tải học sinh:", error);

    showError(
      "Chưa đọc được danh sách học sinh: " + error.message
    );

    return;
  }


  students = data || [];

  createClassFilter();

  renderStudents(students);

}


/* ==============================
   HIỂN THỊ DANH SÁCH
================================ */

function renderStudents(list) {

  const tbody =
    document.getElementById("studentBody");

  const table =
    document.getElementById("studentTable");

  const empty =
    document.getElementById("emptyState");


  tbody.innerHTML = "";


  if (!list.length) {

    table.style.display = "none";
    empty.style.display = "block";

    return;
  }


  empty.style.display = "none";
  table.style.display = "table";


  list.forEach((student, index) => {

    const tr = document.createElement("tr");


    tr.innerHTML = `

      <td>${index + 1}</td>

      <td>
        ${escapeHTML(student.student_code || "—")}
      </td>

      <td>
        <strong>
          ${escapeHTML(student.full_name || "Chưa cập nhật")}
        </strong>
      </td>

      <td>
        ${escapeHTML(student.class_name || "—")}
      </td>

      <td>
        <span class="badge">
          Học sinh
        </span>
      </td>

      <td>
        <button
          class="btn"
          style="padding:7px 11px;"
          onclick="editStudent('${student.id}')">
          ✏️ Sửa
        </button>
      </td>

    `;


    tbody.appendChild(tr);

  });

}


/* ==============================
   DANH SÁCH LỚP
================================ */

function createClassFilter() {

  const select =
    document.getElementById("classFilter");


  const classes = [

    ...new Set(

      students
        .map(s => s.class_name)
        .filter(Boolean)

    )

  ].sort();


  select.innerHTML =
    `<option value="">Tất cả lớp</option>`;


  classes.forEach(className => {

    const option =
      document.createElement("option");

    option.value = className;
    option.textContent = className;

    select.appendChild(option);

  });

}


/* ==============================
   TÌM KIẾM + LỌC
================================ */

function applyFilters() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const selectedClass =
    document.getElementById("classFilter").value;


  const filtered = students.filter(student => {

    const name =
      (student.full_name || "").toLowerCase();

    const code =
      (student.student_code || "").toLowerCase();


    const matchSearch =
      !keyword ||
      name.includes(keyword) ||
      code.includes(keyword);


    const matchClass =
      !selectedClass ||
      student.class_name === selectedClass;


    return matchSearch && matchClass;

  });


  renderStudents(filtered);

}


document
  .getElementById("searchInput")
  .addEventListener("input", applyFilters);


document
  .getElementById("classFilter")
  .addEventListener("change", applyFilters);


/* ==============================
   NÚT THÊM/SỬA
================================ */

document
  .getElementById("addStudentBtn")
  .addEventListener("click", () => {

    alert(
      "Bước tiếp theo chúng ta sẽ tạo chức năng Thêm học sinh."
    );

  });


function editStudent(id) {

  const student =
    students.find(item => item.id === id);


  if (!student) return;


  alert(
    "Sửa học sinh: " +
    (student.full_name || student.student_code)
  );

}


/* ==============================
   TIỆN ÍCH
================================ */

function escapeHTML(value = "") {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";

}


async function logout() {

  await client.auth.signOut();

  window.location.href = "login.html";

}

</script>

</body>
</html>
