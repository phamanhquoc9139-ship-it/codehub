<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .btn:hover {
      opacity: .9;
    }

    .container {
      max-width: 1500px;
      margin: 55px auto;
      padding: 0 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #64748b;
      font-size: 20px;
      margin-bottom: 38px;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .count {
      color: #64748b;
      font-size: 19px;
    }

    .tools {
      display: flex;
      gap: 14px;
      margin-bottom: 22px;
    }

    .search {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
    }

    .filter {
      min-width: 160px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      text-align: left;
      padding: 17px;
      font-size: 17px;
    }

    td {
      padding: 17px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 16px;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #2563eb;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-edit,
    .btn-password,
    .btn-delete {
      border: 0;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-edit {
      background: #e8f1ff;
      color: #2563eb;
    }

    .btn-password {
      background: #fff2c7;
      color: #92400e;
    }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
    }

    #loading {
      padding: 30px;
      text-align: center;
      color: #64748b;
    }

    #error {
      display: none;
      color: #dc2626;
      padding: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: min(560px, 95%);
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-box h2 {
      margin-bottom: 24px;
      font-size: 27px;
    }

    .modal-box label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    .modal-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }

    .btn-cancel {
      border: 0;
      background: #e2e8f0;
      color: #334155;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
    }

    @media (max-width: 800px) {
      header {
        padding: 15px;
        flex-direction: column;
        gap: 15px;
      }

      .container {
        margin-top: 30px;
        padding: 0 15px;
      }

      h1 {
        font-size: 32px;
      }

      .tools,
      .box-top {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">&lt;/&gt; CodeHub</div>

  <div class="header-actions">
    <button class="btn" onclick="goTeacher()">← Quản trị</button>
    <button class="btn" onclick="goHome()">Trang chủ</button>
    <button class="btn" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>
  <p class="subtitle">Danh sách học sinh trên hệ thống CodeHub</p>

  <div class="box">

    <div class="box-top">
      <div id="studentCount" class="count">
        Đang tải...
      </div>

      <button class="btn" onclick="openAddModal()">
        + Thêm học sinh
      </button>
    </div>

    <div class="tools">
      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="🔎 Tìm theo họ tên hoặc mã học sinh..."
      >

      <select id="classFilter" class="filter">
        <option value="">Tất cả lớp</option>
      </select>
    </div>

    <div id="loading">
      Đang tải danh sách học sinh...
    </div>

    <div id="error"></div>

    <table id="studentTable" style="display:none;">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Mã học sinh</th>
          <th>Lớp</th>
          <th>Vai trò</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody id="studentList"></tbody>
    </table>

  </div>

</main>


<!-- ================= THÊM HỌC SINH ================= -->

<div id="addModal" class="modal">
  <div class="modal-box">

    <h2>👨‍🎓 Thêm học sinh</h2>

    <label>Họ và tên</label>
    <input id="addFullName"
           placeholder="Ví dụ: Nguyễn Văn Bình">

    <label>Mã học sinh</label>
    <input id="addStudentCode"
           placeholder="Ví dụ: HS002">

    <label>Lớp</label>
    <input id="addClassName"
           placeholder="Ví dụ: 10A2">

    <label>Email đăng nhập</label>
    <input id="addEmail"
           type="email"
           placeholder="Ví dụ: hocsinh02@codehub.vn">

    <label>Mật khẩu</label>
    <input id="addPassword"
           type="password"
           placeholder="Tối thiểu 6 ký tự">

    <div class="modal-actions">
      <button class="btn-cancel"
              onclick="closeAddModal()">
        Hủy
      </button>

      <button class="btn-save"
              onclick="createStudent()">
        Tạo tài khoản
      </button>
    </div>

    <div id="addMessage" class="message"></div>

  </div>
</div>


<!-- ================= SỬA HỌC SINH ================= -->

<div id="editModal" class="modal">
  <div class="modal-box">

    <h2>✏️ Sửa học sinh</h2>

    <!-- ID thật của profiles -->
    <input id="editId" type="hidden">

    <label>Họ và tên</label>
    <input id="editFullName">

    <label>Mã học sinh</label>
    <input id="editStudentCode">

    <label>Lớp</label>
    <input id="editClassName">

    <div class="modal-actions">

      <button class="btn-cancel"
              onclick="closeEditModal()">
        Hủy
      </button>

      <button class="btn-save"
              onclick="saveEditStudent()">
        Lưu thay đổi
      </button>

    </div>

    <div id="editMessage" class="message"></div>

  </div>
</div>


<script>

const FUNCTION_BASE =
  "https://drfcejvmyhzorwepndta.supabase.co/functions/v1";

let allStudents = [];


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

document.addEventListener("DOMContentLoaded", async () => {

  const client = window.supabaseClient;

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  const {
    data: { user }
  } = await client.auth.getUser();

  if (!user) {
    location.href = "login.html";
    return;
  }


  /* KIỂM TRA GIÁO VIÊN */

  const {
    data: profile,
    error
  } = await client
    .from("profiles")
    .select("id, full_name, role")
    .eq("id", user.id)
    .single();

  if (
    error ||
    !profile ||
    profile.role !== "teacher"
  ) {
    showError(
      "Bạn không có quyền truy cập trang quản lý học sinh."
    );
    return;
  }


  await loadStudents();

});


/* =====================================================
   LOAD DANH SÁCH
===================================================== */

async function loadStudents() {

  const client = window.supabaseClient;

  document.getElementById("loading").style.display = "block";

  const {
    data,
    error
  } = await client
    .from("profiles")
    .select(
      "id, full_name, student_code, class_name, role"
    )
    .eq("role", "student")
    .order("class_name")
    .order("full_name");

  document.getElementById("loading").style.display = "none";

  if (error) {
    showError(
      "Không tải được danh sách: " +
      error.message
    );
    return;
  }

  allStudents = data || [];

  buildClassFilter();
  renderStudents();

}


/* =====================================================
   HIỂN THỊ
===================================================== */

function renderStudents() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const classValue =
    document.getElementById("classFilter").value;

  const filtered = allStudents.filter(student => {

    const name =
      (student.full_name || "").toLowerCase();

    const code =
      (student.student_code || "").toLowerCase();

    const matchSearch =
      !search ||
      name.includes(search) ||
      code.includes(search);

    const matchClass =
      !classValue ||
      student.class_name === classValue;

    return matchSearch && matchClass;

  });


  const tbody =
    document.getElementById("studentList");

  tbody.innerHTML = "";


  filtered.forEach((student, index) => {

    const tr = document.createElement("tr");

    tr.innerHTML = `

      <td>${index + 1}</td>

      <td>
        ${escapeHTML(student.full_name || "")}
      </td>

      <td>
        ${escapeHTML(student.student_code || "")}
      </td>

      <td>
        ${escapeHTML(student.class_name || "")}
      </td>

      <td>
        <span class="badge">
          Học sinh
        </span>
      </td>

      <td>

        <div class="action-group">

          <button
            class="btn-edit"
            onclick="openEditModal('${student.id}')">
            ✏️ Sửa
          </button>

          <button
            class="btn-password"
            onclick="changePassword('${student.id}')">
            🔑 Mật khẩu
          </button>

          <button
            class="btn-delete"
            onclick="deleteStudent('${student.id}')">
            🗑️ Xóa
          </button>

        </div>

      </td>

    `;

    tbody.appendChild(tr);

  });


  document.getElementById("studentCount").textContent =
    `Tổng số học sinh: ${allStudents.length}`;


  document.getElementById("studentTable").style.display =
    filtered.length ? "table" : "none";

}


/* =====================================================
   LỌC LỚP
===================================================== */

function buildClassFilter() {

  const select =
    document.getElementById("classFilter");

  const oldValue = select.value;

  const classes =
    [...new Set(
      allStudents
        .map(x => x.class_name)
        .filter(Boolean)
    )].sort();

  select.innerHTML =
    `<option value="">Tất cả lớp</option>`;

  classes.forEach(className => {

    const option =
      document.createElement("option");

    option.value = className;
    option.textContent = className;

    select.appendChild(option);

  });

  select.value = oldValue;

}


document
  .getElementById("searchInput")
  .addEventListener("input", renderStudents);


document
  .getElementById("classFilter")
  .addEventListener("change", renderStudents);


/* =====================================================
   THÊM HỌC SINH
===================================================== */

function openAddModal() {

  document.getElementById("addMessage").textContent = "";

  document.getElementById("addModal").style.display =
    "flex";

}


function closeAddModal() {

  document.getElementById("addModal").style.display =
    "none";

}


async function createStudent() {

  const full_name =
    document.getElementById("addFullName").value.trim();

  const student_code =
    document.getElementById("addStudentCode").value.trim();

  const class_name =
    document.getElementById("addClassName").value.trim();

  const email =
    document.getElementById("addEmail").value.trim();

  const password =
    document.getElementById("addPassword").value;

  const message =
    document.getElementById("addMessage");


  if (
    !full_name ||
    !student_code ||
    !class_name ||
    !email ||
    !password
  ) {
    message.textContent =
      "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }


  if (password.length < 6) {
    message.textContent =
      "⚠️ Mật khẩu phải có ít nhất 6 ký tự.";
    return;
  }


  message.textContent =
    "Đang tạo tài khoản...";


  try {

    const result = await callFunction(
      "create-student",
      {
        full_name,
        student_code,
        class_name,
        email,
        password
      }
    );


    if (!result.ok) {
      throw new Error(
        result.data?.error ||
        result.data?.message ||
        "Không tạo được học sinh."
      );
    }


    message.textContent =
      "✅ Tạo học sinh thành công.";


    await loadStudents();


    setTimeout(() => {

      closeAddModal();

      clearAddForm();

    }, 700);


  } catch (error) {

    console.error(error);

    message.textContent =
      "❌ " + error.message;

  }

}


function clearAddForm() {

  document.getElementById("addFullName").value = "";
  document.getElementById("addStudentCode").value = "";
  document.getElementById("addClassName").value = "";
  document.getElementById("addEmail").value = "";
  document.getElementById("addPassword").value = "";

}


/* =====================================================
   SỬA HỌC SINH
===================================================== */

function openEditModal(id) {

  const student =
    allStudents.find(x => x.id === id);

  if (!student) {
    alert("Không tìm thấy học sinh.");
    return;
  }


  document.getElementById("editId").value =
    student.id;

  document.getElementById("editFullName").value =
    student.full_name || "";

  document.getElementById("editStudentCode").value =
    student.student_code || "";

  document.getElementById("editClassName").value =
    student.class_name || "";

  document.getElementById("editMessage").textContent =
    "";

  document.getElementById("editModal").style.display =
    "flex";

}


function closeEditModal() {

  document.getElementById("editModal").style.display =
    "none";

}


async function saveEditStudent() {

  const id =
    document.getElementById("editId").value;

  const full_name =
    document.getElementById("editFullName")
      .value.trim();

  const student_code =
    document.getElementById("editStudentCode")
      .value.trim();

  const class_name =
    document.getElementById("editClassName")
      .value.trim();

  const message =
    document.getElementById("editMessage");


  if (!id) {
    message.textContent =
      "❌ Thiếu ID học sinh.";
    return;
  }


  if (
    !full_name ||
    !student_code ||
    !class_name
  ) {
    message.textContent =
      "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }


  message.textContent =
    "Đang lưu thay đổi...";


  try {

    /*
       Gửi cả id và studentId để tương thích
       với Edge Function hiện tại.
    */

    const result = await callFunction(
      "manage-student",
      {
        action: "update",
        id: id,
        studentId: id,
        student_id: id,

        full_name: full_name,
        student_code: student_code,
        class_name: class_name
      }
    );


    if (!result.ok) {

      throw new Error(
        result.data?.error ||
        result.data?.message ||
        "Không cập nhật được học sinh."
      );

    }


    message.textContent =
      "✅ Đã cập nhật học sinh.";


    await loadStudents();


    setTimeout(() => {
      closeEditModal();
    }, 600);


  } catch (error) {

    console.error(error);

    message.textContent =
      "❌ " + error.message;

  }

}


/* =====================================================
   ĐỔI MẬT KHẨU
===================================================== */

async function changePassword(id) {

  const password =
    prompt(
      "Nhập mật khẩu mới cho học sinh:\n" +
      "(Tối thiểu 6 ký tự)"
    );


  if (password === null)
    return;


  if (password.length < 6) {

    alert(
      "Mật khẩu phải có ít nhất 6 ký tự."
    );

    return;

  }


  try {

    const result = await callFunction(
      "manage-student",
      {
        action: "password",

        id: id,
        studentId: id,
        student_id: id,

        password: password
      }
    );


    if (!result.ok) {

      throw new Error(
        result.data?.error ||
        result.data?.message ||
        "Không đổi được mật khẩu."
      );

    }


    alert("✅ Đổi mật khẩu thành công.");


  } catch (error) {

    console.error(error);

    alert(
      "❌ Không đổi được mật khẩu: " +
      error.message
    );

  }

}


/* =====================================================
   XÓA HỌC SINH
===================================================== */

async function deleteStudent(id) {

  const student =
    allStudents.find(x => x.id === id);


  if (!student)
    return;


  const ok = confirm(
    `Bạn có chắc muốn xóa học sinh:\n\n` +
    `${student.full_name}\n` +
    `${student.student_code}\n\n` +
    `Thao tác này không thể hoàn tác.`
  );


  if (!ok)
    return;


  try {

    const result = await callFunction(
      "manage-student",
      {
        action: "delete",

        id: id,
        studentId: id,
        student_id: id
      }
    );


    if (!result.ok) {

      throw new Error(
        result.data?.error ||
        result.data?.message ||
        "Không xóa được học sinh."
      );

    }


    alert("✅ Đã xóa học sinh.");

    await loadStudents();


  } catch (error) {

    console.error(error);

    alert(
      "❌ Không xóa được học sinh: " +
      error.message
    );

  }

}


/* =====================================================
   GỌI EDGE FUNCTION
===================================================== */

async function callFunction(functionName, body) {

  const client =
    window.supabaseClient;


  const {
    data: { session }
  } = await client.auth.getSession();


  if (!session) {

    location.href = "login.html";

    throw new Error(
      "Phiên đăng nhập đã hết hạn."
    );

  }


  const response = await fetch(
    `${FUNCTION_BASE}/${functionName}`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization":
          `Bearer ${session.access_token}`
      },

      body: JSON.stringify(body)
    }
  );


  let data = {};

  try {
    data = await response.json();
  }
  catch {
    data = {};
  }


  return {
    ok: response.ok,
    status: response.status,
    data
  };

}


/* =====================================================
   TIỆN ÍCH
===================================================== */

function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showError(message) {

  document.getElementById("loading").style.display =
    "none";

  const el =
    document.getElementById("error");

  el.textContent = message;
  el.style.display = "block";

}


function goTeacher() {
  location.href = "teacher.html";
}


function goHome() {
  location.href = "index.html";
}


async function logout() {

  await window.supabaseClient.auth.signOut();

  location.href = "login.html";

}


/* Đóng modal khi bấm ra ngoài */

window.addEventListener("click", event => {

  if (event.target.id === "addModal")
    closeAddModal();

  if (event.target.id === "editModal")
    closeEditModal();

});

</script>

</body>
</html>
