<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài kiểm tra V3.7.18 | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50 text-slate-900"><main class="max-w-5xl mx-auto p-6"><div class="flex flex-col md:flex-row md:justify-between gap-4 mb-5"><div><h1 class="text-3xl font-bold">📝 Bài kiểm tra của em <span class="text-base text-blue-600">V3.7.18</span></h1><p id="who" class="text-slate-500 mt-1">Đang tải...</p></div><a href="student-dashboard.html" class="border px-4 py-2 rounded-xl h-fit bg-white">← Trang học sinh</a></div><div id="status" class="hidden mb-4 p-4 rounded-xl"></div><div id="list" class="grid md:grid-cols-2 gap-4"></div></main><script>
const s=window.supabaseClient,$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(t,bad=false){let e=$("status");e.className="mb-4 p-4 rounded-xl "+(bad?"bg-red-50 text-red-700":"bg-blue-50 text-blue-700");e.textContent=t}
async function init(){try{let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";let org=await s.rpc("codehub_v3715_my_org");if(!org.error&&org.data?.[0]){let o=org.data[0];$("who").textContent=`${o.full_name||""} • ${o.student_code||""} • ${o.school_name||"—"} • ${o.class_name||"—"}${o.school_year?` • ${o.school_year}`:""}`};let r=await s.rpc("codehub_v3718_student_quiz_list");if(r.error)throw r.error;let rows=Array.isArray(r.data)?r.data:[];if(!rows.length){$("list").innerHTML='<div class="md:col-span-2 bg-white rounded-2xl shadow p-8 text-center text-slate-500">Chưa có bài kiểm tra nào được giao cho lớp của em.</div>';return}let now=Date.now();$("list").innerHTML=rows.map(x=>{let used=Number(x.attempts_used||0),max=Number(x.max_attempts||1);let open=!x.open_at||new Date(x.open_at).getTime()<=now;let closed=!!x.close_at&&new Date(x.close_at).getTime()<now;let can=open&&!closed&&used<max;let result=x.latest_submitted_at?`<div class="mt-3 rounded-xl bg-emerald-50 p-3 text-emerald-800"><b>✅ Đã nộp</b>${x.latest_score!==null?` • Điểm ${esc(x.latest_score)}/10`:""}</div>`:"";let actions=[];if(can)actions.push(`<a class="inline-block bg-blue-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-v4.html?assignment=${encodeURIComponent(x.assignment_id)}">${used?"Làm lại":"Bắt đầu làm bài"}</a>`);if(x.latest_submitted_at&&x.show_result)actions.push(`<a class="inline-block bg-violet-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-result-v4-2.html?assignment=${encodeURIComponent(x.assignment_id)}">Xem kết quả</a>`);let state=!open?"Chưa đến giờ mở":closed?"Đã hết hạn":used>=max?"Đã hết lượt làm":"";return `<section class="bg-white rounded-2xl shadow p-5"><h2 class="font-bold text-xl">${esc(x.title||"Quiz")}</h2>${x.description?`<div class="text-slate-600 mt-2">${esc(x.description)}</div>`:""}<div class="text-sm text-slate-500 mt-2">${Number(x.time_limit||15)} phút • tối đa ${max} lần • đã dùng ${used}</div>${result}<div class="mt-4 flex gap-2 flex-wrap">${actions.join("")||`<span class="text-slate-500">${esc(state)}</span>`}</div></section>`}).join("")}catch(e){console.error(e);msg("Không tải được bài kiểm tra: "+(e?.message||String(e)),true)}}init();
</script></body></html>
