<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài kiểm tra V3.7.0</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-5xl mx-auto p-6"><div class="flex justify-between mb-5"><div><h1 class="text-3xl font-bold">📝 Bài kiểm tra của em</h1><p id="who" class="text-slate-500"></p></div><a href="student-dashboard.html" class="border p-2 rounded-xl">← Trang chủ</a></div><div id="list" class="grid md:grid-cols-2 gap-4"></div></main>
<script>
const s=window.supabaseClient;
async function init(){
 let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";
 let p=await s.from("profiles").select("full_name,class_name,class_id,school_id,role,schools(school_name)").eq("id",u.id).single();
 if(p.data?.role!=="student")return location.href="teacher.html";
 who.textContent=`${p.data.full_name||""} • ${p.data.schools?.school_name||"—"} • ${p.data.class_name||""}`;
 if(!p.data.class_id)return list.innerHTML='<div class="bg-orange-50 text-orange-700 p-4 rounded-xl">Hồ sơ chưa có class_id. Giáo viên/Admin cần gán lại Trường • Lớp ở Quản lý học sinh V3.7.0.</div>';
 let a=await s.from("quiz_assignments").select("*,quizzes(title)").eq("class_id",p.data.class_id).order("created_at",{ascending:false});
 let at=await s.from("quiz_attempts").select("assignment_id,score,correct_count,total_questions,submitted_at").eq("student_id",u.id);
 let mp={};(at.data||[]).forEach(x=>(mp[x.assignment_id]??=[]).push(x));for(const k in mp)mp[k].sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));
 let now=Date.now();list.innerHTML=(a.data||[]).map(x=>{let arr=mp[x.id]||[],n=arr.length,latest=arr[0],open=!x.open_at||new Date(x.open_at).getTime()<=now,closed=x.close_at&&new Date(x.close_at).getTime()<now,can=open&&!closed&&n<x.max_attempts;let result=latest?`<div class="mt-3 rounded-xl bg-emerald-50 p-3 text-emerald-800"><b>✅ Đã nộp</b> • Điểm ${latest.score}/10</div>`:"";let actions=[];if(can)actions.push(`<a class="inline-block bg-blue-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-v4.html?assignment=${x.id}">Bắt đầu làm bài</a>`);if(latest&&x.show_result)actions.push(`<a class="inline-block bg-violet-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-result-v4-2.html?assignment=${x.id}">Xem kết quả</a>`);return `<section class="bg-white rounded-2xl shadow p-5"><h2 class="font-bold text-xl">${x.quizzes?.title||"Quiz"}</h2><div class="text-sm text-slate-500 mt-2">${x.time_limit} phút • tối đa ${x.max_attempts} lần • đã dùng ${n}</div>${result}<div class="mt-4 flex gap-2 flex-wrap">${actions.join("")||'<span class="text-slate-500">Hiện chưa thể làm bài.</span>'}</div></section>`}).join("")||'<div class="text-slate-500">Chưa có bài kiểm tra.</div>';
}
init();
</script></body></html>
