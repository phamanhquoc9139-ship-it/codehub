<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài kiểm tra V3.7.13 | CodeHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-5xl mx-auto p-6">
  <div class="flex flex-col md:flex-row md:justify-between gap-4 mb-5">
    <div>
      <h1 class="text-3xl font-bold">📝 Bài kiểm tra của em <span class="text-base text-blue-600">V3.7.13</span></h1>
      <p id="who" class="text-slate-500 mt-1">Đang tải...</p>
    </div>
    <a href="student-dashboard.html" class="border px-4 py-2 rounded-xl h-fit bg-white">← Trang học sinh</a>
  </div>

  <div id="status" class="hidden mb-4 p-4 rounded-xl"></div>
  <div id="list" class="grid md:grid-cols-2 gap-4"></div>
</main>

<script>
const s=window.supabaseClient;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function message(text,type="info"){
  const el=$("status");
  el.className="mb-4 p-4 rounded-xl "+(
    type==="error"?"bg-red-50 text-red-700":
    type==="warn"?"bg-amber-50 text-amber-800":
    "bg-blue-50 text-blue-700"
  );
  el.textContent=text;
}

async function init(){
  try{
    if(!s) throw new Error("Không kết nối được Supabase.");

    const auth=await s.auth.getUser();
    const u=auth.data?.user;
    if(!u) return location.href="login.html";

    // Không join schools ở profiles nữa: tránh lỗi relation làm bị đẩy sang teacher.html.
    const pr=await s.from("profiles")
      .select("id,full_name,student_code,class_name,class_id,role")
      .eq("id",u.id)
      .single();

    if(pr.error) throw new Error("Không đọc được hồ sơ học sinh: "+pr.error.message);
    if(pr.data?.role!=="student"){
      message("Tài khoản hiện tại không phải tài khoản học sinh.","error");
      return;
    }

    const p=pr.data;
    if(!p.class_id){
      $("who").textContent=`${p.full_name||""} • ${p.class_name||"—"}`;
      message("Hồ sơ chưa có class_id. Giáo viên/Admin cần gán lại Trường • Lớp trong Quản lý học sinh.","warn");
      return;
    }

    let schoolName="—", className=p.class_name||"—", schoolYear="";
    const cr=await s.from("classes")
      .select("id,class_name,school_id,school_year")
      .eq("id",p.class_id)
      .maybeSingle();

    if(cr.error) throw new Error("Không đọc được lớp học: "+cr.error.message);
    if(cr.data){
      className=cr.data.class_name||className;
      schoolYear=cr.data.school_year||"";
      if(cr.data.school_id){
        const sr=await s.from("schools")
          .select("school_name")
          .eq("id",cr.data.school_id)
          .maybeSingle();
        if(!sr.error && sr.data?.school_name) schoolName=sr.data.school_name;
      }
    }

    $("who").textContent=
      `${p.full_name||""} • ${p.student_code||""} • ${schoolName} • ${className}`+
      (schoolYear?` • ${schoolYear}`:"");

    // QUAN TRỌNG: chỉ đúng class_id của học sinh.
    const ar=await s.from("quiz_assignments")
      .select("id,quiz_id,class_id,open_at,close_at,time_limit,max_attempts,show_result,created_at")
      .eq("class_id",p.class_id)
      .order("created_at",{ascending:false});

    if(ar.error) throw new Error("Không tải được bài kiểm tra: "+ar.error.message);

    const assignments=ar.data||[];
    if(!assignments.length){
      $("list").innerHTML='<div class="md:col-span-2 bg-white rounded-2xl shadow p-8 text-center text-slate-500">Chưa có bài kiểm tra nào được giao cho lớp của em.</div>';
      return;
    }

    const quizIds=[...new Set(assignments.map(x=>x.quiz_id).filter(Boolean))];
    let quizMap={};
    if(quizIds.length){
      const qr=await s.from("quizzes")
        .select("id,title,description,is_published")
        .in("id",quizIds);
      if(qr.error) throw new Error("Không đọc được thông tin Quiz: "+qr.error.message);
      (qr.data||[]).forEach(q=>quizMap[q.id]=q);
    }

    const at=await s.from("quiz_attempts")
      .select("assignment_id,score,correct_count,total_questions,submitted_at")
      .eq("student_id",u.id);

    if(at.error) throw new Error("Không đọc được lịch sử làm bài: "+at.error.message);

    const mp={};
    (at.data||[]).forEach(x=>(mp[x.assignment_id]??=[]).push(x));
    for(const k in mp) mp[k].sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));

    const now=Date.now();

    $("list").innerHTML=assignments.map(x=>{
      const q=quizMap[x.quiz_id]||{};
      const arr=mp[x.id]||[];
      const used=arr.length;
      const latest=arr[0];
      const maxAttempts=Number(x.max_attempts||1);
      const isOpen=!x.open_at || new Date(x.open_at).getTime()<=now;
      const isClosed=!!x.close_at && new Date(x.close_at).getTime()<now;
      const canDo=isOpen && !isClosed && used<maxAttempts;

      const result=latest
        ? `<div class="mt-3 rounded-xl bg-emerald-50 p-3 text-emerald-800"><b>✅ Đã nộp</b> • Điểm ${esc(latest.score)}/10</div>`
        : "";

      const actions=[];
      if(canDo){
        actions.push(`<a class="inline-block bg-blue-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-v4.html?assignment=${encodeURIComponent(x.id)}">${used?"Làm lại":"Bắt đầu làm bài"}</a>`);
      }
      if(latest && x.show_result){
        actions.push(`<a class="inline-block bg-violet-600 text-white px-4 py-2 rounded-xl font-bold" href="student-quiz-result-v4-2.html?assignment=${encodeURIComponent(x.id)}">Xem kết quả</a>`);
      }

      let state="";
      if(!isOpen) state="Chưa đến giờ mở";
      else if(isClosed) state="Đã hết hạn";
      else if(used>=maxAttempts) state="Đã hết lượt làm";

      return `<section class="bg-white rounded-2xl shadow p-5">
        <h2 class="font-bold text-xl">${esc(q.title||"Quiz")}</h2>
        ${q.description?`<div class="text-slate-600 mt-2">${esc(q.description)}</div>`:""}
        <div class="text-sm text-slate-500 mt-2">
          ${Number(x.time_limit||15)} phút • tối đa ${maxAttempts} lần • đã dùng ${used}
        </div>
        ${result}
        <div class="mt-4 flex gap-2 flex-wrap">
          ${actions.join("") || `<span class="text-slate-500">${esc(state||"Hiện chưa thể làm bài.")}</span>`}
        </div>
      </section>`;
    }).join("");

  }catch(e){
    console.error("CodeHub V3.7.13 student quizzes:",e);
    message(e?.message||String(e),"error");
    $("list").innerHTML="";
  }
}
init();
</script>
</body>
</html>
