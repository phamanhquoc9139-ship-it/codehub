<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đặt lại mật khẩu - CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-7">
  <div class="text-center mb-6">
    <div class="text-5xl mb-2">🔑</div>
    <h1 class="text-2xl font-bold">Đặt lại mật khẩu</h1>
    <p class="text-slate-500 mt-1">Dành cho Giáo viên/Admin nhận link khôi phục qua email.</p>
  </div>
  <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm"></div>
  <form id="f" class="space-y-4">
    <div>
      <label class="font-bold text-sm">Mật khẩu mới</label>
      <input id="p1" type="password" minlength="6" required class="mt-1 w-full border rounded-xl p-3" placeholder="Tối thiểu 6 ký tự">
    </div>
    <div>
      <label class="font-bold text-sm">Nhập lại mật khẩu</label>
      <input id="p2" type="password" minlength="6" required class="mt-1 w-full border rounded-xl p-3" placeholder="Nhập lại mật khẩu">
    </div>
    <button id="btn" class="w-full bg-blue-600 text-white font-bold p-3 rounded-xl">Lưu mật khẩu mới</button>
  </form>
  <a href="login.html" class="block text-center mt-5 text-blue-600 font-bold">← Về đăng nhập</a>
</div>
<script>
const s=window.supabaseClient,$=id=>document.getElementById(id);
function show(t,ok=false){$('msg').className='mb-4 p-3 rounded-xl text-sm '+(ok?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700');$('msg').textContent=t}
$('f').onsubmit=async e=>{
  e.preventDefault();
  const a=$('p1').value,b=$('p2').value;
  if(a.length<6)return show('Mật khẩu phải có ít nhất 6 ký tự.');
  if(a!==b)return show('Hai mật khẩu chưa khớp.');
  $('btn').disabled=true;$('btn').textContent='Đang lưu...';
  try{
    const {data:{session}}=await s.auth.getSession();
    if(!session) throw new Error('Link khôi phục không hợp lệ hoặc đã hết hạn. Hãy yêu cầu lại từ trang đăng nhập.');
    const {error}=await s.auth.updateUser({password:a});
    if(error)throw error;
    show('Đổi mật khẩu thành công. Đang chuyển về đăng nhập...','success');
    setTimeout(async()=>{await s.auth.signOut();location.href='login.html'},1400);
  }catch(err){show(err?.message||'Không đổi được mật khẩu.')}
  finally{$('btn').disabled=false;$('btn').textContent='Lưu mật khẩu mới'}
};
</script>
</body>
</html>
