<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz - CodeHub</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
</head>

<body class="bg-slate-50">

<main class="max-w-6xl mx-auto p-6">

<div class="flex justify-between items-center mb-6">

    <div>
        <h1 class="text-3xl font-bold">
            📝 Quản lý Quiz
        </h1>

        <p class="text-slate-500">
            Tạo đề • AI • giao lớp • kết quả
        </p>

        <p id="roleInfo"
           class="text-sm text-blue-600 mt-1">
        </p>
    </div>

    <a href="teacher.html"
       class="px-4 py-2 border rounded-xl">
        ← Dashboard
    </a>

</div>


<div class="grid md:grid-cols-3 gap-5">


<!-- =========================
     TẠO QUIZ
========================= -->

<section class="bg-white rounded-2xl shadow p-5">

<h2 class="font-bold text-xl mb-4">
    Tạo Quiz
</h2>

<form id="f" class="space-y-3">

<select
    id="course"
    class="w-full border p-3 rounded-xl"
    required>
</select>


<input
    id="title"
    class="w-full border p-3 rounded-xl"
    placeholder="Tên bài kiểm tra"
    required>


<textarea
    id="desc"
    class="w-full border p-3 rounded-xl"
    placeholder="Mô tả">
</textarea>


<input
    id="time"
    type="number"
    min="1"
    value="15"
    class="w-full border p-3 rounded-xl"
    placeholder="Thời gian (phút)">


<label class="flex gap-2">

<input
    id="pub"
    type="checkbox">

Xuất bản

</label>


<button
    class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">

    Lưu Quiz

</button>

</form>

</section>



<!-- =========================
     DANH SÁCH QUIZ
========================= -->

<section class="md:col-span-2 bg-white rounded-2xl shadow p-5">

<div class="flex justify-between items-center mb-4">

<h2 class="font-bold text-xl">
    Danh sách Quiz
</h2>


<a
    href="ai-quiz-generator.html"
    class="px-3 py-2 bg-violet-600 text-white rounded-lg font-bold">

    ✨ AI tạo câu hỏi

</a>

</div>


<div
    id="list"
    class="space-y-3">

    <p class="text-slate-500">
        Đang tải...
    </p>

</div>

</section>

</div>

</main>



<script>

/* ===============================
   SUPABASE
================================ */

const s = window.supabaseClient;

let me = null;

let myRole = null;


/* ===============================
   KHỞI ĐỘNG
================================ */

async function init() {

    if (!s) {

        alert("Không kết nối được Supabase.");

        return;
    }


    /* ---------------------------
       USER
    --------------------------- */

    const {
        data: userData,
        error: userError
    } = await s.auth.getUser();


    me = userData?.user;


    if (userError || !me) {

        location.href = "login.html";

        return;
    }


    /* ---------------------------
       PROFILE
    --------------------------- */

    const {
        data: profile,
        error: profileError
    } = await s
        .from("profiles")
        .select("full_name, role")
        .eq("id", me.id)
        .single();


    if (profileError || !profile) {

        alert("Không đọc được thông tin tài khoản.");

        location.href = "index.html";

        return;
    }


    myRole = String(
        profile.role || ""
    )
    .trim()
    .toLowerCase();


    /* ===============================
       PHÂN QUYỀN
    =============================== */

    if (
        !["admin", "teacher"].includes(myRole)
    ) {

        location.href =
            "student-dashboard.html";

        return;
    }


    /* ---------------------------
       HIỂN THỊ ROLE
    --------------------------- */

    const roleInfo =
        document.getElementById(
            "roleInfo"
        );


    if (myRole === "admin") {

        roleInfo.textContent =
            "Quyền truy cập: Quản trị viên";

    } else {

        roleInfo.textContent =
            "Quyền truy cập: Giáo viên";

    }


    /* ---------------------------
       LOAD
    --------------------------- */

    await loadCourses();

    await loadQuizzes();
}



/* ===============================
   LOAD KHÓA HỌC
================================ */

async function loadCourses() {

    let query = s
        .from("courses")
        .select(
            "id,title,teacher_id"
        )
        .order("title");


    /*
       TEACHER:
       chỉ thấy khóa học của mình

       ADMIN:
       thấy toàn bộ
    */

    if (myRole === "teacher") {

        query = query.eq(
            "teacher_id",
            me.id
        );
    }


    const {
        data,
        error
    } = await query;


    if (error) {

        console.error(error);

        alert(
            "Không tải được khóa học: " +
            error.message
        );

        return;
    }


    const course =
        document.getElementById(
            "course"
        );


    course.innerHTML =
        '<option value="">' +
        '-- Chọn khóa học --' +
        '</option>' +

        (data || [])
        .map(x =>

            `<option value="${x.id}">
                ${escapeHtml(x.title)}
            </option>`

        )
        .join("");
}



/* ===============================
   LOAD QUIZ
================================ */

async function loadQuizzes() {

    const list =
        document.getElementById(
            "list"
        );


    list.innerHTML =
        '<p class="text-slate-500">Đang tải...</p>';


    let query = s
        .from("quizzes")
        .select(
            "*,courses(title)"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    /*
       TEACHER:
       chỉ thấy Quiz của mình

       ADMIN:
       thấy tất cả Quiz
    */

    if (myRole === "teacher") {

        query = query.eq(
            "teacher_id",
            me.id
        );
    }


    const {
        data,
        error
    } = await query;


    if (error) {

        console.error(error);

        list.innerHTML =

            `<div class="p-4 bg-red-50 text-red-700 rounded-xl">
                Không tải được Quiz:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            '<p>Chưa có Quiz.</p>';

        return;
    }


    list.innerHTML =
        data.map(q => {


            /*
               ADMIN:
               có thể xem mọi Quiz

               DELETE:
               Admin được phép thao tác;
               RLS Supabase vẫn là lớp
               bảo vệ cuối cùng.
            */


            return `

<div class="border rounded-xl p-4">

<div class="flex justify-between gap-3 flex-wrap">


<div>

<b class="text-lg">
${escapeHtml(q.title)}
</b>


<div class="text-sm text-slate-500 mt-1">

${escapeHtml(
    q.courses?.title || ""
)}

•

${Number(q.time_limit || 0)} phút

•

${q.is_published
    ? "Đã xuất bản"
    : "Bản nháp"
}

</div>


${
myRole === "admin"
?
`<div class="text-xs text-slate-400 mt-1">
Chủ sở hữu:
${escapeHtml(q.teacher_id || "")}
</div>`
:
""
}

</div>



<div class="flex flex-wrap gap-2">


<a
class="px-3 py-2 bg-emerald-600 text-white rounded-lg"
href="quiz-questions.html?quiz=${encodeURIComponent(q.id)}">

Câu hỏi

</a>


<a
class="px-3 py-2 bg-blue-600 text-white rounded-lg"
href="quiz-assign.html?quiz=${encodeURIComponent(q.id)}">

📤 Giao lớp

</a>


<a
class="px-3 py-2 bg-violet-600 text-white rounded-lg"
href="quiz-results.html?quiz=${encodeURIComponent(q.id)}">

📊 Kết quả

</a>


<button
onclick="deleteQuiz('${q.id}')"
class="px-3 py-2 bg-red-50 text-red-600 rounded-lg">

Xóa

</button>


</div>

</div>

</div>

`;

        }).join("");
}



/* ===============================
   TẠO QUIZ
================================ */

document
.getElementById("f")
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        if (!me) {

            alert(
                "Phiên đăng nhập không hợp lệ."
            );

            return;
        }


        const courseId =
            document
            .getElementById("course")
            .value;


        const quizTitle =
            document
            .getElementById("title")
            .value
            .trim();


        const description =
            document
            .getElementById("desc")
            .value
            .trim();


        const timeLimit =
            Number(
                document
                .getElementById("time")
                .value
            ) || 15;


        const published =
            document
            .getElementById("pub")
            .checked;


        if (!courseId) {

            alert(
                "Vui lòng chọn khóa học."
            );

            return;
        }


        if (!quizTitle) {

            alert(
                "Vui lòng nhập tên Quiz."
            );

            return;
        }


        const {
            error
        } = await s
            .from("quizzes")
            .insert({

                course_id:
                    courseId,

                title:
                    quizTitle,

                description:
                    description,

                time_limit:
                    timeLimit,

                is_published:
                    published,

                teacher_id:
                    me.id

            });


        if (error) {

            alert(
                "Không lưu được Quiz:\n" +
                error.message
            );

            return;
        }


        alert(
            "✅ Tạo Quiz thành công."
        );


        document
        .getElementById("f")
        .reset();


        document
        .getElementById("time")
        .value = 15;


        await loadQuizzes();
    }
);



/* ===============================
   XÓA QUIZ
================================ */

async function deleteQuiz(id) {

    const ok =
        confirm(
            "Xóa Quiz và toàn bộ câu hỏi/kết quả?"
        );


    if (!ok) {

        return;
    }


    let query = s
        .from("quizzes")
        .delete()
        .eq("id", id);


    /*
       Giáo viên chỉ được xóa Quiz
       do chính mình tạo.
    */

    if (myRole === "teacher") {

        query = query.eq(
            "teacher_id",
            me.id
        );
    }


    const {
        error
    } = await query;


    if (error) {

        alert(
            "Không xóa được Quiz:\n" +
            error.message
        );

        return;
    }


    await loadQuizzes();
}



/* ===============================
   CHỐNG HTML INJECTION
================================ */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ===============================
   START
================================ */

init();

</script>

</body>
</html>
