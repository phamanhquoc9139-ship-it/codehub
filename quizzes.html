<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz V2.6 - CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><link rel="stylesheet" href="styles/codehub-v26.css"><script src="scripts/codehub-v26-ui.js"></script></head>
<body class="ch-shell bg-slate-50"><script>document.addEventListener('DOMContentLoaded',()=>CodeHubUI.mountHeader({active:'quizzes',breadcrumbs:[{label:'Dashboard',href:'teacher.html'},{label:'Quản lý Quiz'}]}))</script>
<main class="max-w-6xl mx-auto p-6"><div class="flex justify-between items-center mb-6 gap-3 flex-wrap"><div><div class="ch-page-title"><h1 class="text-3xl font-bold">📝 Quản lý Quiz</h1><span class="ch-version">V2.6 UX</span></div><p id="who" class="text-slate-500">Multi-teacher • Môn + Lớp • RLS V2.5</p></div></div>
<div class="grid md:grid-cols-3 gap-5"><section class="bg-white rounded-2xl shadow p-5"><h2 class="font-bold text-xl mb-4">Tạo Quiz</h2><form id="f" class="space-y-3"><select id="course" class="w-full border p-3 rounded-xl" required></select><input id="title" class="w-full border p-3 rounded-xl" placeholder="Tên bài kiểm tra" required><textarea id="desc" class="w-full border p-3 rounded-xl" placeholder="Mô tả"></textarea><input id="time" type="number" min="1" value="15" class="w-full border p-3 rounded-xl"><label class="flex gap-2"><input id="pub" type="checkbox"> Xuất bản</label><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Lưu Quiz</button></form></section>
<section class="md:col-span-2 bg-white rounded-2xl shadow p-5"><div class="flex justify-between items-center mb-4 gap-2 flex-wrap"><h2 class="font-bold text-xl">Danh sách Quiz</h2><a href="ai-quiz-generator.html" class="px-3 py-2 bg-violet-600 text-white rounded-lg font-bold">✨ AI tạo câu hỏi</a></div><div id="list" class="space-y-3"></div></section></div></main>
<script>
const s=window.supabaseClient;let me,role;
async function init(){CodeHubUI.loading(true,'Đang tải Quiz...');try{me=(await s.auth.getUser()).data.user;if(!me)return location.href='login.html';let p=await s.from('profiles').select('role,full_name').eq('id',me.id).single();role=String(p.data?.role||'').trim().toLowerCase();if(!['teacher','admin'].includes(role))return CodeHubUI.forbidden('Tài khoản này không có quyền quản lý Quiz.');CodeHubUI.setRole(role);who.textContent=(role==='admin'?'Quản trị viên':'Giáo viên')+' • V2.6 Môn + Lớp';await loadCourses();await load()}finally{CodeHubUI.loading(false)}}
async function loadCourses(){let q=s.from('courses').select('id,title,teacher_id,subject').order('title');if(role==='teacher')q=q.eq('teacher_id',me.id);let r=await q;if(r.error){CodeHubUI.toast(r.error.message,'error');return}course.innerHTML='<option value="">-- Chọn khóa học --</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${x.title} • ${x.subject||''}</option>`).join('')}
async function load(){let q=s.from('quizzes').select('*,courses(title,subject)').order('created_at',{ascending:false});if(role==='teacher')q=q.eq('teacher_id',me.id);let r=await q;if(r.error){list.innerHTML='<div class="text-red-600">'+r.error.message+'</div>';return}list.innerHTML=(r.data||[]).map(q=>`<div class="border rounded-xl p-4 flex justify-between gap-3 flex-wrap"><div><b>${q.title}</b><div class="text-sm text-slate-500">${q.courses?.title||''} • ${q.courses?.subject||''} • ${q.time_limit||15} phút • ${q.is_published?'Đã xuất bản':'Bản nháp'}</div></div><div class="flex flex-wrap gap-2"><a class="px-3 py-2 bg-emerald-600 text-white rounded-lg" href="quiz-questions.html?quiz=${q.id}">Câu hỏi</a><a class="px-3 py-2 bg-blue-600 text-white rounded-lg" href="quiz-assign.html?quiz=${q.id}">📤 Giao lớp</a><a class="px-3 py-2 bg-violet-600 text-white rounded-lg" href="quiz-results.html?quiz=${q.id}">📊 Kết quả</a><button onclick="delq('${q.id}')" class="px-3 py-2 bg-red-50 text-red-600 rounded-lg">Xóa</button></div></div>`).join('')||'<p class="text-slate-500">Chưa có Quiz.</p>'}
f.onsubmit=async e=>{e.preventDefault();CodeHubUI.loading(true,'Đang lưu Quiz...');try{let r=await s.from('quizzes').insert({course_id:course.value,title:title.value.trim(),description:desc.value.trim(),time_limit:+time.value||15,is_published:pub.checked,teacher_id:me.id});if(r.error)return CodeHubUI.toast(r.error.message,'error');f.reset();time.value=15;CodeHubUI.toast('Đã tạo Quiz.','success');await load()}finally{CodeHubUI.loading(false)}};
async function delq(id){if(!confirm('Xóa Quiz và toàn bộ câu hỏi/kết quả?'))return;CodeHubUI.loading(true,'Đang xóa Quiz...');try{let q=s.from('quizzes').delete().eq('id',id);if(role==='teacher')q=q.eq('teacher_id',me.id);let r=await q;if(r.error)CodeHubUI.toast(r.error.message,'error');else{CodeHubUI.toast('Đã xóa Quiz.','success');await load()}}finally{CodeHubUI.loading(false)}}init();
</script></body></html>
