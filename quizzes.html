<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - CodeHub</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50"><main class="max-w-6xl mx-auto p-6">
<div class="flex justify-between items-center mb-6"><div><h1 class="text-3xl font-bold">📝 Quản lý Quiz</h1><p class="text-slate-500">Tạo bài trắc nghiệm cho khóa học</p></div><a href="teacher.html" class="px-4 py-2 border rounded-xl">← Dashboard</a></div>
<div class="grid md:grid-cols-3 gap-5">
<section class="bg-white rounded-2xl shadow p-5"><h2 class="font-bold text-xl mb-4">Tạo Quiz</h2>
<form id="f" class="space-y-3"><select id="course" class="w-full border p-3 rounded-xl" required></select><input id="title" class="w-full border p-3 rounded-xl" placeholder="Tên bài kiểm tra" required><textarea id="desc" class="w-full border p-3 rounded-xl" placeholder="Mô tả"></textarea><input id="time" type="number" min="1" value="15" class="w-full border p-3 rounded-xl" placeholder="Thời gian (phút)"><label class="flex gap-2"><input id="pub" type="checkbox"> Xuất bản</label><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Lưu Quiz</button></form></section>
<section class="md:col-span-2 bg-white rounded-2xl shadow p-5"><h2 class="font-bold text-xl mb-4">Danh sách Quiz</h2><div id="list" class="space-y-3"></div></section></div>
</main><script>
const s=window.supabaseClient; let me;
async function init(){let x=await s.auth.getUser();me=x.data.user;if(!me)return location.href='login.html';let p=await s.from('profiles').select('role').eq('id',me.id).single();if(p.data?.role!=='teacher')return location.href='student-dashboard.html';await courses();await load();}
async function courses(){let r=await s.from('courses').select('id,title').eq('teacher_id',me.id).order('title');course.innerHTML='<option value="">-- Chọn khóa học --</option>'+(r.data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join('');}
async function load(){let r=await s.from('quizzes').select('*,courses(title)').eq('teacher_id',me.id).order('created_at',{ascending:false});list.innerHTML=(r.data||[]).map(q=>`<div class="border rounded-xl p-4 flex justify-between gap-3"><div><b>${q.title}</b><div class="text-sm text-slate-500">${q.courses?.title||''} • ${q.time_limit} phút • ${q.is_published?'Đã xuất bản':'Bản nháp'}</div></div><div class="flex gap-2"><a class="px-3 py-2 bg-emerald-600 text-white rounded-lg" href="quiz-questions.html?quiz=${q.id}">Câu hỏi</a><a class="px-3 py-2 bg-violet-600 text-white rounded-lg" href="quiz-results-v4.html?quiz=${q.id}">Kết quả</a><button onclick="delq('${q.id}')" class="px-3 py-2 bg-red-50 text-red-600 rounded-lg">Xóa</button></div></div>`).join('')||'<p>Chưa có Quiz.</p>';}
f.onsubmit=async e=>{e.preventDefault();let r=await s.from('quizzes').insert({course_id:course.value,title:title.value.trim(),description:desc.value.trim(),time_limit:+time.value||15,is_published:pub.checked,teacher_id:me.id});if(r.error)return alert(r.error.message);f.reset();time.value=15;await load();};
async function delq(id){if(!confirm('Xóa Quiz và toàn bộ câu hỏi/kết quả?'))return;let r=await s.from('quizzes').delete().eq('id',id);if(r.error)alert(r.error.message);else load();} init();
</script></body></html>
