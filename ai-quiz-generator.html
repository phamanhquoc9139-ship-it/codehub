<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Quiz Generator - CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50"><main class="max-w-7xl mx-auto p-6">
<div class="flex justify-between gap-3 mb-6"><div><h1 class="text-3xl font-bold">✨ AI Quiz Generator</h1><p class="text-slate-500">Tạo câu hỏi chỉ từ nội dung bài học trên CodeHub</p></div><a href="quizzes.html" class="border px-4 py-2 rounded-xl h-fit">← Quiz</a></div>
<div id="msg" class="hidden p-3 rounded-xl mb-4"></div>
<div class="grid lg:grid-cols-4 gap-5"><aside class="bg-white shadow rounded-2xl p-5 space-y-3">
<label class="font-bold">Khóa học</label><select id="course" class="w-full border p-3 rounded-xl"></select>
<label class="font-bold">Bài học nguồn</label><select id="lesson" class="w-full border p-3 rounded-xl"></select>
<label class="font-bold">Quiz đích</label><select id="quiz" class="w-full border p-3 rounded-xl"></select>
<label class="font-bold">Số câu</label><select id="count" class="w-full border p-3 rounded-xl"><option>5</option><option>10</option><option>20</option></select>
<label class="font-bold">Mức độ</label><select id="level" class="w-full border p-3 rounded-xl"><option value="mixed">Kết hợp</option><option value="remember">Nhận biết</option><option value="understand">Thông hiểu</option><option value="apply">Vận dụng</option></select>
<button id="generate" class="w-full bg-violet-600 text-white font-bold p-3 rounded-xl">✨ Tạo bằng AI</button>
<p class="text-xs text-slate-500">AI tạo bản nháp. Giáo viên kiểm tra trước khi lưu.</p></aside>
<section class="lg:col-span-3"><div class="flex justify-between items-center mb-3"><h2 class="font-bold text-xl">Câu hỏi AI đề xuất</h2><button id="save" class="hidden bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold">Lưu câu đã chọn vào Quiz</button></div><div id="list" class="space-y-4"><div class="bg-white rounded-2xl p-8 text-center text-slate-400">Chọn bài học rồi bấm “Tạo bằng AI”.</div></div></section></div></main>
<script>
const s=window.supabaseClient;let me,generated=[];
function show(t,ok=false){msg.className='p-3 rounded-xl mb-4 '+(ok?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700');msg.textContent=t}
async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href='login.html';let p=await s.from('profiles').select('role').eq('id',me.id).single();if(p.data?.role!=='teacher')return location.href='student-dashboard.html';let c=await s.from('courses').select('id,title').eq('teacher_id',me.id).order('title');course.innerHTML='<option value="">-- Chọn --</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join('');}
course.onchange=async()=>{let id=course.value;let [l,q]=await Promise.all([s.from('lessons').select('id,title').eq('course_id',id).order('lesson_order'),s.from('quizzes').select('id,title').eq('course_id',id).eq('teacher_id',me.id).order('created_at')]);lesson.innerHTML='<option value="">-- Chọn bài học --</option>'+(l.data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join('');quiz.innerHTML='<option value="">-- Chọn Quiz --</option>'+(q.data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join('');};
generate.onclick=async()=>{if(!lesson.value)return show('Hãy chọn bài học nguồn.');generate.disabled=true;generate.textContent='AI đang tạo...';msg.className='hidden';let {data:{session}}=await s.auth.getSession();try{let r=await fetch('https://drfcejvmyhzorwepndta.supabase.co/functions/v1/generate-quiz-ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({lessonId:lesson.value,count:+count.value,level:level.value})});let x=await r.json();if(!r.ok)throw new Error(x.error||'Không tạo được câu hỏi');generated=x.questions||[];render();show(`AI đã tạo ${generated.length} câu từ bài học. Hãy kiểm tra trước khi lưu.`,true)}catch(e){show(e.message)}finally{generate.disabled=false;generate.textContent='✨ Tạo bằng AI'}};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){save.classList.toggle('hidden',!generated.length);list.innerHTML=generated.map((x,i)=>`<div class="bg-white rounded-2xl shadow p-5"><div class="flex gap-3"><input class="pick mt-1" type="checkbox" data-i="${i}" checked><div class="flex-1"><label class="text-xs text-slate-500">Câu ${i+1} • ${esc(x.level)}</label><textarea class="q w-full border rounded-lg p-2 font-bold mt-1" data-i="${i}">${esc(x.question_text)}</textarea>${['a','b','c','d'].map(k=>`<div class="flex gap-2 mt-2"><b class="w-6">${k.toUpperCase()}.</b><input class="op flex-1 border rounded-lg p-2" data-i="${i}" data-k="${k}" value="${esc(x['option_'+k])}"></div>`).join('')}<div class="grid md:grid-cols-2 gap-2 mt-3"><label>Đáp án <select class="ans border rounded p-2" data-i="${i}">${['A','B','C','D'].map(a=>`<option ${a===x.correct_answer?'selected':''}>${a}</option>`).join('')}</select></label><input class="exp border rounded p-2" data-i="${i}" value="${esc(x.explanation)}" placeholder="Giải thích"></div><div class="mt-2 text-xs bg-amber-50 p-2 rounded">Căn cứ nguồn: ${esc(x.source_evidence)}</div></div></div></div>`).join('')}
save.onclick=async()=>{if(!quiz.value)return show('Hãy chọn Quiz đích.');let picks=[...document.querySelectorAll('.pick:checked')];if(!picks.length)return show('Chưa chọn câu nào.');let existing=await s.from('quiz_questions').select('question_order').eq('quiz_id',quiz.value).order('question_order',{ascending:false}).limit(1);let start=(existing.data?.[0]?.question_order||0)+1;let rows=picks.map((p,n)=>{let i=+p.dataset.i;return{quiz_id:quiz.value,question_text:document.querySelector(`.q[data-i="${i}"]`).value,option_a:document.querySelector(`.op[data-i="${i}"][data-k="a"]`).value,option_b:document.querySelector(`.op[data-i="${i}"][data-k="b"]`).value,option_c:document.querySelector(`.op[data-i="${i}"][data-k="c"]`).value,option_d:document.querySelector(`.op[data-i="${i}"][data-k="d"]`).value,correct_answer:document.querySelector(`.ans[data-i="${i}"]`).value,explanation:document.querySelector(`.exp[data-i="${i}"]`).value,question_order:start+n}});let r=await s.from('quiz_questions').insert(rows);if(r.error)return show(r.error.message);show(`Đã lưu ${rows.length} câu vào Quiz.`,true);};
init();
</script></body></html>
