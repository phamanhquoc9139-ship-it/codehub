<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Câu hỏi Quiz V2.6</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><link rel="stylesheet" href="styles/codehub-v26.css"><script src="scripts/codehub-v26-ui.js"></script></head>
<body class="ch-shell bg-slate-50"><script>document.addEventListener('DOMContentLoaded',()=>CodeHubUI.mountHeader({active:'quizzes',breadcrumbs:[{label:'Quiz',href:'quizzes.html'},{label:'Câu hỏi'}]}))</script>
<main class="max-w-6xl mx-auto p-6"><div class="flex justify-between mb-5"><div><div class="ch-page-title"><h1 id="h" class="text-3xl font-bold">Câu hỏi</h1><span class="ch-version">V2.6</span></div><p class="text-slate-500">A/B/C/D • chỉ Quiz thuộc quyền quản lý</p></div></div>
<div class="grid md:grid-cols-5 gap-5"><form id="f" class="md:col-span-2 bg-white p-5 rounded-2xl shadow space-y-3"><textarea id="qt" class="w-full border p-3 rounded-xl" placeholder="Nội dung câu hỏi" required></textarea><input id="a" class="w-full border p-3 rounded-xl" placeholder="A" required><input id="b" class="w-full border p-3 rounded-xl" placeholder="B" required><input id="c" class="w-full border p-3 rounded-xl" placeholder="C" required><input id="d" class="w-full border p-3 rounded-xl" placeholder="D" required><select id="correct" class="w-full border p-3 rounded-xl"><option>A</option><option>B</option><option>C</option><option>D</option></select><textarea id="ex" class="w-full border p-3 rounded-xl" placeholder="Giải thích đáp án"></textarea><input id="ord" type="number" min="1" value="1" class="w-full border p-3 rounded-xl"><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Thêm câu hỏi</button></form><section id="list" class="md:col-span-3 space-y-3"></section></div></main>
<script>const s=window.supabaseClient,qid=new URLSearchParams(location.search).get('quiz');async function init(){CodeHubUI.loading(true,'Đang kiểm tra quyền...');try{if(!qid)return location.href='quizzes.html';const u=(await s.auth.getUser()).data.user;if(!u)return location.href='login.html';const pr=await s.from('profiles').select('role,full_name').eq('id',u.id).single();const role=(pr.data?.role||'').trim().toLowerCase();CodeHubUI.setIdentity(p.data?.full_name||"",role,me.email||"");if(!['admin','teacher'].includes(role))return CodeHubUI.forbidden('Tài khoản này không có quyền quản lý câu hỏi Quiz.');const q=await s.from('quizzes').select('title,teacher_id').eq('id',qid).single();if(q.error||!q.data)return CodeHubUI.forbidden('Không tìm thấy Quiz hoặc Quiz không thuộc phạm vi quản lý của bạn.');if(role==='teacher'&&q.data.teacher_id!==u.id)return CodeHubUI.forbidden('Quiz này thuộc giáo viên khác.');h.textContent='🧩 '+q.data.title;await load()}finally{CodeHubUI.loading(false)}}
async function load(){let r=await s.from('quiz_questions').select('*').eq('quiz_id',qid).order('question_order');if(r.error)return CodeHubUI.toast(r.error.message,'error');list.innerHTML=(r.data||[]).map((x,i)=>`<div class="bg-white p-5 rounded-2xl shadow"><div class="flex justify-between gap-3"><b>Câu ${i+1}. ${x.question_text}</b><button onclick="delx('${x.id}')" class="text-red-600">Xóa</button></div><div class="mt-2 text-sm">A. ${x.option_a}<br>B. ${x.option_b}<br>C. ${x.option_c}<br>D. ${x.option_d}</div><div class="mt-2 text-emerald-700 font-bold">Đáp án: ${x.correct_answer}</div></div>`).join('')||'<div class="bg-white p-5 rounded-xl">Chưa có câu hỏi.</div>'}
f.onsubmit=async e=>{e.preventDefault();CodeHubUI.loading(true,'Đang thêm câu hỏi...');try{let r=await s.from('quiz_questions').insert({quiz_id:qid,question_text:qt.value.trim(),option_a:a.value.trim(),option_b:b.value.trim(),option_c:c.value.trim(),option_d:d.value.trim(),correct_answer:correct.value,explanation:ex.value.trim(),question_order:+ord.value||1});if(r.error)return CodeHubUI.toast(r.error.message,'error');f.reset();ord.value=1;CodeHubUI.toast('Đã thêm câu hỏi.','success');await load()}finally{CodeHubUI.loading(false)}};
async function delx(id){if(!confirm('Xóa câu hỏi?'))return;let r=await s.from('quiz_questions').delete().eq('id',id);if(r.error)CodeHubUI.toast(r.error.message,'error');else{CodeHubUI.toast('Đã xóa câu hỏi.','success');load()}}init();</script></body></html>
