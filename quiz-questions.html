<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Câu hỏi Quiz V2.5</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50"><main class="max-w-6xl mx-auto p-6"><div class="flex justify-between mb-5"><div><h1 id="h" class="text-3xl font-bold">Câu hỏi</h1><p class="text-slate-500">V2.5 • A/B/C/D • chỉ Quiz thuộc quyền quản lý</p></div><a href="quizzes.html" class="border rounded-xl px-4 py-2 h-fit">← Quiz</a></div>
<div class="grid md:grid-cols-5 gap-5"><form id="f" class="md:col-span-2 bg-white p-5 rounded-2xl shadow space-y-3"><textarea id="qt" class="w-full border p-3 rounded-xl" placeholder="Nội dung câu hỏi" required></textarea><input id="a" class="w-full border p-3 rounded-xl" placeholder="A" required><input id="b" class="w-full border p-3 rounded-xl" placeholder="B" required><input id="c" class="w-full border p-3 rounded-xl" placeholder="C" required><input id="d" class="w-full border p-3 rounded-xl" placeholder="D" required><select id="correct" class="w-full border p-3 rounded-xl"><option>A</option><option>B</option><option>C</option><option>D</option></select><textarea id="ex" class="w-full border p-3 rounded-xl" placeholder="Giải thích đáp án"></textarea><input id="ord" type="number" min="1" value="1" class="w-full border p-3 rounded-xl"><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Thêm câu hỏi</button></form><section id="list" class="md:col-span-3 space-y-3"></section></div></main>
<script>const s=window.supabaseClient,qid=new URLSearchParams(location.search).get('quiz');async function init(){
 if(!qid)return location.href='quizzes.html';
 const u=(await s.auth.getUser()).data.user;
 if(!u)return location.href='login.html';
 const pr=await s.from('profiles').select('role').eq('id',u.id).single();
 const role=(pr.data?.role||'').trim().toLowerCase();
 if(!['admin','teacher'].includes(role))return location.href='student-dashboard.html';
 const q=await s.from('quizzes').select('title,teacher_id').eq('id',qid).single();
 if(q.error||!q.data){alert('Không tìm thấy Quiz hoặc bạn không có quyền truy cập.');return location.href='quizzes.html';}
 if(role==='teacher' && q.data.teacher_id!==u.id){alert('Bạn không có quyền truy cập Quiz của giáo viên khác.');return location.href='quizzes.html';}
 window.currentRole=role;
 h.textContent='🧩 '+q.data.title;
 load();
}
async function load(){let r=await s.from('quiz_questions').select('*').eq('quiz_id',qid).order('question_order');list.innerHTML=(r.data||[]).map((x,i)=>`<div class="bg-white p-5 rounded-2xl shadow"><div class="flex justify-between"><b>Câu ${i+1}. ${x.question_text}</b><button onclick="delx('${x.id}')" class="text-red-600">Xóa</button></div><div class="mt-2 text-sm">A. ${x.option_a}<br>B. ${x.option_b}<br>C. ${x.option_c}<br>D. ${x.option_d}</div><div class="mt-2 text-emerald-700 font-bold">Đáp án: ${x.correct_answer}</div></div>`).join('')||'<div class="bg-white p-5 rounded-xl">Chưa có câu hỏi.</div>';}
f.onsubmit=async e=>{e.preventDefault();let r=await s.from('quiz_questions').insert({quiz_id:qid,question_text:qt.value.trim(),option_a:a.value.trim(),option_b:b.value.trim(),option_c:c.value.trim(),option_d:d.value.trim(),correct_answer:correct.value,explanation:ex.value.trim(),question_order:+ord.value||1});if(r.error)return alert(r.error.message);f.reset();ord.value=1;load();};async function delx(id){if(confirm('Xóa câu hỏi?')){let r=await s.from('quiz_questions').delete().eq('id',id);if(r.error)alert(r.error.message);else load();}}init();</script></body></html>
