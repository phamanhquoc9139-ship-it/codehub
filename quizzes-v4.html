<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Quiz V4</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-6xl mx-auto p-6"><div class="flex justify-between mb-6"><div><h1 class="text-3xl font-bold">📝 Quản lý Quiz V4</h1><p class="text-slate-500">Tạo đề • AI • giao lớp • kết quả</p></div><a href="teacher.html" class="border p-2 rounded-xl">← Dashboard</a></div><div class="grid md:grid-cols-3 gap-5"><form id="f" class="bg-white p-5 rounded-2xl shadow space-y-3"><h2 class="font-bold text-xl">Tạo Quiz</h2><select id="course" required class="w-full border p-3 rounded-xl"></select><input id="title" required class="w-full border p-3 rounded-xl" placeholder="Tên bài kiểm tra"><textarea id="desc" class="w-full border p-3 rounded-xl" placeholder="Mô tả"></textarea><input id="time" type="number" min="1" value="15" class="w-full border p-3 rounded-xl"><label><input id="pub" type="checkbox"> Xuất bản</label><button class="w-full bg-blue-600 text-white p-3 rounded-xl">Lưu Quiz</button></form><section class="md:col-span-2 bg-white p-5 rounded-2xl shadow"><div class="flex justify-between mb-4"><h2 class="font-bold text-xl">Danh sách Quiz</h2><a href="ai-quiz-generator-v3-2.html" class="bg-violet-600 text-white p-2 rounded-xl">✨ AI</a></div><div id="list"></div></section></div></main><script>
const s=window.supabaseClient;let me;async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";let p=await s.from("profiles").select("role").eq("id",me.id).single();if(p.data?.role!=="teacher")return location.href="student-dashboard.html";let c=await s.from("courses").select("id,title").eq("teacher_id",me.id).order("title");course.innerHTML='<option value="">-- Chọn khóa học --</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${x.title}</option>`).join("");load()}async function load(){let r=await s.from("quizzes").select("*,courses(title)").eq("teacher_id",me.id).order("created_at",{ascending:false});list.innerHTML=(r.data||[]).map(q=>`<div class="border rounded-xl p-4 mb-3"><b>${q.title}</b><div class="text-sm text-slate-500">${q.courses?.title||""} • ${q.time_limit} phút</div><div class="flex flex-wrap gap-2 mt-3"><a class="bg-emerald-600 text-white p-2 rounded-lg" href="quiz-questions.html?quiz=${q.id}">Câu hỏi</a><a class="bg-blue-600 text-white p-2 rounded-lg" href="quiz-assign-v4.html?quiz=${q.id}">📤 Giao lớp</a><a class="bg-violet-600 text-white p-2 rounded-lg" href="quiz-results-v4.html?quiz=${q.id}">📊 Kết quả</a><button onclick="delq('${q.id}')" class="text-red-600 p-2">Xóa</button></div></div>`).join("")||"Chưa có Quiz."}f.onsubmit=async e=>{e.preventDefault();let r=await s.from("quizzes").insert({course_id:course.value,title:title.value.trim(),description:desc.value.trim(),time_limit:+time.value||15,is_published:pub.checked,teacher_id:me.id});if(r.error)return alert(r.error.message);f.reset();time.value=15;load()};async function delq(id){if(confirm("Xóa Quiz?")){let r=await s.from("quizzes").delete().eq("id",id);r.error?alert(r.error.message):load()}}init();</script></body></html>
