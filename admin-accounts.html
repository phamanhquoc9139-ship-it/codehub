<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý tài khoản V2 | CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#0f172a}header{background:#fff;padding:20px 3%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}main{width:94%;margin:25px auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.box{background:#fff;border-radius:18px;padding:22px}.num{font-size:38px;font-weight:800}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select,input,select{padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.tools input{flex:1}.btn{border:0;border-radius:11px;padding:13px 17px;font-weight:700;font-size:15px;cursor:pointer}.blue{background:#2563eb;color:#fff}.green{background:#059669;color:#fff}.orange{background:#f97316;color:#fff}.red{background:#dc2626;color:#fff}.white{background:#fff;border:1px solid #cbd5e1}.table{overflow:auto;background:#fff;border-radius:18px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#eef3f9}.badge{padding:5px 9px;border-radius:20px;font-weight:700}.teacher{background:#dbeafe;color:#1d4ed8}.student{background:#dcfce7;color:#15803d}.admin{background:#ede9fe;color:#6d28d9}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:10}.modal.on{display:flex}.dialog{background:#fff;width:min(650px,94%);border-radius:18px;padding:25px;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.subjects{display:flex;gap:10px;flex-wrap:wrap}.subject{background:#f1f5f9;padding:9px;border-radius:9px}#msg{margin:12px 0;color:#b91c1c;font-weight:700}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head>
<body><header><div><h1>👥 Quản lý tài khoản V2</h1><div>Admin • giáo viên • học sinh</div></div><div><button class="btn white" onclick="location.href='teacher.html'">← Quản trị</button> <button class="btn blue" id="logout">Đăng xuất</button></div></header>
<main><div class="cards"><div class="card">Tổng tài khoản<div class="num" id="total">—</div></div><div class="card">👨‍🏫 Giáo viên<div class="num" id="teachers">—</div></div><div class="card">👨‍🎓 Học sinh<div class="num" id="students">—</div></div></div>
<div class="tools"><input id="search" placeholder="🔎 Tìm họ tên, email, mã, lớp..."><select id="role"><option value="">Tất cả vai trò</option><option value="admin">Admin</option><option value="teacher">Giáo viên</option><option value="student">Học sinh</option></select><button class="btn green" id="add">＋ Thêm giáo viên</button><button class="btn orange" id="export">⬇ Xuất CSV</button><button class="btn blue" id="reload">↻ Làm mới</button></div><div id="msg"></div>
<div class="table"><table><thead><tr><th>STT</th><th>Họ tên</th><th>Email</th><th>Mã</th><th>Lớp</th><th>Môn phụ trách</th><th>Vai trò</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="mtitle">➕ Thêm giáo viên</h2><div class="grid">
<div class="field"><b>Họ tên *</b><input id="name"></div><div class="field"><b>Mã giáo viên *</b><input id="code" placeholder="GV002"></div>
<div class="field full"><b>Email *</b><input id="email" type="email"></div><div class="field full"><b>Mật khẩu *</b><input id="password" type="password" value="123456"></div>
<div class="field full"><b>Môn phụ trách</b><div class="subjects" id="subjects">Đang tải...</div></div></div>
<div style="margin-top:20px;text-align:right"><button class="btn white" id="cancel">Hủy</button> <button class="btn green" id="save">Tạo giáo viên</button></div></div></div>
<script>
const $=x=>document.getElementById(x), FN="https://drfcejvmyhzorwepndta.supabase.co/functions/v1/admin-accounts";let accounts=[],subjects=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function session(){const {data:{session}}=await window.supabaseClient.auth.getSession();if(!session){location.href="login.html";throw 0}return session}
async function api(method,body){let s=await session();let r=await fetch(FN,{method,headers:{Authorization:`Bearer ${s.access_token}`,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||`HTTP ${r.status}`);return j}
function filt(){let q=$("search").value.toLowerCase(),r=$("role").value;return accounts.filter(x=>(!r||x.role===r)&&(!q||[x.full_name,x.email,x.student_code,x.class_name,(x.subjects||[]).join(" ")].join(" ").toLowerCase().includes(q)))}
function render(){let a=filt();$("rows").innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.full_name||"—")}</b></td><td>${esc(x.email||"—")}</td><td>${esc(x.student_code||"—")}</td><td>${esc(x.class_name||"—")}</td><td>${esc((x.subjects||[]).join(", ")||"—")}</td><td><span class="badge ${esc(x.role)}">${x.role==="admin"?"Admin":x.role==="teacher"?"Giáo viên":"Học sinh"}</span></td><td>${x.role==="teacher"?`<button class="btn orange" onclick="resetPwd('${x.id}')">Đặt MK</button> <button class="btn red" onclick="delTeacher('${x.id}','${esc(x.full_name)}')">Xóa</button>`:"—"}</td></tr>`).join("")||'<tr><td colspan="8">Không có dữ liệu.</td></tr>';$("total").textContent=accounts.length;$("teachers").textContent=accounts.filter(x=>x.role==="teacher").length;$("students").textContent=accounts.filter(x=>x.role==="student").length}
async function load(){try{let j=await api("GET");accounts=j.accounts||j.users||j.data||[];subjects=j.subjects||[];render();$("subjects").innerHTML=subjects.length?subjects.map(s=>`<label class="subject"><input type="checkbox" value="${esc(s.id)}"> ${esc(s.subject_name)}</label>`).join(""):"Chưa có môn học."}catch(e){$("msg").textContent="Lỗi: "+e.message}}
$("search").oninput=render;$("role").onchange=render;$("reload").onclick=load;$("add").onclick=()=>{$("modal").classList.add("on")};$("cancel").onclick=()=>$("modal").classList.remove("on");
$("save").onclick=async()=>{try{let subject_ids=[...document.querySelectorAll("#subjects input:checked")].map(x=>x.value);await api("POST",{action:"create-teacher",full_name:$("name").value.trim(),student_code:$("code").value.trim(),email:$("email").value.trim(),password:$("password").value,subject_ids});alert("Đã tạo giáo viên.");$("modal").classList.remove("on");await load()}catch(e){alert(e.message)}};
async function resetPwd(id){let p=prompt("Nhập mật khẩu mới (ít nhất 6 ký tự):","123456");if(!p)return;try{await api("POST",{action:"reset-password",user_id:id,password:p});alert("Đã đổi mật khẩu.")}catch(e){alert(e.message)}}
async function delTeacher(id,n){if(!confirm(`Xóa tài khoản giáo viên ${n}?`))return;try{await api("POST",{action:"delete-teacher",user_id:id});alert("Đã xóa.");load()}catch(e){alert(e.message)}}
$("logout").onclick=async()=>{await window.supabaseClient.auth.signOut();location.href="login.html"};
$("export").onclick=()=>{let a=filt(),rows=[["STT","Họ tên","Email","Mã","Lớp","Môn phụ trách","Vai trò"],...a.map((x,i)=>[i+1,x.full_name,x.email,x.student_code,x.class_name,(x.subjects||[]).join("; "),x.role])],csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\r\n"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download="CodeHub_tai_khoan.csv";l.click();URL.revokeObjectURL(u)};
load();
</script></body></html>
