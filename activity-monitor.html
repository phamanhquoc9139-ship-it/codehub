<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhật ký CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><style>body{font:15px Arial;background:#f5f7fb;color:#18253c;margin:0}header{background:white;padding:20px 5%;display:flex;justify-content:space-between}main{max-width:1250px;margin:30px auto;padding:0 20px}.panel{background:white;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #0001}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input,button{padding:11px;border:1px solid #ccd5e2;border-radius:8px}button{background:#2563eb;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb}th{background:#f1f5f9}.scroll{overflow:auto}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats div{background:#eef4ff;border-radius:10px;padding:16px;flex:1;min-width:130px}.muted{color:#64748b}</style></head><body><header><strong>📋 CodeHub · Nhật ký truy cập</strong><a href="teacher.html">← Quản trị giáo viên</a></header><main><h1>Thống kê người xem môn học</h1><p class="muted">Chỉ ghi nhận người đã đăng nhập, từ thời điểm triển khai tính năng.</p><p id="status">Đang xác minh quyền quản trị...</p><section id="app" hidden><div class="stats" id="stats"></div><div class="panel filters"><select id="days"><option value="1">Hôm nay (24 giờ)</option><option value="7" selected>7 ngày</option><option value="30">30 ngày</option><option value="90">90 ngày</option></select><select id="event"><option value="">Tất cả hoạt động</option><option value="page_view">Vào trang</option><option value="subject_click">Nhấp môn học</option><option value="subject_view">Mở trang môn học</option><option value="lesson_view">Xem bài học</option><option value="ai_quiz">Tạo câu hỏi AI</option></select><input id="search" placeholder="Tìm tên, lớp, môn học..."><button id="refresh">Làm mới</button><button id="export">Xuất CSV</button></div><div class="panel scroll"><table><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Lớp</th><th>Hoạt động</th><th>Môn học</th><th>Bài học/chi tiết</th></tr></thead><tbody id="rows"></tbody></table><p id="paging" class="muted"></p></div></section></main><script>
const $=id=>document.getElementById(id);let client,all=[];const names={page_view:'Vào trang',subject_click:'Nhấp môn học',subject_view:'Mở môn học',lesson_view:'Xem bài học',ai_quiz:'Tạo câu hỏi AI'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){client=window.supabaseClient;if(!client){$('status').textContent='Không có cấu hình Supabase.';return}const {data:{user}}=await client.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error}=await client.from('profiles').select('role').eq('id',user.id).single();if(error||String(p?.role).toLowerCase()!=='admin'){$('status').textContent='Chỉ quản trị viên được xem nhật ký.';return}$('app').hidden=false;await load()}
async function load(){$('status').textContent='Đang tải dữ liệu...';let since=new Date(Date.now()-Number($('days').value)*86400000).toISOString();const {data,error}=await client.from('activity_logs').select('id,created_at,user_id,event_type,subject,lesson,page_path').gte('created_at',since).order('created_at',{ascending:false}).limit(1000);if(error){$('status').textContent='Lỗi đọc nhật ký: '+error.message;return}const ids=[...new Set((data||[]).map(x=>x.user_id))];let profiles=[];if(ids.length){const r=await client.from('profiles').select('id,full_name,class_name').in('id',ids);if(r.error){$('status').textContent='Không thể đọc hồ sơ: '+r.error.message;return}profiles=r.data||[]}const map=Object.fromEntries(profiles.map(p=>[p.id,p]));all=(data||[]).map(x=>({...x,name:map[x.user_id]?.full_name||'Không rõ',class_name:map[x.user_id]?.class_name||''}));$('status').textContent='Đã tải '+all.length+' bản ghi gần nhất (tối đa 1.000).';render()}
function filtered(){let q=$('search').value.toLocaleLowerCase('vi'),event=$('event').value;return all.filter(x=>(!event||x.event_type===event)&&[x.name,x.class_name,x.subject,x.lesson].join(' ').toLocaleLowerCase('vi').includes(q))}
function render(){let a=filtered();$('stats').innerHTML=[['Bản ghi',a.length],['Người dùng',new Set(a.map(x=>x.user_id)).size],['Lượt mở môn',a.filter(x=>x.event_type==='subject_view').length],['Lượt AI Quiz',a.filter(x=>x.event_type==='ai_quiz').length]].map(([k,v])=>`<div><div class="muted">${k}</div><h2>${v}</h2></div>`).join('');$('rows').innerHTML=a.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('vi-VN'))}</td><td>${esc(x.name)}</td><td>${esc(x.class_name)}</td><td>${esc(names[x.event_type]||x.event_type)}</td><td>${esc(x.subject)}</td><td>${esc(x.lesson)}</td></tr>`).join('')||'<tr><td colspan="6">Không có dữ liệu.</td></tr>';$('paging').textContent='Đang hiển thị '+a.length+' bản ghi.'}
$('refresh').onclick=load;$('days').onchange=load;$('event').onchange=render;$('search').oninput=render;$('export').onclick=()=>{const a=filtered(),cols=['created_at','name','class_name','event_type','subject','lesson','page_path'];const csv='\uFEFF'+[cols.join(','),...a.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=u;link.download='codehub-activity.csv';link.click();URL.revokeObjectURL(u)};init().catch(e=>$('status').textContent=e.message);
</script></body></html>
