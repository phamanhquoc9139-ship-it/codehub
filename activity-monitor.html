<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhật ký CodeHub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><style>body{font:15px Arial;background:#f5f7fb;color:#18253c;margin:0}header{background:white;padding:20px 5%;display:flex;justify-content:space-between}main{max-width:1250px;margin:30px auto;padding:0 20px}.panel{background:white;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #0001}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input,button{padding:11px;border:1px solid #ccd5e2;border-radius:8px}button{background:#2563eb;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb}th{background:#f1f5f9}.scroll{overflow:auto}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats div{background:#eef4ff;border-radius:10px;padding:16px;flex:1;min-width:130px}.muted{color:#64748b}</style></head><body><header><strong>📋 CodeHub · Nhật ký truy cập</strong><a href="teacher.html">← Quản trị giáo viên</a></header><main><h1>Ai đã truy cập CodeHub hôm nay?</h1><p class="muted">Ghi nhận lượt vào trang chủ và lượt mở môn học; khách không đăng nhập được ghi là “Khách” (không xác định danh tính).</p><p id="status">Đang xác minh quyền quản trị...</p><section id="app" hidden><div class="stats" id="stats"></div><div class="panel filters"><label for="day">Ngày xem: </label><input type="date" id="day"><select id="event"><option value="">Tất cả</option><option value="page_view">Vào website</option><option value="subject_view">Xem môn học</option></select><input id="search" placeholder="Tìm tên, lớp, môn học..."><button id="refresh">Làm mới</button><button id="export">Xuất CSV</button></div><div class="panel scroll"><table><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Lớp</th><th>Hoạt động</th><th>Môn học</th><th>Bài học/chi tiết</th></tr></thead><tbody id="rows"></tbody></table><p id="paging" class="muted"></p></div></section></main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let client,all=[];
const tz='Asia/Ho_Chi_Minh';
function localDate(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function bounds(day){const start=new Date(day+'T00:00:00+07:00');return [start.toISOString(),new Date(start.getTime()+86400000).toISOString()]}
async function init(){
 $('day').value=localDate();
 client=window.supabaseClient;if(!client){$('status').textContent='Chưa tải cấu hình Supabase';return}
 const {data:{user},error:authErr}=await client.auth.getUser();if(authErr||!user){location.href='login.html';return}
 const {data:p,error}=await client.from('profiles').select('role').eq('id',user.id).maybeSingle();
 if(error||String(p?.role||'').trim().toLowerCase()!=='admin'){$('status').textContent='Chỉ quản trị viên được xem nhật ký.';return}
 $('app').hidden=false;await load();
}
async function readAll(table,columns,from,to){
 const result=[];let start=0;
 for(let i=0;i<30;i++){
  const {data,error}=await client.from(table).select(columns).gte('created_at',from).lt('created_at',to).order('created_at',{ascending:false}).range(start,start+999);
  if(error)throw new Error(table+': '+error.message);
  result.push(...(data||[]));if(!data||data.length<1000)break;start+=1000;
 }
 return result;
}
async function load(){
 $('status').textContent='Đang tải nhật ký...';
 try{
  const [from,to]=bounds($('day').value);
  const [auth,guests]=await Promise.all([
   readAll('activity_logs','created_at,user_id,event_type,subject,page_path',from,to),
   readAll('guest_activity_logs','created_at,event_type,subject,page_path',from,to)
  ]);
  const relevant=auth.filter(x=>['page_view','subject_view'].includes(x.event_type));
  const ids=[...new Set(relevant.map(x=>x.user_id))];const profiles=[];
  for(let i=0;i<ids.length;i+=100){const {data,error}=await client.from('profiles').select('id,full_name,class_name,role').in('id',ids.slice(i,i+100));if(error)throw Error('Không đọc được hồ sơ: '+error.message);profiles.push(...(data||[]))}
  const map=Object.fromEntries(profiles.map(p=>[p.id,p]));
  all=[...relevant.map(x=>({...x,name:map[x.user_id]?.full_name||'Tài khoản đã đăng nhập',class_name:map[x.user_id]?.class_name||map[x.user_id]?.role||'',guest:false})),
   ...guests.map(x=>({...x,user_id:null,name:'Khách',class_name:'',guest:true}))]
   .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  $('status').textContent='Ngày '+$('day').value+': '+all.length+' lượt truy cập. Khách chỉ đếm theo lượt, không xác định số người.';
  render();
 }catch(e){$('status').textContent='Lỗi: '+e.message;console.error(e)}
}
function filtered(){const q=$('search').value.toLocaleLowerCase('vi'),event=$('event').value;return all.filter(x=>(!event||x.event_type===event)&&[x.name,x.class_name,x.subject].join(' ').toLocaleLowerCase('vi').includes(q))}
function render(){const a=filtered();const members=new Set(a.filter(x=>!x.guest).map(x=>x.user_id));const guests=a.filter(x=>x.guest).length;
 $('stats').innerHTML=[['Lượt truy cập',a.length],['Tài khoản đăng nhập',members.size],['Lượt khách',guests],['Lượt xem môn',a.filter(x=>x.event_type==='subject_view').length]].map(([k,v])=>`<div><div class="muted">${k}</div><h2>${v}</h2></div>`).join('');
 $('rows').innerHTML=a.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('vi-VN',{timeZone:tz}))}</td><td>${esc(x.name)}</td><td>${esc(x.class_name)}</td><td>${x.event_type==='subject_view'?'Xem môn học':'Vào website'}</td><td>${esc(x.subject||'—')}</td><td>${esc(x.page_path||'')}</td></tr>`).join('')||'<tr><td colspan="6">Không có dữ liệu trong ngày.</td></tr>';
 $('paging').textContent='Đang hiển thị '+a.length+' lượt.';
}
$('refresh').onclick=load;$('day').onchange=load;$('event').onchange=render;$('search').oninput=render;
$('export').onclick=()=>{const a=filtered(),cols=['created_at','name','class_name','event_type','subject','page_path'];const csv='\uFEFF'+[cols.join(','),...a.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='codehub-'+$('day').value+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
init().catch(e=>$('status').textContent='Lỗi: '+e.message);
</script></body></html>
