<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý lớp học V3.7.20 | CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-7xl mx-auto p-5">
  <div class="flex flex-wrap justify-between gap-3 items-start">
    <div>
      <h1 class="text-3xl font-black">🏫 Quản lý lớp học <span class="text-violet-600 text-lg">V3.7.20</span></h1>
      <p class="text-slate-500 mt-1">Mỗi lớp được xác định bằng Trường + class_id. Tên lớp có thể trùng giữa các trường.</p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <a id="schoolAdmin" href="schools.html" class="hidden border bg-white px-4 py-2 rounded-xl font-bold">🏫 Trường</a>
      <a href="students.html" class="border bg-white px-4 py-2 rounded-xl font-bold">👨‍🎓 Học sinh</a>
      <a href="teacher.html" class="border bg-white px-4 py-2 rounded-xl font-bold">← Dashboard</a>
    </div>
  </div>

  <div id="msg" class="hidden mt-4 p-3 rounded-xl"></div>

  <section class="grid md:grid-cols-3 gap-4 mt-5">
    <div class="bg-white rounded-2xl shadow p-5"><div class="text-slate-500">Tổng số lớp</div><div id="totalClasses" class="text-3xl font-black mt-1">0</div></div>
    <div class="bg-white rounded-2xl shadow p-5"><div class="text-slate-500">Tổng số học sinh</div><div id="totalStudents" class="text-3xl font-black mt-1">0</div></div>
    <div class="bg-white rounded-2xl shadow p-5"><div class="text-slate-500">Trung bình HS / lớp</div><div id="avgStudents" class="text-3xl font-black mt-1">0</div></div>
  </section>

  <section class="bg-white rounded-2xl shadow p-4 mt-5">
    <div class="grid md:grid-cols-3 gap-3">
      <input id="search" class="border rounded-xl p-3" placeholder="🔎 Tìm lớp / trường / năm học">
      <select id="schoolFilter" class="border rounded-xl p-3"></select>
      <button id="addBtn" class="bg-emerald-600 text-white rounded-xl p-3 font-bold">+ Tạo lớp mới</button>
    </div>
  </section>

  <div id="classGrid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mt-5"></div>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 p-4 overflow-auto">
  <div class="max-w-4xl mx-auto mt-8 bg-white rounded-2xl shadow-xl p-5">
    <div class="flex justify-between gap-3 items-start">
      <div><h2 id="modalTitle" class="text-2xl font-black"></h2><p id="modalSub" class="text-slate-500 mt-1"></p></div>
      <button onclick="closeModal()" class="border rounded-xl px-3 py-2">✕</button>
    </div>
    <div id="modalBody" class="mt-4"></div>
  </div>
</div>

<script>
const s=window.supabaseClient,$=x=>document.getElementById(x);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let me,role,classes=[],students=[],schools=[];

function say(t,ok=false){msg.className="mt-4 p-3 rounded-xl "+(ok?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-700");msg.textContent=t}
function normClass(v){return String(v||"").trim().replace(/\s+/g,"").toUpperCase()}
function yearNow(){const d=new Date(),y=d.getFullYear();return d.getMonth()+1>=8?`${y}-${y+1}`:`${y-1}-${y}`}

async function init(){
  me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";
  const p=await s.from("profiles").select("role").eq("id",me.id).single();
  role=String(p.data?.role||"").trim().toLowerCase();
  if(!["admin","teacher"].includes(role))return location.href="index.html";

  if(role==="admin"){
    schoolAdmin.classList.remove("hidden");
    addBtn.onclick=openAdd;
  }else{
    addBtn.classList.add("hidden");
    const sub=document.querySelector("p.text-slate-500");
    if(sub)sub.textContent="Giáo viên chỉ xem các lớp được Admin phân công; không được tạo, sửa, xóa hoặc chuyển học sinh.";
  }

  search.oninput=render;
  schoolFilter.onchange=render;
  await reload();
}

async function reload(){
  const [cr,sr,sc]=await Promise.all([
    s.rpc("codehub_v370_classes_for_user"),
    s.rpc("codehub_v370_students"),
    s.rpc("codehub_v376_schools_for_user")
  ]);
  if(cr.error)return say(cr.error.message);
  if(sr.error)return say(sr.error.message);
  if(sc.error)return say(sc.error.message);

  classes=cr.data||[];
  students=sr.data||[];
  schools=sc.data||[];

  buildSchoolFilter();
  updateStats();
  render();
}

function buildSchoolFilter(){
  const old=schoolFilter.value;
  schoolFilter.innerHTML='<option value="">Tất cả trường</option>'+schools.map(x=>`<option value="${x.id}">${esc(x.school_name)}</option>`).join("");
  if([...schoolFilter.options].some(o=>o.value===old))schoolFilter.value=old;
}

function studentsOf(classId){
  return students.filter(x=>x.class_id===classId);
}

function updateStats(){
  const total=classes.length;
  const ids=new Set(classes.map(x=>x.id));
  const st=students.filter(x=>ids.has(x.class_id));
  totalClasses.textContent=total;
  totalStudents.textContent=st.length;
  avgStudents.textContent=total?(st.length/total).toFixed(1):"0";
}

function render(){
  const q=search.value.trim().toLowerCase();
  const sid=schoolFilter.value;
  const data=classes.filter(x=>{
    if(sid && x.school_id!==sid)return false;
    if(!q)return true;
    return [x.school_name,x.class_name,x.school_year].some(v=>String(v||"").toLowerCase().includes(q));
  });

  classGrid.innerHTML=data.map(x=>{
    const n=studentsOf(x.id).length;
    return `<section class="bg-white rounded-2xl shadow p-5 border">
      <div class="text-sm font-bold text-blue-700">${esc(x.school_name)}</div>
      <div class="text-3xl font-black mt-2">${esc(x.class_name)}</div>
      <div class="text-slate-500 mt-2">📅 Năm học: ${esc(x.school_year||"—")}</div>
      <div class="font-bold mt-2">👨‍🎓 ${n} học sinh</div>
      <div class="${role==="admin"?"grid grid-cols-3":"grid grid-cols-1"} gap-2 mt-5">
        <button onclick="viewClass('${x.id}')" class="bg-blue-600 text-white rounded-xl py-2 font-bold">Xem</button>
        ${role==="admin"?`<button onclick="editClass('${x.id}')" class="bg-amber-500 text-white rounded-xl py-2 font-bold">Sửa</button>
        <button onclick="deleteClass('${x.id}')" class="bg-red-600 text-white rounded-xl py-2 font-bold">Xóa</button>`:""}
      </div>
    </section>`;
  }).join("")||'<div class="col-span-full bg-white p-8 rounded-2xl text-center text-slate-500">Không tìm thấy lớp.</div>';
}

function openModal(title,sub,body){
  modalTitle.textContent=title;modalSub.textContent=sub||"";modalBody.innerHTML=body;modal.classList.remove("hidden");
}
function closeModal(){modal.classList.add("hidden")}

function schoolOptions(selected=""){
  return schools.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.school_name)}</option>`).join("");
}

function openAdd(){if(role!=="admin")return alert("Chỉ Admin được tạo lớp.");
  openModal("➕ Tạo lớp mới","Lớp cùng tên ở hai trường khác nhau là hợp lệ.",`
    <div class="space-y-3">
      <label class="block font-bold">Trường<select id="mSchool" class="block w-full border rounded-xl p-3 mt-1"><option value="">-- Chọn trường --</option>${schoolOptions()}</select></label>
      <label class="block font-bold">Tên lớp<input id="mClass" class="block w-full border rounded-xl p-3 mt-1" placeholder="12A3"></label>
      <label class="block font-bold">Năm học<input id="mYear" class="block w-full border rounded-xl p-3 mt-1" value="${yearNow()}"></label>
      <button onclick="createClass()" class="w-full bg-emerald-600 text-white rounded-xl p-3 font-bold">Tạo lớp</button>
      <div id="mMsg"></div>
    </div>`);
}

async function createClass(){if(role!=="admin")return alert("Chỉ Admin được tạo lớp.");
  const sid=mSchool.value,name=normClass(mClass.value),year=mYear.value.trim();
  if(!sid||!name)return mMsg.textContent="Chọn trường và nhập tên lớp.";
  const r=await s.rpc("codehub_v376_create_class",{p_school:sid,p_class_name:name,p_school_year:year});
  if(r.error)return mMsg.textContent="❌ "+r.error.message;
  mMsg.innerHTML='<span class="text-emerald-700 font-bold">✓ Đã tạo lớp.</span>';
  await reload();setTimeout(closeModal,500);
}

function editClass(id){if(role!=="admin")return alert("Giáo viên không được sửa lớp.");
  const x=classes.find(z=>z.id===id);if(!x)return;
  openModal("✏️ Sửa lớp",`${x.school_name} • ${x.class_name}`,`
    <div class="space-y-3">
      <label class="block font-bold">Trường<select id="eSchool" class="block w-full border rounded-xl p-3 mt-1">${schoolOptions(x.school_id)}</select></label>
      <label class="block font-bold">Tên lớp<input id="eClass" class="block w-full border rounded-xl p-3 mt-1" value="${esc(x.class_name)}"></label>
      <label class="block font-bold">Năm học<input id="eYear" class="block w-full border rounded-xl p-3 mt-1" value="${esc(x.school_year||yearNow())}"></label>
      <button onclick="saveClass('${id}')" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Lưu thay đổi</button>
      <div id="eMsg"></div>
    </div>`);
}
async function saveClass(id){if(role!=="admin")return alert("Giáo viên không được sửa lớp.");
  const r=await s.rpc("codehub_v376_update_class",{p_class:id,p_school:eSchool.value,p_class_name:normClass(eClass.value),p_school_year:eYear.value.trim()});
  if(r.error)return eMsg.textContent="❌ "+r.error.message;
  eMsg.innerHTML='<span class="text-emerald-700 font-bold">✓ Đã cập nhật.</span>';
  await reload();setTimeout(closeModal,500);
}

function viewClass(id){
  const x=classes.find(z=>z.id===id);if(!x)return;
  const list=studentsOf(id);
  const targets=classes.filter(c=>c.id!==id);
  const adminMove=role==="admin";

  openModal(`👨‍🎓 Lớp ${x.class_name}`,`${x.school_name} • ${x.school_year||"—"} • ${list.length} học sinh`,`
    <div class="overflow-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-100"><tr><th class="p-3">STT</th><th class="p-3 text-left">Họ và tên</th><th class="p-3">Mã HS</th><th class="p-3 text-left">Trường</th><th class="p-3">Lớp</th>${adminMove?'<th class="p-3">Chuyển lớp</th>':""}</tr></thead>
        <tbody>${list.map((st,i)=>`<tr class="border-t">
          <td class="p-3 text-center">${i+1}</td>
          <td class="p-3 font-semibold">${esc(st.full_name)}</td>
          <td class="p-3 text-center text-blue-600 font-bold">${esc(st.student_code)}</td>
          <td class="p-3">${esc(st.school_name)}</td>
          <td class="p-3 text-center">${esc(st.class_name)}</td>
          ${adminMove?`<td class="p-3"><div class="flex gap-2"><select id="mv_${st.id}" class="border rounded-lg p-2 min-w-52"><option value="">-- Chọn Trường • Lớp --</option>${targets.map(c=>`<option value="${c.id}">${esc(c.school_name)} • ${esc(c.class_name)} • ${esc(c.school_year||"")}</option>`).join("")}</select><button onclick="moveStudent('${st.id}')" class="bg-emerald-600 text-white rounded-lg px-3 font-bold">Chuyển</button></div></td>`:""}
        </tr>`).join("")||`<tr><td colspan="${adminMove?6:5}" class="p-8 text-center text-slate-500">Lớp chưa có học sinh.</td></tr>`}</tbody>
      </table>
    </div>`);
}

async function moveStudent(studentId){if(role!=="admin")return alert("Giáo viên không được chuyển lớp học sinh.");
  const sel=document.getElementById("mv_"+studentId);
  const target=classes.find(x=>x.id===sel?.value);
  const st=students.find(x=>x.id===studentId);
  if(!target)return alert("Chọn lớp cần chuyển.");
  if(!confirm(`Chuyển ${st?.full_name||"học sinh"} sang ${target.school_name} • ${target.class_name}?`))return;
  const r=await s.rpc("codehub_v370_bind_student_id",{p_student:studentId,p_school:target.school_id,p_class:target.id});
  if(r.error)return alert(r.error.message);
  await reload();closeModal();say("Đã chuyển học sinh đúng class_id.",true);
}

async function deleteClass(id){if(role!=="admin")return alert("Giáo viên không được xóa lớp.");
  const x=classes.find(z=>z.id===id);if(!x)return;
  const n=studentsOf(id).length;
  if(n)return alert(`Lớp ${x.school_name} • ${x.class_name} còn ${n} học sinh. Hãy chuyển HS trước.`);
  if(!confirm(`Xóa ${x.school_name} • ${x.class_name}?`))return;
  const r=await s.rpc("codehub_v376_delete_class",{p_class:id});
  if(r.error)return alert(r.error.message);
  await reload();say("Đã xóa lớp.",true);
}

init();
</script>
</body>
</html>
