<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quản lý lớp học | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3182f6;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }

    .btn {
      border: none;
      background: #3182f6;
      color: white;
      padding: 11px 17px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn-green {
      background: #16a34a;
    }

    .btn-gray {
      background: #64748b;
    }

    .btn-red {
      background: #dc2626;
    }

    .btn-orange {
      background: #ea580c;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .summary-label {
      color: #64748b;
      margin-bottom: 8px;
    }

    .summary-number {
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
    }

    .toolbar {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .toolbar input {
      flex: 1;
      border: 1px solid #cbd5e1;
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 16px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .class-card {
      background: white;
      padding: 25px;
      border-radius: 17px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      border: 1px solid #edf2f7;
      transition: .2s;
    }

    .class-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,.1);
    }

    .class-icon {
      font-size: 38px;
      margin-bottom: 13px;
    }

    .class-name {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .school-year {
      color: #64748b;
      margin-bottom: 8px;
    }

    .student-count {
      color: #475569;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .card-actions button {
      flex: 1;
      min-width: 70px;
      border: none;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .view-btn {
      background: #3182f6;
      color: white;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
    }

    .empty,
    #loading {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      grid-column: 1 / -1;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      width: min(600px, 96%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 26px;
    }

    .modal-large {
      width: min(900px, 96%);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .modal-title {
      font-size: 25px;
      font-weight: bold;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 20px;
      background: #e2e8f0;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
      min-height: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      text-align: left;
      padding: 12px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .student-code {
      color: #2563eb;
      font-weight: bold;
    }

    .move-select {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }

    .move-btn {
      border: none;
      padding: 8px 10px;
      border-radius: 7px;
      background: #16a34a;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    @media(max-width: 750px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
      }

      h1 {
        font-size: 29px;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    &lt;/&gt; CodeHub
  </div>

  <div class="header-actions">

    <button class="btn" onclick="goTeacher()">
      ← Quản trị
    </button>

    <button class="btn" onclick="goStudents()">
      👨‍🎓 Học sinh
    </button>

    <button class="btn" onclick="goHome()">
      Trang chủ
    </button>

    <button class="btn" onclick="logout()">
      Đăng xuất
    </button>

  </div>

</header>


<main class="container">

  <h1>🏫 Quản lý lớp học</h1>

  <p class="subtitle">
    Tạo lớp, quản lý sĩ số và học sinh theo từng lớp
  </p>


  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">
        Tổng số lớp
      </div>
      <div class="summary-number" id="totalClasses">
        0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">
        Tổng số học sinh
      </div>
      <div class="summary-number" id="totalStudents">
        0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">
        Trung bình HS / lớp
      </div>
      <div class="summary-number" id="averageStudents">
        0
      </div>
    </div>

  </div>


  <div class="toolbar">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 Tìm lớp..."
    >

    <button class="btn btn-green" onclick="openAddModal()">
      ➕ Tạo lớp mới
    </button>

  </div>


  <div id="loading">
    Đang tải dữ liệu lớp học...
  </div>

  <div id="classGrid" class="class-grid"></div>

</main>


<!-- ======================================
     MODAL THÊM LỚP
====================================== -->

<div id="addModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        ➕ Tạo lớp mới
      </div>

      <button class="close-btn" onclick="closeAddModal()">
        ×
      </button>

    </div>


    <div class="form-group">
      <label>Tên lớp</label>

      <input
        id="newClassName"
        placeholder="Ví dụ: 10A1"
      >
    </div>


    <div class="form-group">
      <label>Năm học</label>

      <input
        id="newSchoolYear"
        value="2026-2027"
        placeholder="2026-2027"
      >
    </div>


    <div id="addMessage" class="message"></div>


    <div class="modal-actions">

      <button class="btn btn-gray" onclick="closeAddModal()">
        Hủy
      </button>

      <button class="btn btn-green" onclick="createClass()">
        Tạo lớp
      </button>

    </div>

  </div>

</div>


<!-- ======================================
     MODAL SỬA LỚP
====================================== -->

<div id="editModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        ✏️ Sửa lớp học
      </div>

      <button class="close-btn" onclick="closeEditModal()">
        ×
      </button>

    </div>


    <input type="hidden" id="editClassId">
    <input type="hidden" id="oldClassName">


    <div class="form-group">
      <label>Tên lớp</label>

      <input id="editClassName">
    </div>


    <div class="form-group">
      <label>Năm học</label>

      <input id="editSchoolYear">
    </div>


    <div id="editMessage" class="message"></div>


    <div class="modal-actions">

      <button class="btn btn-gray" onclick="closeEditModal()">
        Hủy
      </button>

      <button class="btn" onclick="updateClass()">
        💾 Lưu thay đổi
      </button>

    </div>

  </div>

</div>


<!-- ======================================
     MODAL HỌC SINH
====================================== -->

<div id="studentsModal" class="modal">

  <div class="modal-box modal-large">

    <div class="modal-header">

      <div>

        <div class="modal-title" id="studentModalTitle">
          👨‍🎓 Học sinh
        </div>

        <div
          id="studentModalCount"
          style="color:#64748b;margin-top:5px">
        </div>

      </div>

      <button class="close-btn" onclick="closeStudentsModal()">
        ×
      </button>

    </div>


    <div style="overflow-x:auto">

      <table>

        <thead>
          <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Mã HS</th>
            <th>Lớp</th>
            <th>Chuyển lớp</th>
          </tr>
        </thead>

        <tbody id="studentTableBody"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

let currentUser = null;
let classes = [];
let students = [];
let currentOpenClass = "";


/* ======================================
   CHUẨN HÓA
====================================== */

function normalizeClass(value) {

  return String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();

}


function normalizeYear(value) {

  return String(value || "")
    .trim()
    .replace(/\s+/g, "");

}


function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ======================================
   KHỞI ĐỘNG
====================================== */

document.addEventListener("DOMContentLoaded", async () => {

  const client = window.supabaseClient;

  if (!client) {

    alert("Không kết nối được Supabase.");

    return;

  }


  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();


  if (userError || !user) {

    window.location.href = "login.html";

    return;

  }


  currentUser = user;


  const {
    data: profile,
    error: profileError
  } = await client
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();


  if (
    profileError ||
    !profile ||
    profile.role !== "teacher"
  ) {

    alert("Bạn không có quyền truy cập trang này.");

    window.location.href = "index.html";

    return;

  }


  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      renderClasses
    );


  await loadData();

});


/* ======================================
   LOAD DỮ LIỆU
====================================== */

async function loadData() {

  const client = window.supabaseClient;


  document.getElementById("loading").style.display = "block";


  const [
    classResult,
    studentResult
  ] = await Promise.all([

    client
      .from("classes")
      .select("id, class_name, school_year, teacher_id, created_at")
      .eq("teacher_id", currentUser.id)
      .order("class_name"),

    client
      .from("profiles")
      .select("id, full_name, student_code, class_name, role")
      .eq("role", "student")
      .order("class_name")
      .order("full_name")

  ]);


  document.getElementById("loading").style.display = "none";


  if (classResult.error) {

    alert(
      "Không tải được lớp học: " +
      classResult.error.message
    );

    return;

  }


  if (studentResult.error) {

    alert(
      "Không tải được học sinh: " +
      studentResult.error.message
    );

    return;

  }


  classes = classResult.data || [];

  students = studentResult.data || [];


  updateStatistics();

  renderClasses();

}


/* ======================================
   THỐNG KÊ
====================================== */

function getStudentCount(className) {

  const name = normalizeClass(className);

  return students.filter(
    student =>
      normalizeClass(student.class_name) === name
  ).length;

}


function updateStatistics() {

  const totalClasses = classes.length;

  const totalStudents = students.length;

  const average =
    totalClasses > 0
      ? (totalStudents / totalClasses).toFixed(1)
      : "0";


  document.getElementById("totalClasses").textContent =
    totalClasses;

  document.getElementById("totalStudents").textContent =
    totalStudents;

  document.getElementById("averageStudents").textContent =
    average;

}


/* ======================================
   HIỂN THỊ LỚP
====================================== */

function renderClasses() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toUpperCase();


  const grid =
    document.getElementById("classGrid");


  grid.innerHTML = "";


  const filtered =
    classes.filter(item => {

      const text =
        (
          String(item.class_name || "") +
          " " +
          String(item.school_year || "")
        ).toUpperCase();

      return text.includes(search);

    });


  if (filtered.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        Không tìm thấy lớp học.
      </div>
    `;

    return;

  }


  filtered.forEach(item => {

    const className =
      normalizeClass(item.class_name);

    const count =
      getStudentCount(className);


    const card =
      document.createElement("div");

    card.className = "class-card";


    const icon =
      document.createElement("div");

    icon.className = "class-icon";
    icon.textContent = "🏫";


    const name =
      document.createElement("div");

    name.className = "class-name";
    name.textContent = className;


    const year =
      document.createElement("div");

    year.className = "school-year";
    year.textContent =
      "📅 Năm học: " +
      (item.school_year || "Chưa cập nhật");


    const countDiv =
      document.createElement("div");

    countDiv.className = "student-count";
    countDiv.textContent =
      "👨‍🎓 " +
      count +
      " học sinh";


    const actions =
      document.createElement("div");

    actions.className = "card-actions";


    const viewButton =
      document.createElement("button");

    viewButton.className = "view-btn";
    viewButton.textContent = "👨‍🎓 Xem";

    viewButton.onclick = () =>
      openStudentsModal(className);


    const editButton =
      document.createElement("button");

    editButton.className = "edit-btn";
    editButton.textContent = "✏️ Sửa";

    editButton.onclick = () =>
      openEditModal(item);


    const deleteButton =
      document.createElement("button");

    deleteButton.className = "delete-btn";
    deleteButton.textContent = "🗑️ Xóa";

    deleteButton.onclick = () =>
      deleteClass(item);


    actions.appendChild(viewButton);
    actions.appendChild(editButton);
    actions.appendChild(deleteButton);

    card.appendChild(icon);
    card.appendChild(name);
    card.appendChild(year);
    card.appendChild(countDiv);
    card.appendChild(actions);

    grid.appendChild(card);

  });

}


/* ======================================
   THÊM LỚP
====================================== */

function openAddModal() {

  document.getElementById("newClassName").value = "";

  document.getElementById("newSchoolYear").value =
    "2026-2027";

  document.getElementById("addMessage").textContent = "";

  document.getElementById("addModal").style.display =
    "flex";

}


function closeAddModal() {

  document.getElementById("addModal").style.display =
    "none";

}


async function createClass() {

  const className =
    normalizeClass(
      document.getElementById("newClassName").value
    );

  const schoolYear =
    normalizeYear(
      document.getElementById("newSchoolYear").value
    );

  const message =
    document.getElementById("addMessage");


  if (!className) {

    message.style.color = "#dc2626";

    message.textContent =
      "Vui lòng nhập tên lớp.";

    return;

  }


  if (!schoolYear) {

    message.style.color = "#dc2626";

    message.textContent =
      "Vui lòng nhập năm học.";

    return;

  }


  message.style.color = "#2563eb";
  message.textContent = "Đang tạo lớp...";


  const {
    error
  } = await window.supabaseClient
    .from("classes")
    .insert({
      class_name: className,
      school_year: schoolYear,
      teacher_id: currentUser.id
    });


  if (error) {

    message.style.color = "#dc2626";

    if (
      error.code === "23505" ||
      String(error.message).includes("duplicate")
    ) {

      message.textContent =
        "Lớp " +
        className +
        " đã tồn tại.";

    } else {

      message.textContent =
        "Không tạo được lớp: " +
        error.message;

    }

    return;

  }


  closeAddModal();

  await loadData();

}


/* ======================================
   SỬA LỚP
====================================== */

function openEditModal(item) {

  document.getElementById("editClassId").value =
    item.id;

  document.getElementById("oldClassName").value =
    normalizeClass(item.class_name);

  document.getElementById("editClassName").value =
    normalizeClass(item.class_name);

  document.getElementById("editSchoolYear").value =
    item.school_year || "";

  document.getElementById("editMessage").textContent =
    "";

  document.getElementById("editModal").style.display =
    "flex";

}


function closeEditModal() {

  document.getElementById("editModal").style.display =
    "none";

}


async function updateClass() {

  const id =
    document.getElementById("editClassId").value;

  const oldName =
    normalizeClass(
      document.getElementById("oldClassName").value
    );

  const newName =
    normalizeClass(
      document.getElementById("editClassName").value
    );

  const schoolYear =
    normalizeYear(
      document.getElementById("editSchoolYear").value
    );

  const message =
    document.getElementById("editMessage");


  if (!newName || !schoolYear) {

    message.style.color = "#dc2626";

    message.textContent =
      "Vui lòng nhập đầy đủ thông tin.";

    return;

  }


  message.style.color = "#2563eb";

  message.textContent =
    "Đang cập nhật...";


  /* CẬP NHẬT BẢNG CLASSES */

  const {
    error: classError
  } = await window.supabaseClient
    .from("classes")
    .update({
      class_name: newName,
      school_year: schoolYear
    })
    .eq("id", id)
    .eq("teacher_id", currentUser.id);


  if (classError) {

    message.style.color = "#dc2626";

    if (classError.code === "23505") {

      message.textContent =
        "Tên lớp này đã tồn tại.";

    } else {

      message.textContent =
        "Không sửa được lớp: " +
        classError.message;

    }

    return;

  }


  /* NẾU ĐỔI TÊN LỚP
     CẬP NHẬT HỌC SINH THEO */

  if (oldName !== newName) {

    const {
      error: studentError
    } = await window.supabaseClient
      .from("profiles")
      .update({
        class_name: newName
      })
      .eq("role", "student")
      .eq("class_name", oldName);


    if (studentError) {

      message.style.color = "#dc2626";

      message.textContent =
        "Đã sửa tên lớp nhưng chưa cập nhật được học sinh: " +
        studentError.message;

      return;

    }

  }


  closeEditModal();

  await loadData();

}


/* ======================================
   XÓA LỚP
====================================== */

async function deleteClass(item) {

  const className =
    normalizeClass(item.class_name);

  const count =
    getStudentCount(className);


  if (count > 0) {

    alert(
      "⚠️ Lớp " +
      className +
      " đang có " +
      count +
      " học sinh.\n\n" +
      "Hãy chuyển học sinh sang lớp khác trước khi xóa."
    );

    return;

  }


  const confirmed =
    confirm(
      "Bạn có chắc muốn xóa lớp " +
      className +
      "?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await window.supabaseClient
    .from("classes")
    .delete()
    .eq("id", item.id)
    .eq("teacher_id", currentUser.id);


  if (error) {

    alert(
      "❌ Không xóa được lớp: " +
      error.message
    );

    return;

  }


  await loadData();

}


/* ======================================
   XEM HỌC SINH
====================================== */

function openStudentsModal(className) {

  currentOpenClass =
    normalizeClass(className);


  document.getElementById("studentModalTitle").textContent =
    "👨‍🎓 Lớp " +
    currentOpenClass;


  renderStudentsInClass();


  document.getElementById("studentsModal").style.display =
    "flex";

}


function closeStudentsModal() {

  document.getElementById("studentsModal").style.display =
    "none";

  currentOpenClass = "";

}


function renderStudentsInClass() {

  const list =
    students.filter(
      student =>
        normalizeClass(student.class_name) ===
        currentOpenClass
    );


  document.getElementById("studentModalCount").textContent =
    list.length +
    " học sinh";


  const tbody =
    document.getElementById("studentTableBody");


  tbody.innerHTML = "";


  if (list.length === 0) {

    const tr =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.colSpan = 5;

    td.style.textAlign = "center";
    td.style.color = "#64748b";
    td.style.padding = "25px";

    td.textContent =
      "Lớp này chưa có học sinh.";

    tr.appendChild(td);
    tbody.appendChild(tr);

    return;

  }


  list.forEach((student, index) => {

    const tr =
      document.createElement("tr");


    const tdIndex =
      document.createElement("td");

    tdIndex.textContent =
      index + 1;


    const tdName =
      document.createElement("td");

    tdName.textContent =
      student.full_name || "";


    const tdCode =
      document.createElement("td");

    tdCode.className =
      "student-code";

    tdCode.textContent =
      student.student_code || "";


    const tdClass =
      document.createElement("td");

    tdClass.textContent =
      normalizeClass(student.class_name);


    const tdMove =
      document.createElement("td");


    const select =
      document.createElement("select");

    select.className =
      "move-select";


    const placeholder =
      document.createElement("option");

    placeholder.value = "";

    placeholder.textContent =
      "Chọn lớp";

    select.appendChild(placeholder);


    classes
      .filter(
        item =>
          normalizeClass(item.class_name) !==
          currentOpenClass
      )
      .forEach(item => {

        const option =
          document.createElement("option");

        option.value =
          normalizeClass(item.class_name);

        option.textContent =
          normalizeClass(item.class_name);

        select.appendChild(option);

      });


    const moveButton =
      document.createElement("button");

    moveButton.className =
      "move-btn";

    moveButton.textContent =
      "Chuyển";


    moveButton.onclick =
      () =>
        moveStudent(
          student,
          select.value
        );


    tdMove.appendChild(select);

    tdMove.appendChild(
      document.createTextNode(" ")
    );

    tdMove.appendChild(moveButton);


    tr.appendChild(tdIndex);
    tr.appendChild(tdName);
    tr.appendChild(tdCode);
    tr.appendChild(tdClass);
    tr.appendChild(tdMove);

    tbody.appendChild(tr);

  });

}


/* ======================================
   CHUYỂN HỌC SINH
====================================== */

async function moveStudent(
  student,
  targetClass
) {

  targetClass =
    normalizeClass(targetClass);


  if (!targetClass) {

    alert(
      "Vui lòng chọn lớp cần chuyển."
    );

    return;

  }


  const confirmed =
    confirm(
      "Chuyển học sinh " +
      (student.full_name || "") +
      " sang lớp " +
      targetClass +
      "?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await window.supabaseClient
    .from("profiles")
    .update({
      class_name: targetClass
    })
    .eq("id", student.id)
    .eq("role", "student");


  if (error) {

    alert(
      "❌ Không chuyển được học sinh: " +
      error.message
    );

    return;

  }


  alert(
    "✅ Đã chuyển " +
    (student.full_name || "học sinh") +
    " sang lớp " +
    targetClass +
    "."
  );


  await loadData();


  if (currentOpenClass) {

    renderStudentsInClass();

  }

}

].forEach(id => {

  modal.addEventListener(
