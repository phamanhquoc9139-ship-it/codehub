<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Làm Quiz</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-4xl mx-auto p-6"><div class="bg-white rounded-2xl shadow p-6"><div class="flex justify-between gap-3"><div><h1 id="title" class="text-3xl font-bold">Quiz</h1><p id="desc" class="text-slate-500"></p></div><div id="timer" class="font-bold text-red-600 text-xl"></div></div><form id="f" class="mt-6 space-y-5"></form><button id="submitBtn" class="mt-6 w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Nộp bài</button><div id="result" class="hidden mt-6 p-5 rounded-xl bg-emerald-50 text-emerald-800"></div></div></main>
<script>const s=window.supabaseClient,qid=new URLSearchParams(location.search).get('quiz');let me,qs=[],seconds=0,tick,submitted=false;
async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href='login.html';let q=await s.from('quizzes').select('*').eq('id',qid).eq('is_published',true).single();if(q.error)return document.body.innerHTML='<p class="p-8">Không có quyền mở Quiz này.</p>';title.textContent=q.data.title;desc.textContent=q.data.description||'';seconds=(q.data.time_limit||15)*60;let r=await s.from('quiz_questions').select('*').eq('quiz_id',qid).order('question_order');qs=r.data||[];render();clock();}
function render(){f.innerHTML=qs.map((q,i)=>`<div class="border rounded-xl p-4"><b>Câu ${i+1}. ${q.question_text}</b>${['A','B','C','D'].map(k=>`<label class="block mt-3 p-2 border rounded-lg cursor-pointer"><input type="radio" name="q_${q.id}" value="${k}" class="mr-2"> ${k}. ${q['option_'+k.toLowerCase()]}</label>`).join('')}</div>`).join('')||'<p>Quiz chưa có câu hỏi.</p>';}
function clock(){let paint=()=>{timer.textContent=`⏱ ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds--<=0)submit();};paint();tick=setInterval(paint,1000);}
async function submit(){if(submitted)return;submitted=true;clearInterval(tick);submitBtn.disabled=true;let answers=qs.map(q=>{let el=document.querySelector(`input[name="q_${q.id}"]:checked`);let sel=el?el.value:null;return{q,sel,ok:sel===q.correct_answer}});let correct=answers.filter(x=>x.ok).length,total=qs.length,score=total?Math.round(correct*10000/total)/100:0;let a=await s.from('quiz_attempts').insert({quiz_id:qid,student_id:me.id,score,correct_count:correct,total_questions:total}).select('id').single();if(a.error){submitted=false;submitBtn.disabled=false;return alert(a.error.message)};if(total){let rows=answers.map(x=>({attempt_id:a.data.id,question_id:x.q.id,selected_answer:x.sel,is_correct:x.ok}));let z=await s.from('quiz_answers').insert(rows);if(z.error)return alert(z.error.message);}result.classList.remove('hidden');result.innerHTML=`<div class="text-2xl font-bold">Điểm: ${score}/100</div><div>Đúng ${correct}/${total} câu.</div><a class="inline-block mt-3 underline" href="student-quizzes.html">← Quay lại danh sách</a>`;window.scrollTo(0,document.body.scrollHeight);}
submitBtn.onclick=submit;init();</script></body></html>
