<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả bài kiểm tra | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head>
<body class="bg-slate-50"><main class="max-w-4xl mx-auto p-5"><div class="flex justify-between gap-3 mb-5"><div><h1 id="h" class="text-3xl font-bold">📊 Kết quả của em</h1><p id="summary" class="text-slate-500"></p></div><a href="student-quizzes-v4.html" class="border px-4 py-2 rounded-xl h-fit">← Bài kiểm tra</a></div><div id="list" class="space-y-4"></div></main>
<script>
const s=window.supabaseClient,$=x=>document.getElementById(x),aid=new URLSearchParams(location.search).get("assignment");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function init(){let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";let p=await s.from("profiles").select("role").eq("id",u.id).single();if(p.data?.role!=="student")return location.href="teacher.html";let ar=await s.from("quiz_assignments").select("quiz_id,show_result,quizzes(title)").eq("id",aid).single();if(ar.error||!ar.data)return location.href="student-quizzes-v4.html";if(!ar.data.show_result){alert("Giáo viên chưa cho phép xem kết quả chi tiết.");return location.href="student-quizzes-v4.html"}let at=await s.from("quiz_attempts").select("score,correct_count,total_questions,answers,submitted_at").eq("assignment_id",aid).eq("student_id",u.id).order("submitted_at",{ascending:false}).limit(1).maybeSingle();if(!at.data){alert("Chưa có bài đã nộp.");return location.href="student-quizzes-v4.html"}let q=await s.from("quiz_questions").select("*").eq("quiz_id",ar.data.quiz_id).order("question_order");h.textContent="📊 "+(ar.data.quizzes?.title||"Kết quả");summary.textContent=`Điểm ${at.data.score}/10 • Đúng ${at.data.correct_count}/${at.data.total_questions} • Nộp ${new Date(at.data.submitted_at).toLocaleString("vi-VN")}`;let ans=at.data.answers||{};list.innerHTML=(q.data||[]).map((x,i)=>{let mine=ans[x.id]||"—",ok=mine===x.correct_answer;let opts={A:x.option_a,B:x.option_b,C:x.option_c,D:x.option_d};return`<section class="bg-white shadow rounded-2xl p-5 border-l-4 ${ok?"border-emerald-500":"border-red-500"}"><div class="font-bold text-lg">Câu ${i+1}. ${esc(x.question_text)}</div><div class="mt-3 space-y-1">${["A","B","C","D"].map(k=>`<div class="${k===x.correct_answer?"font-bold text-emerald-700":k===mine&&!ok?"font-bold text-red-600":""}">${k}. ${esc(opts[k])}</div>`).join("")}</div><div class="mt-3 ${ok?"text-emerald-700":"text-red-600"} font-bold">${ok?"✓ Đúng":"✗ Sai"} • Em chọn: ${mine} • Đáp án đúng: ${x.correct_answer}</div>${x.explanation?`<div class="mt-2 bg-slate-50 rounded-xl p-3"><b>Giải thích:</b> ${esc(x.explanation)}</div>`:""}</section>`}).join("")}
init();</script></body></html>
