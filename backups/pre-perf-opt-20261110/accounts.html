<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | CodeHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{padding:18px 28px;background:#fff;display:flex;justify-content:space-between}.logo{font-size:28px;font-weight:800;color:#3182f6}.btn{border:0;border-radius:10px;padding:12px 16px;background:#3182f6;color:#fff;font-weight:700;cursor:pointer;margin-left:6px}.green{background:#059669}.wrap{max-width:1400px;margin:35px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px #0000000d}.card b{font-size:34px;color:#2563eb}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}input{flex:1;min-width:240px}table{width:100%;border-collapse:collapse}th{background:#eef5ff;text-align:left;padding:13px}td{padding:13px;border-bottom:1px solid #e5e7eb}.badge{padding:5px 10px;border-radius:99px;background:#e8f1ff;color:#2563eb;font-weight:700}#err{display:none;background:#fee2e2;color:#b91c1c;padding:14px;border-radius:10px;margin-bottom:15px}.note{color:#64748b;font-size:13px}@media(max-width:800px){.stats{grid-template-columns:1fr}.panel{overflow:auto}}</style></head>
<body><header><div class="logo">&lt;/&gt; CodeHub</div><div><button class="btn" onclick="location.href='teacher.html'">← Quản trị</button><button class="btn" onclick="logout()">Đăng xuất</button></div></header>
<main class="wrap"><h1>👥 Quản lý tài khoản</h1><p>Chỉ Admin được xem toàn bộ tài khoản giáo viên và học sinh.</p>
<div class="stats"><div class="card">Tất cả<br><b id="a">0</b></div><div class="card">Giáo viên<br><b id="t">0</b></div><div class="card">Học sinh<br><b id="s">0</b></div></div><div id="err"></div>
<div class="panel"><div class="tools"><input id="q" placeholder="🔎 Tìm họ tên, mã, email, lớp..." oninput="render()"><select id="r" onchange="render()"><option value="">Tất cả vai trò</option><option value="admin">Admin</option><option value="teacher">Giáo viên</option><option value="student">Học sinh</option></select><button class="btn green" onclick="excel()">📥 Xuất Excel</button><button class="btn" onclick="load()">↻ Làm mới</button></div>
<div id="loading">Đang tải...</div><table id="tbl" style="display:none"><thead><tr><th>STT</th><th>Họ tên</th><th>Mã</th><th>Email</th><th>Lớp</th><th>Vai trò</th><th>Ngày tạo</th></tr></thead><tbody id="body"></tbody></table><p class="note">🔐 Không đọc/xuất mật khẩu hiện tại.</p></div></main>
<script>let rows=[];const E=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
async function load(){try{err.style.display="none";loading.style.display="block";tbl.style.display="none";const c=window.supabaseClient;const {data:{user}}=await c.auth.getUser();if(!user){location.href="login.html";return}const {data:p}=await c.from("profiles").select("role").eq("id",user.id).maybeSingle();if(p?.role!=="admin")throw Error("Trang này chỉ dành cho Admin.");const {data:{session}}=await c.auth.getSession();const {data,error}=await c.functions.invoke("admin-accounts",{headers:{Authorization:`Bearer ${session.access_token}`}});if(error)throw error;if(!data?.success)throw Error(data?.error||"Không tải được tài khoản");rows=data.accounts||[];a.textContent=rows.length;t.textContent=rows.filter(x=>["admin","teacher"].includes(x.role)).length;s.textContent=rows.filter(x=>x.role==="student").length;loading.style.display="none";tbl.style.display="table";render()}catch(e){loading.style.display="none";err.textContent="❌ "+e.message;err.style.display="block"}}
function F(){let z=q.value.toLowerCase(),v=r.value;return rows.filter(x=>(!v||x.role===v)&&(!z||[x.full_name,x.code,x.email,x.class_name].join(" ").toLowerCase().includes(z)))}function render(){body.innerHTML=F().map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.full_name)}</td><td>${E(x.code)}</td><td>${E(x.email)}</td><td>${E(x.class_name)}</td><td><span class="badge">${E(x.role)}</span></td><td>${x.created_at?new Date(x.created_at).toLocaleString("vi-VN"):""}</td></tr>`).join("")}
function excel(){let d=F().map((x,i)=>({"STT":i+1,"Họ và tên":x.full_name||"","Mã":x.code||"","Vai trò":x.role||"","Email đăng nhập":x.email||"","Lớp":x.class_name||"","Ngày tạo":x.created_at?new Date(x.created_at).toLocaleString("vi-VN"):""}));if(!d.length)return alert("Không có dữ liệu");let ws=XLSX.utils.json_to_sheet(d),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Tai khoan");XLSX.writeFile(wb,"CodeHub_TaiKhoan.xlsx")}async function logout(){await window.supabaseClient.auth.signOut();location.href="login.html"}document.addEventListener("DOMContentLoaded",load);</script></body></html>
