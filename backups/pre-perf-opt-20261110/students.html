<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học sinh | CodeHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #3182f6;
    }

    .btn {
      border: 0;
      background: #3182f6;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      margin-left: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 18px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      overflow-x: auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .count {
      color: #64748b;
      font-size: 18px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search-row input,
    .search-row select {
      padding: 13px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    #searchInput { flex: 1; }
    #classFilter { min-width: 160px; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #eef5ff;
      text-align: left;
      padding: 16px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover { background: #f8fafc; }

    .badge {
      display: inline-block;
      background: #e8f1ff;
      color: #2563eb;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .action-btn {
      border: 0;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      margin: 3px;
    }

    .edit-btn { background: #e8f1ff; color: #2563eb; }
    .password-btn { background: #fff0bd; color: #a54b00; }
    .delete-btn { background: #ffe0e0; color: #dc2626; }

    #loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    #error {
      display: none;
      color: #dc2626;
      padding: 15px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: min(560px, 95%);
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-box h2 { margin-bottom: 20px; }

    .modal-box label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .modal-box input,
    .modal-box select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-save, .btn-cancel {
      border: 0;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-save { background: #3182f6; color: white; }
    .btn-cancel { background: #e2e8f0; color: #334155; }

    .message {
      margin-top: 15px;
      min-height: 20px;
    }

    @media(max-width: 750px) {
      header { padding: 15px; }
      header { flex-direction: column; gap: 12px; }
      .container { margin-top: 25px; }
      .search-row { flex-direction: column; }
      .top-row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">&lt;/&gt; CodeHub</div>

  <div>
    <button class="btn" onclick="goTeacher()">← Quản trị</button>
    <button class="btn" onclick="goHome()">Trang chủ</button>
    <button class="btn" onclick="logout()">Đăng xuất</button>
  </div>
</header>

<main class="container">

  <h1>👨‍🎓 Quản lý học sinh</h1>
  <p class="subtitle">Danh sách học sinh trên hệ thống CodeHub</p>

  <div class="box">

    <div class="top-row">
      <div id="studentCount" class="count"></div>
      <button class="btn" onclick="openAddModal()">+ Thêm học sinh</button>
    </div>

    <div class="search-row">
      <input id="searchInput"
             placeholder="🔎 Tìm theo họ tên hoặc mã học sinh...">

      <select id="classFilter">
        <option value="">Tất cả lớp</option>
      </select>
    </div>

    <div id="loading">Đang tải danh sách học sinh...</div>
    <div id="error"></div>

    <table id="studentTable" style="display:none">
      <thead>
        <tr>
          <th>STT</th>
          <th>Họ và tên</th>
          <th>Mã học sinh</th>
          <th>Lớp</th>
          <th>Vai trò</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="studentList"></tbody>
    </table>

  </div>
</main>

<!-- THÊM HỌC SINH -->
<div id="addModal" class="modal">
  <div class="modal-box">
    <h2>👨‍🎓 Thêm học sinh</h2>

    <label>Họ và tên</label>
    <input id="addFullName" placeholder="Ví dụ: Nguyễn Văn Bình">

    <label>Mã học sinh</label>
    <input id="addStudentCode" placeholder="Ví dụ: HS002">

    <label>Lớp</label>
    <select id="addClassName"><option value="">-- Chọn lớp --</option></select>

    <label>Email đăng nhập</label>
    <input id="addEmail" type="email"
           placeholder="Ví dụ: hocsinh02@codehub.vn">

    <label>Mật khẩu</label>
    <input id="addPassword" type="password"
           placeholder="Tối thiểu 6 ký tự">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('addModal')">Hủy</button>
      <button class="btn-save" onclick="createStudent()">Tạo tài khoản</button>
    </div>

    <div id="addMessage" class="message"></div>
  </div>
</div>

<!-- SỬA -->
<div id="editModal" class="modal">
  <div class="modal-box">
    <h2>✏️ Sửa học sinh</h2>

    <input id="editStudentId" type="hidden">

    <label>Họ và tên</label>
    <input id="editFullName">

    <label>Mã học sinh</label>
    <input id="editStudentCode">

    <label>Lớp</label>
    <select id="editClassName"><option value="">-- Chọn lớp --</option></select>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('editModal')">Hủy</button>
      <button class="btn-save" onclick="updateStudent()">Lưu thay đổi</button>
    </div>

    <div id="editMessage" class="message"></div>
  </div>
</div>

<!-- PASSWORD -->
<div id="passwordModal" class="modal">
  <div class="modal-box">
    <h2>🔑 Đổi mật khẩu</h2>

    <input id="passwordStudentId" type="hidden">

    <p id="passwordStudentName" style="margin-bottom:15px"></p>

    <label>Mật khẩu mới</label>
    <input id="newPassword" type="password"
           placeholder="Tối thiểu 6 ký tự">

    <div class="modal-actions">
      <button class="btn-cancel"
              onclick="closeModal('passwordModal')">Hủy</button>
      <button class="btn-save"
              onclick="resetPassword()">Đổi mật khẩu</button>
    </div>

    <div id="passwordMessage" class="message"></div>
  </div>
</div>

<script>
const CREATE_FUNCTION =
  "https://drfcejvmyhzorwepndta.supabase.co/functions/v1/create-student";

const MANAGE_FUNCTION =
  "https://drfcejvmyhzorwepndta.supabase.co/functions/v1/manage-student";

let students = [];
let availableClasses = [];

/* ================================
   CHUẨN HÓA DỮ LIỆU
================================ */

function normalizeSpaces(text) {
  return String(text || "").trim().replace(/\s+/g, " ");
}

function normalizeName(name) {
  return normalizeSpaces(name)
    .toLocaleLowerCase("vi-VN")
    .split(" ")
    .map(word =>
      word ? word.charAt(0).toLocaleUpperCase("vi-VN") + word.slice(1) : ""
    )
    .join(" ");
}

function normalizeCode(code) {
  return normalizeSpaces(code).toUpperCase();
}

function normalizeClass(className) {
  return normalizeSpaces(className).toUpperCase();
}

function escapeHTML(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ================================
   LOAD
================================ */

document.addEventListener("DOMContentLoaded", async () => {
  const client = window.supabaseClient;

  if (!client) {
    showError("Không kết nối được Supabase.");
    return;
  }

  const { data: { user } } = await client.auth.getUser();

  if (!user) {
    location.href = "login.html";
    return;
  }

  const { data: profile } = await client
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  const currentRole = String(profile?.role || "").trim().toLowerCase();

  if (!profile || !["teacher", "admin"].includes(currentRole)) {
    showError("Bạn không có quyền truy cập.");
    return;
  }

  await loadClasses();
  await loadStudents();

  document.getElementById("searchInput")
    .addEventListener("input", renderStudents);

  document.getElementById("classFilter")
    .addEventListener("change", renderStudents);
});


async function loadClasses() {
  const { data, error } = await window.supabaseClient
    .from("classes")
    .select("id, class_name, school_year")
    .order("class_name");

  if (error) {
    showError("Không tải được danh sách lớp: " + error.message);
    return;
  }

  availableClasses = (data || [])
    .map(item => ({ ...item, class_name: normalizeClass(item.class_name) }))
    .filter(item => item.class_name);

  fillClassSelect("addClassName");
  fillClassSelect("editClassName");
}

function fillClassSelect(selectId, selectedValue = "") {
  const select = document.getElementById(selectId);
  if (!select) return;

  const selected = normalizeClass(selectedValue);
  select.innerHTML = '<option value="">-- Chọn lớp --</option>';

  availableClasses.forEach(item => {
    const option = document.createElement("option");
    option.value = item.class_name;
    option.textContent = item.class_name + (item.school_year ? ` (${item.school_year})` : "");
    option.selected = item.class_name === selected;
    select.appendChild(option);
  });
}

async function loadStudents() {
  const { data, error } = await window.supabaseClient
    .from("profiles")
    .select("id, full_name, student_code, class_name, role")
    .eq("role", "student")
    .order("class_name")
    .order("full_name");

  document.getElementById("loading").style.display = "none";

  if (error) {
    showError(error.message);
    return;
  }

  students = data || [];

  buildClassFilter();
  renderStudents();
}

function buildClassFilter() {
  const select = document.getElementById("classFilter");
  const oldValue = select.value;

  const classNames = availableClasses.length
    ? availableClasses.map(item => item.class_name)
    : [...new Set(students.map(s => normalizeClass(s.class_name)).filter(Boolean))].sort();

  select.innerHTML = '<option value="">Tất cả lớp</option>';

  classNames.forEach(cls => {
    const option = document.createElement("option");
    option.value = cls;
    option.textContent = cls;
    select.appendChild(option);
  });

  if (classNames.includes(oldValue)) select.value = oldValue;
}

function renderStudents() {
  const search =
    normalizeSpaces(document.getElementById("searchInput").value)
      .toLocaleLowerCase("vi-VN");

  const classValue =
    document.getElementById("classFilter").value;

  const filtered = students.filter(student => {
    const name =
      normalizeSpaces(student.full_name)
        .toLocaleLowerCase("vi-VN");

    const code =
      normalizeCode(student.student_code)
        .toLocaleLowerCase("vi-VN");

    const cls = normalizeClass(student.class_name);

    const matchesSearch =
      !search || name.includes(search) || code.includes(search);

    const matchesClass =
      !classValue || cls === classValue;

    return matchesSearch && matchesClass;
  });

  document.getElementById("studentCount").textContent =
    `Tổng số học sinh: ${students.length}`;

  const tbody = document.getElementById("studentList");
  tbody.innerHTML = "";

  filtered.forEach((student, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeHTML(student.full_name || "")}</td>
      <td>${escapeHTML(student.student_code || "")}</td>
      <td>${escapeHTML(student.class_name || "")}</td>

      <td>
        <span class="badge">Học sinh</span>
      </td>

      <td>
        <button class="action-btn edit-btn"
                onclick="openEditModal('${student.id}')">
          ✏️ Sửa
        </button>

        <button class="action-btn password-btn"
                onclick="openPasswordModal('${student.id}')">
          🔑 Mật khẩu
        </button>

        <button class="action-btn delete-btn"
                onclick="deleteStudent('${student.id}')">
          🗑️ Xóa
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("studentTable").style.display = "table";
}

/* ================================
   MODAL
================================ */

function openAddModal() {
  document.getElementById("addMessage").textContent = "";
  document.getElementById("addFullName").value = "";
  document.getElementById("addStudentCode").value = "";
  document.getElementById("addEmail").value = "";
  document.getElementById("addPassword").value = "";
  fillClassSelect("addClassName");
  document.getElementById("addModal").style.display = "flex";
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

/* ================================
   TOKEN
================================ */

async function getAccessToken() {
  const { data, error } =
    await window.supabaseClient.auth.getSession();

  if (error || !data.session) {
    throw new Error("Phiên đăng nhập đã hết hạn.");
  }

  return data.session.access_token;
}

/* ================================
   THÊM
================================ */

async function createStudent() {
  const message = document.getElementById("addMessage");

  const fullName =
    normalizeName(document.getElementById("addFullName").value);

  const studentCode =
    normalizeCode(document.getElementById("addStudentCode").value);

  const className =
    normalizeClass(document.getElementById("addClassName").value);

  const email =
    document.getElementById("addEmail").value.trim().toLowerCase();

  const password =
    document.getElementById("addPassword").value;

  if (!fullName || !studentCode || !className || !email || !password) {
    message.textContent = "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "⚠️ Mật khẩu phải có ít nhất 6 ký tự.";
    return;
  }

  // Kiểm tra mã HS đang có trên danh sách hiện tại
  if (students.some(s =>
      normalizeCode(s.student_code) === studentCode)) {
    message.textContent = "❌ Mã học sinh đã tồn tại.";
    return;
  }

  try {
    message.textContent = "Đang tạo tài khoản...";

    const token = await getAccessToken();

    const response = await fetch(CREATE_FUNCTION, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        fullName,
        studentCode,
        className,
        email,
        password
      })
    });

    const rawText = await response.text();
    let result = {};

    try {
      result = rawText ? JSON.parse(rawText) : {};
    } catch {
      throw new Error("Edge Function create-student trả về dữ liệu không hợp lệ.");
    }

    if (!response.ok) {
      if (result.error === "Thiếu ID học sinh.") {
        throw new Error(
          "Edge Function create-student đang dùng nhầm mã quản lý học sinh. Cần sửa function create-student trên Supabase."
        );
      }
      throw new Error(result.error || "Không tạo được học sinh.");
    }

    message.textContent = "✅ Tạo học sinh thành công.";

    await loadStudents();

    setTimeout(() => {
      closeModal("addModal");

      document.getElementById("addFullName").value = "";
      document.getElementById("addStudentCode").value = "";
      fillClassSelect("addClassName");
      document.getElementById("addEmail").value = "";
      document.getElementById("addPassword").value = "";
    }, 600);

  } catch (error) {
    message.textContent = "❌ " + error.message;
  }
}

/* ================================
   SỬA
================================ */

function openEditModal(studentId) {
  const student = students.find(s => s.id === studentId);

  if (!student) {
    alert("Không tìm thấy học sinh.");
    return;
  }

  // Đây là phần quan trọng:
  // lưu UUID thật vào hidden input
  document.getElementById("editStudentId").value = student.id;

  document.getElementById("editFullName").value =
    student.full_name || "";

  document.getElementById("editStudentCode").value =
    student.student_code || "";

  fillClassSelect("editClassName", student.class_name || "");

  document.getElementById("editMessage").textContent = "";

  document.getElementById("editModal").style.display = "flex";
}

async function updateStudent() {
  const studentId =
    document.getElementById("editStudentId").value.trim();

  const fullName =
    normalizeName(document.getElementById("editFullName").value);

  const studentCode =
    normalizeCode(document.getElementById("editStudentCode").value);

  const className =
    normalizeClass(document.getElementById("editClassName").value);

  const message = document.getElementById("editMessage");

  if (!studentId) {
    message.textContent = "❌ Thiếu ID học sinh.";
    return;
  }

  if (!fullName || !studentCode || !className) {
    message.textContent = "⚠️ Vui lòng nhập đầy đủ thông tin.";
    return;
  }

  // Kiểm tra trùng mã nhưng bỏ qua chính HS đang sửa
  const duplicate = students.some(s =>
    s.id !== studentId &&
    normalizeCode(s.student_code) === studentCode
  );

  if (duplicate) {
    message.textContent = "❌ Mã học sinh đã được sử dụng.";
    return;
  }

  try {
    message.textContent = "Đang lưu...";

    const token = await getAccessToken();

    const response = await fetch(MANAGE_FUNCTION, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        action: "update",
        studentId: studentId,
        fullName: fullName,
        studentCode: studentCode,
        className: className
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Không sửa được học sinh.");
    }

    message.textContent = "✅ Đã cập nhật học sinh.";

    await loadStudents();

    setTimeout(() => {
      closeModal("editModal");
    }, 500);

  } catch (error) {
    message.textContent = "❌ " + error.message;
  }
}

/* ================================
   PASSWORD
================================ */

function openPasswordModal(studentId) {
  const student = students.find(s => s.id === studentId);

  if (!student) return;

  document.getElementById("passwordStudentId").value = student.id;

  document.getElementById("passwordStudentName").textContent =
    `Học sinh: ${student.full_name}`;

  document.getElementById("newPassword").value = "";
  document.getElementById("passwordMessage").textContent = "";

  document.getElementById("passwordModal").style.display = "flex";
}

async function resetPassword() {
  const studentId =
    document.getElementById("passwordStudentId").value.trim();

  const newPassword =
    document.getElementById("newPassword").value;

  const message =
    document.getElementById("passwordMessage");

  if (!studentId) {
    message.textContent = "❌ Thiếu ID học sinh.";
    return;
  }

  if (newPassword.length < 6) {
    message.textContent = "⚠️ Mật khẩu phải có ít nhất 6 ký tự.";
    return;
  }

  try {
    message.textContent = "Đang đổi mật khẩu...";

    const token = await getAccessToken();

    const response = await fetch(MANAGE_FUNCTION, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        action: "reset-password",
        studentId,
        newPassword
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Không đổi được mật khẩu.");
    }

    message.textContent = "✅ Đổi mật khẩu thành công.";

    setTimeout(() => {
      closeModal("passwordModal");
    }, 600);

  } catch (error) {
    message.textContent = "❌ " + error.message;
  }
}

/* ================================
   XÓA
================================ */

async function deleteStudent(studentId) {
  const student = students.find(s => s.id === studentId);

  if (!student) return;

  const ok = confirm(
    `Bạn chắc chắn muốn xóa học sinh "${student.full_name}"?\n\n` +
    `Tài khoản đăng nhập của học sinh cũng sẽ bị xóa.`
  );

  if (!ok) return;

  try {
    const token = await getAccessToken();

    const response = await fetch(MANAGE_FUNCTION, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        action: "delete",
        studentId: student.id
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Không xóa được học sinh.");
    }

    alert("✅ Đã xóa học sinh.");

    await loadStudents();

  } catch (error) {
    alert("❌ " + error.message);
  }
}
