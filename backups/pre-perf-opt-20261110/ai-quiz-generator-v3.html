<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Quiz Generator V3.1 - CodeHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="scripts/supabase-config.js"></script>
<style>.drop.drag{border-color:#7c3aed;background:#f5f3ff}</style></head>
<body class="bg-slate-50 text-slate-900"><main class="max-w-7xl mx-auto p-5">
<div class="flex justify-between gap-4 mb-5"><div><h1 class="text-3xl font-bold">✨ AI Quiz Generator V3.1</h1>
<p class="text-slate-500">Nhiều bài học • PDF/DOCX/TXT • ma trận mức độ • tự thử lại khi Gemini bận</p></div>
<a href="quizzes.html" class="border bg-white rounded-xl px-4 py-2 h-fit">← Quiz</a></div>
<div id="msg" class="hidden mb-4 p-3 rounded-xl"></div>
<div class="grid lg:grid-cols-4 gap-5">
<aside class="bg-white rounded-2xl shadow p-5 space-y-3">
<label class="font-bold block">Khóa học</label><select id="course" class="w-full border rounded-xl p-3"></select>
<label class="font-bold block">Bài học nguồn (chọn nhiều)</label><div id="lessons" class="border rounded-xl p-3 max-h-48 overflow-auto text-sm">Chọn khóa học trước.</div>
<label class="font-bold block">Quiz đích</label><select id="quiz" class="w-full border rounded-xl p-3"></select>
<label class="font-bold block">Số câu</label><select id="count" class="w-full border rounded-xl p-3"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>40</option></select>
<div class="font-bold">Ma trận (%)</div><div class="grid grid-cols-3 gap-2 text-xs"><label>NB<input id="r" type="number" value="40" class="w-full border p-2 rounded"></label><label>TH<input id="u" type="number" value="40" class="w-full border p-2 rounded"></label><label>VD<input id="a" type="number" value="20" class="w-full border p-2 rounded"></label></div>

<div class="pt-2 border-t"><label class="font-bold block mb-2">📎 Tài liệu bổ sung</label>
<div id="drop" class="drop border-2 border-dashed rounded-xl p-4 text-center cursor-pointer">
<div class="font-semibold">Chọn hoặc kéo-thả file</div><div class="text-xs text-slate-500 mt-1">PDF • DOCX • TXT — tối đa 8 file</div>
<input id="files" type="file" multiple accept=".pdf,.docx,.txt,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
</div><div id="fileList" class="space-y-1 mt-2 text-xs"></div></div>

<label class="font-bold block">Hoặc dán văn bản</label><textarea id="extra" rows="5" class="w-full border rounded-xl p-3" placeholder="Ctrl + V nội dung văn bản vào đây..."></textarea>
<button id="generate" class="w-full bg-violet-600 text-white font-bold p-3 rounded-xl">✨ Tạo câu hỏi V3.1</button>
</aside>

<section class="lg:col-span-3"><div class="flex justify-between items-center mb-3"><div><h2 class="text-xl font-bold">Câu hỏi AI đề xuất</h2><div id="stats" class="text-sm text-slate-600"></div></div>
<button id="save" class="hidden bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl">Lưu câu đã chọn vào Quiz</button></div>
<div id="list" class="space-y-4"><div class="bg-white p-8 rounded-2xl text-center text-slate-400">Chọn bài học, tài liệu hoặc dán văn bản để bắt đầu.</div></div></section>
</div></main>

<script type="module">
const s=window.supabaseClient,$=id=>document.getElementById(id); let me,generated=[],fileSources=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function show(t,ok=false){$("msg").className="mb-4 p-3 rounded-xl "+(ok?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-700");$("msg").textContent=t}
async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";let p=await s.from("profiles").select("role").eq("id",me.id).single();if(p.data?.role!=="teacher")return location.href="student-dashboard.html";let c=await s.from("courses").select("id,title").eq("teacher_id",me.id).order("title");$("course").innerHTML='<option value="">-- Chọn khóa học --</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}
$("course").onchange=async()=>{let id=$("course").value;if(!id)return;let [l,q]=await Promise.all([s.from("lessons").select("id,title").eq("course_id",id).order("lesson_order"),s.from("quizzes").select("id,title").eq("course_id",id).eq("teacher_id",me.id)]);$("lessons").innerHTML=(l.data||[]).map(x=>`<label class="block py-1"><input class="lp" type="checkbox" value="${x.id}"> ${esc(x.title)}</label>`).join("")||"Chưa có bài học.";$("quiz").innerHTML='<option value="">-- Chọn Quiz --</option>'+(q.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")};

const drop=$("drop"),inp=$("files"); drop.onclick=()=>inp.click();
["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));
drop.addEventListener("drop",e=>readFiles(e.dataTransfer.files)); inp.onchange=()=>readFiles(inp.files);

async function pdfText(file){
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise; let out=[];
  for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),tc=await page.getTextContent();out.push(tc.items.map(x=>x.str).join(" "))}
  return out.join("\n");
}
async function readOne(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(ext==="txt") return await f.text();
  if(ext==="docx"){let r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value}
  if(ext==="pdf") return await pdfText(f);
  throw Error("Không hỗ trợ "+f.name);
}
async function readFiles(list){
  for(const f of [...list].slice(0,8-fileSources.length)){
    try{show("Đang đọc "+f.name+"...",true);let text=await readOne(f);if(text.trim().length<20)throw Error("Không trích được đủ chữ. PDF có thể là bản scan.");fileSources.push({name:f.name,text:text.slice(0,50000)});}
    catch(e){show(`${f.name}: ${e.message}`)}
  } renderFiles(); if(fileSources.length)show(`Đã đọc ${fileSources.length} tài liệu.`,true);
}
function renderFiles(){$("fileList").innerHTML=fileSources.map((f,i)=>`<div class="flex justify-between bg-slate-50 p-2 rounded"><span>✓ ${esc(f.name)}</span><button data-rm="${i}" class="text-red-600">Xóa</button></div>`).join("");document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{fileSources.splice(+b.dataset.rm,1);renderFiles()})}

$("generate").onclick=async()=>{let ids=[...document.querySelectorAll(".lp:checked")].map(x=>x.value),sum=+$("r").value + +$("u").value + +$("a").value;if(sum!==100)return show("Tổng NB + TH + VD phải bằng 100%.");if(!ids.length&&!fileSources.length&&!$("extra").value.trim())return show("Chọn bài học, tài liệu hoặc dán văn bản nguồn.");let {data:{session}}=await s.auth.getSession();$("generate").disabled=true;$("generate").textContent="AI đang phân tích nguồn...";try{let res=await fetch("https://drfcejvmyhzorwepndta.supabase.co/functions/v1/generate-quiz-ai-v3",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({lessonIds:ids,fileSources,extraText:$("extra").value,count:+$("count").value,ratios:{remember:+$("r").value,understand:+$("u").value,apply:+$("a").value}})});let x=await res.json();if(!res.ok)throw Error(x.error||"Lỗi AI");generated=x.questions||[];render();show(`AI đã tạo ${generated.length} câu bằng ${x.model||"Gemini"}. Hãy duyệt trước khi lưu.`,true)}catch(e){show(e.message)}finally{$("generate").disabled=false;$("generate").textContent="✨ Tạo câu hỏi V3.1"}};

function render(){let c={};generated.forEach(x=>c[x.level]=(c[x.level]||0)+1);$("stats").textContent=`Nhận biết ${c["Nhận biết"]||0} • Thông hiểu ${c["Thông hiểu"]||0} • Vận dụng ${c["Vận dụng"]||0}`;$("save").classList.toggle("hidden",!generated.length);$("list").innerHTML=generated.map((x,i)=>`<div class="bg-white shadow rounded-2xl p-5"><label><input class="pick" data-i="${i}" type="checkbox" checked> <b>Câu ${i+1}</b> • ${esc(x.level)} • ${esc(x.source_title)}</label><textarea class="q w-full border p-2 mt-2 rounded" data-i="${i}">${esc(x.question_text)}</textarea>${["a","b","c","d"].map(k=>`<div class="flex gap-2 mt-2"><b>${k.toUpperCase()}.</b><input class="op w-full border p-2 rounded" data-i="${i}" data-k="${k}" value="${esc(x["option_"+k])}"></div>`).join("")}<div class="mt-2">Đáp án <select class="ans border p-2 rounded" data-i="${i}">${["A","B","C","D"].map(a=>`<option ${a===x.correct_answer?"selected":""}>${a}</option>`).join("")}</select></div><input class="exp w-full border p-2 mt-2 rounded" data-i="${i}" value="${esc(x.explanation)}"><div class="bg-amber-50 p-2 mt-2 text-sm rounded">Căn cứ: ${esc(x.source_evidence)}</div></div>`).join("")}

$("save").onclick=async()=>{if(!$("quiz").value)return show("Chọn Quiz đích.");let ps=[...document.querySelectorAll(".pick:checked")];if(!ps.length)return show("Chưa chọn câu nào.");let ex=await s.from("quiz_questions").select("question_order").eq("quiz_id",$("quiz").value).order("question_order",{ascending:false}).limit(1),st=(ex.data?.[0]?.question_order||0)+1;let rows=ps.map((p,n)=>{let i=+p.dataset.i;return{quiz_id:$("quiz").value,question_text:document.querySelector(`.q[data-i="${i}"]`).value,option_a:document.querySelector(`.op[data-i="${i}"][data-k="a"]`).value,option_b:document.querySelector(`.op[data-i="${i}"][data-k="b"]`).value,option_c:document.querySelector(`.op[data-i="${i}"][data-k="c"]`).value,option_d:document.querySelector(`.op[data-i="${i}"][data-k="d"]`).value,correct_answer:document.querySelector(`.ans[data-i="${i}"]`).value,explanation:document.querySelector(`.exp[data-i="${i}"]`).value,question_order:st+n}});let z=await s.from("quiz_questions").insert(rows);if(z.error)return show(z.error.message);show(`Đã lưu ${rows.length} câu vào Quiz.`,true)};
init();
</script></body></html>
