<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả Quiz V3.7.18 | CodeHub</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-4xl mx-auto p-5"><div class="flex justify-between gap-3 mb-5"><div><h1 id="h" class="text-3xl font-bold">📊 Kết quả của em</h1><p id="summary" class="text-slate-500"></p></div><a href="student-quizzes-v4.html" class="border px-4 py-2 rounded-xl h-fit bg-white">← Bài kiểm tra</a></div><div id="error" class="hidden bg-red-50 text-red-700 p-4 rounded-xl mb-4"></div><div id="list" class="space-y-4"></div></main><script>
const s=window.supabaseClient,$=x=>document.getElementById(x),aid=new URLSearchParams(location.search).get("assignment");const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function init(){try{let u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";let r=await s.rpc("codehub_v3718_student_quiz_result",{p_assignment:aid});if(r.error)throw r.error;let x=r.data||{},ans=x.answers||{},qs=x.questions||[];$("h").textContent="📊 "+(x.title||"Kết quả");$("summary").textContent=`Điểm ${x.score}/10 • Đúng ${x.correct_count}/${x.total_questions} • Nộp ${new Date(x.submitted_at).toLocaleString("vi-VN")}`;$("list").innerHTML=qs.map((q,i)=>{let mine=ans[q.id]||"—",ok=mine===q.correct_answer,opts={A:q.option_a,B:q.option_b,C:q.option_c,D:q.option_d};return `<section class="bg-white shadow rounded-2xl p-5 border-l-4 ${ok?"border-emerald-500":"border-red-500"}"><div class="font-bold text-lg">Câu ${i+1}. ${esc(q.question_text)}</div><div class="mt-3 space-y-1">${["A","B","C","D"].map(k=>`<div class="${k===q.correct_answer?"font-bold text-emerald-700":k===mine&&!ok?"font-bold text-red-600":""}">${k}. ${esc(opts[k])}</div>`).join("")}</div><div class="mt-3 ${ok?"text-emerald-700":"text-red-600"} font-bold">${ok?"✓ Đúng":"✗ Sai"} • Em chọn: ${mine} • Đáp án đúng: ${q.correct_answer}</div>${q.explanation?`<div class="mt-2 bg-slate-50 rounded-xl p-3"><b>Giải thích:</b> ${esc(q.explanation)}</div>`:""}</section>`}).join("")}catch(e){console.error(e);$("error").classList.remove("hidden");$("error").textContent="Không xem được kết quả: "+(e?.message||String(e))}}init();
</script></body></html>
