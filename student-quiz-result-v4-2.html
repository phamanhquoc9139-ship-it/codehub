function sanitizeSvg(raw){const txt=String(raw||"").trim();if(!txt||!/<svg[\s>]/i.test(txt))return"";try{const d=new DOMParser().parseFromString(txt,"image/svg+xml"),svg=d.documentElement;if(!svg||String(svg.nodeName).toLowerCase()!=="svg")return"";const allowed=new Set(["svg","g","line","polyline","polygon","rect","circle","ellipse","path","text","tspan","defs","marker"]),attrs=new Set(["xmlns","viewBox","width","height","x","y","x1","y1","x2","y2","cx","cy","r","rx","ry","d","points","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","font-size","font-family","font-weight","text-anchor","dominant-baseline","transform","marker-start","marker-end","orient","refX","refY","markerWidth","markerHeight"]);[...svg.querySelectorAll("*")].forEach(el=>{if(!allowed.has(el.tagName.toLowerCase())){el.remove();return}[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on")||!attrs.has(a.name)||/url\s*\(|javascript:|https?:|data:/i.test(a.value))el.removeAttribute(a.name)})});[...svg.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on")||!attrs.has(a.name)||/javascript:|https?:|data:/i.test(a.value))svg.removeAttribute(a.name)});svg.setAttribute("xmlns","http://www.w3.org/2000/svg");if(!svg.getAttribute("viewBox")){const w=parseFloat(svg.getAttribute("width")||"800")||800,h=parseFloat(svg.getAttribute("height")||"400")||400;svg.setAttribute("viewBox",`0 0 ${w} ${h}`)}svg.removeAttribute("width");svg.removeAttribute("height");return new XMLSerializer().serializeToString(svg)}catch{return""}}

function normTF(v){const x=norm(v).replaceAll("đ","d");if(["t","true","dung","1","yes","y"].includes(x))return"T";if(["f","false","sai","0","no","n"].includes(x))return"F";return String(v||"").trim().toUpperCase()}

function isCorrect(q,mine){if(q.question_type==="short_answer")return [q.correct_text,...(q.accepted_answers||[])].filter(Boolean).some(a=>norm(a)===norm(mine));if(q.question_type==="true_false")return normTF(mine)===normTF(q.correct_text||q.correct_answer);if(q.question_type==="numeric"){const n=parseNumber(mine),c=Number(q.correct_number),tol=Math.max(0,Number(q.numeric_tolerance)||0);if(!Number.isFinite(n)||!Number.isFinite(c)||Math.abs(n-c)>tol)return false;if(!q.unit_required)return true;const u=extractUnit(mine),ok=[q.answer_unit,...(q.accepted_units||[])].filter(Boolean).map(normUnit);return !!u&&ok.includes(u)}return mine===q.correct_answer}

async function init(){try{const u=(await s.auth.getUser()).data.user;if(!u)return location.href="login.html";const r=await s.rpc("codehub_v3724_student_quiz_result",{p_assignment:aid});if(r.error)throw r.error;const x=r.data||{},ans=x.answers||{},qs=x.questions||[];isEnglish=!!x.is_english;$("h").textContent="📊 "+(x.title||"Kết quả");$("summary").textContent=isEnglish?`Score ${x.score}/10 • Correct ${x.correct_count}/${x.total_questions} • Submitted ${new Date(x.submitted_at).toLocaleString("vi-VN")}`:`Điểm ${x.score}/10 • Đúng ${x.correct_count}/${x.total_questions} • Nộp ${new Date(x.submitted_at).toLocaleString("vi-VN")}`;let h="",lastSec="__",lastStim="__";qs.forEach((q,i)=>{const mine=ans[q.id]||"",sec=q.section_key||q.section_title||"FREE",ok=isCorrect(q,mine);if(sec!==lastSec){h+=`<section class="bg-slate-900 text-white rounded-2xl p-4 mt-6"><div class="font-bold text-lg">${esc(q.section_title||(isEnglish?"QUESTIONS":"PHẦN CÂU HỎI"))}</div>${q.section_instruction?`<div class="text-sm mt-1">${esc(q.section_instruction)}</div>`:""}</section>`;lastSec=sec;lastStim="__"}if(q.stimulus&&q.stimulus!==lastStim){h+=`<section class="bg-blue-50 border border-blue-200 rounded-2xl p-5 whitespace-pre-wrap math-wrap">${esc(q.stimulus)}</section>`;lastStim=q.stimulus}let body="";if(q.question_type==="mcq4"){const opts={A:q.option_a,B:q.option_b,C:q.option_c,D:q.option_d};body=`<div class="mt-3 space-y-1">${["A","B","C","D"].map(k=>`<div class="${k===q.correct_answer?"font-bold text-emerald-700":k===mine&&!ok?"font-bold text-red-600":""}">${k}. ${esc(opts[k])}</div>`).join("")}</div>`}else if(q.question_type==="true_false"){body=`<div class="mt-3 grid grid-cols-2 gap-2"><div class="border rounded-xl p-2 ${normTF(q.correct_text||q.correct_answer)==="T"?"font-bold text-emerald-700":""}">${isEnglish?"True":"Đúng"}</div><div class="border rounded-xl p-2 ${normTF(q.correct_text||q.correct_answer)==="F"?"font-bold text-emerald-700":""}">${isEnglish?"False":"Sai"}</div></div>`}h+=`<
