<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Quiz V3</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/supabase-config.js"></script></head><body class="bg-slate-50"><main class="max-w-7xl mx-auto p-6"><h1 class="text-3xl font-bold">✨ AI Quiz Generator V3</h1><p class="text-slate-500 mb-5">Nhiều bài học • ma trận mức độ • chống trùng • văn bản bổ sung</p><div id="msg" class="hidden p-3 mb-4 rounded-xl"></div><div class="grid lg:grid-cols-4 gap-5"><aside class="bg-white p-5 rounded-2xl shadow space-y-3"><b>Khóa học</b><select id="course" class="w-full border p-3 rounded-xl"></select><b>Bài học nguồn (chọn nhiều)</b><div id="lessons" class="border p-3 rounded-xl max-h-52 overflow-auto">Chọn khóa học.</div><b>Quiz đích</b><select id="quiz" class="w-full border p-3 rounded-xl"></select><b>Số câu</b><select id="count" class="w-full border p-3 rounded-xl"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>40</option></select><b>Ma trận (%)</b><div class="grid grid-cols-3 gap-2"><label>NB<input id="r" value="40" type="number" class="w-full border p-2"></label><label>TH<input id="u" value="40" type="number" class="w-full border p-2"></label><label>VD<input id="a" value="20" type="number" class="w-full border p-2"></label></div><b>Văn bản bổ sung</b><textarea id="extra" rows="5" class="w-full border p-3 rounded-xl" placeholder="Dán nội dung PDF/DOCX hoặc tài liệu khác..."></textarea><button id="gen" class="w-full bg-violet-600 text-white p-3 rounded-xl font-bold">✨ Tạo câu hỏi V3</button></aside><section class="lg:col-span-3"><div class="flex justify-between"><h2 class="text-xl font-bold mb-3">Câu hỏi AI đề xuất</h2><button id="save" class="hidden bg-emerald-600 text-white px-4 py-2 rounded-xl">Lưu vào Quiz</button></div><div id="stats" class="mb-3"></div><div id="list" class="space-y-4"></div></section></div></main><script>
const s=window.supabaseClient,$=x=>document.getElementById(x);let me,qs=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(t,ok=false){$("msg").className="p-3 mb-4 rounded-xl "+(ok?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-700");$("msg").textContent=t}
async function init(){me=(await s.auth.getUser()).data.user;if(!me)return location.href="login.html";let p=await s.from("profiles").select("role").eq("id",me.id).single();if(p.data?.role!=="teacher")return location.href="student-dashboard.html";let c=await s.from("courses").select("id,title").eq("teacher_id",me.id).order("title");$("course").innerHTML='<option value="">-- Chọn --</option>'+(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}
$("course").onchange=async()=>{let id=$("course").value,[l,q]=await Promise.all([s.from("lessons").select("id,title").eq("course_id",id).order("lesson_order"),s.from("quizzes").select("id,title").eq("course_id",id).eq("teacher_id",me.id)]);$("lessons").innerHTML=(l.data||[]).map(x=>`<label class="block py-1"><input class="lp" type="checkbox" value="${x.id}"> ${esc(x.title)}</label>`).join("")||"Chưa có bài học.";$("quiz").innerHTML='<option value="">-- Chọn Quiz --</option>'+(q.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")};
$("gen").onclick=async()=>{let ids=[...document.querySelectorAll(".lp:checked")].map(x=>x.value),sum=+$("r").value + +$("u").value + +$("a").value;if(sum!==100)return msg("Tổng NB + TH + VD phải bằng 100%.");if(!ids.length&&!$("extra").value.trim())return msg("Chọn bài học hoặc dán văn bản nguồn.");let {data:{session}}=await s.auth.getSession();$("gen").disabled=true;$("gen").textContent="AI đang tạo...";try{let z=await fetch("https://drfcejvmyhzorwepndta.supabase.co/functions/v1/generate-quiz-ai-v3",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({lessonIds:ids,extraText:$("extra").value,count:+$("count").value,ratios:{remember:+$("r").value,understand:+$("u").value,apply:+$("a").value}})}),x=await z.json();if(!z.ok)throw Error(x.error);qs=x.questions||[];render();msg(`AI đã tạo ${qs.length} câu. Hãy duyệt trước khi lưu.`,true)}catch(e){msg(e.message)}finally{$("gen").disabled=false;$("gen").textContent="✨ Tạo câu hỏi V3"}};
function render(){let c={};qs.forEach(x=>c[x.level]=(c[x.level]||0)+1);$("stats").textContent=`Nhận biết ${c["Nhận biết"]||0} • Thông hiểu ${c["Thông hiểu"]||0} • Vận dụng ${c["Vận dụng"]||0}`;$("save").classList.toggle("hidden",!qs.length);$("list").innerHTML=qs.map((x,i)=>`<div class="bg-white p-5 rounded-2xl shadow"><label><input class="pick" data-i="${i}" type="checkbox" checked> <b>Câu ${i+1}</b> • ${esc(x.level)} • ${esc(x.source_title)}</label><textarea class="q w-full border p-2 mt-2" data-i="${i}">${esc(x.question_text)}</textarea>${["a","b","c","d"].map(k=>`<div class="flex gap-2 mt-2"><b>${k.toUpperCase()}.</b><input class="op w-full border p-2" data-i="${i}" data-k="${k}" value="${esc(x["option_"+k])}"></div>`).join("")}<div class="mt-2">Đáp án <select class="ans border p-2" data-i="${i}">${["A","B","C","D"].map(a=>`<option ${a===x.correct_answer?"selected":""}>${a}</option>`).join("")}</select></div><input class="exp w-full border p-2 mt-2" data-i="${i}" value="${esc(x.explanation)}"><div class="bg-amber-50 p-2 mt-2 text-sm">Căn cứ: ${esc(x.source_evidence)}</div></div>`).join("")}
$("save").onclick=async()=>{if(!$("quiz").value)return msg("Chọn Quiz đích.");let ps=[...document.querySelectorAll(".pick:checked")];let ex=await s.from("quiz_questions").select("question_order").eq("quiz_id",$("quiz").value).order("question_order",{ascending:false}).limit(1),st=(ex.data?.[0]?.question_order||0)+1;let rows=ps.map((p,n)=>{let i=+p.dataset.i;return{quiz_id:$("quiz").value,question_text:document.querySelector(`.q[data-i="${i}"]`).value,option_a:document.querySelector(`.op[data-i="${i}"][data-k="a"]`).value,option_b:document.querySelector(`.op[data-i="${i}"][data-k="b"]`).value,option_c:document.querySelector(`.op[data-i="${i}"][data-k="c"]`).value,option_d:document.querySelector(`.op[data-i="${i}"][data-k="d"]`).value,correct_answer:document.querySelector(`.ans[data-i="${i}"]`).value,explanation:document.querySelector(`.exp[data-i="${i}"]`).value,question_order:st+n}});let z=await s.from("quiz_questions").insert(rows);if(z.error)return msg(z.error.message);msg(`Đã lưu ${rows.length} câu vào Quiz.`,true)};
init();</script></body></html>
